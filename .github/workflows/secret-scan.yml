name: secret-scan

# Rankwise1 is the LIVE public site (rankwise.ca via GitHub Pages). Before
# 2026-07-24 it had NO pre-push hook and NO CI at all — a credential pushed here
# by any publisher (publish_portal_page.py / publish_system_map.py / sync_queue.py)
# or by hand would reach the public repo history ungated (sysmap classification
# finding, 2026-07-24). This is the compensating control: the same stdlib scanner
# the dashboard uses, re-run on every push/PR. No external action (avoids the
# unpinned-action supply-chain exposure). A local pre-push hook mirrors it for
# pushes that originate on the operator's machine.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan tracked files for credentials
        run: python3 scripts/secret_scan.py --all
