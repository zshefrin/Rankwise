      'Signed in as ' + (userEmail() || 'this account') + '.',
      '<p style="margin:0 0 14px">This account has no access assigned yet. Email ' +
      '<a href="mailto:zshef@rankwise.ca" style="color:var(--accent)">zshef@rankwise.ca</a> and Zack will set you up.</p>' +
      '<button style="width:100%" onclick="logout()">Log out</button>');
    return;
  }
  if (role === "operator" && !window._showConsole) return renderOps();
  // _showConsole is STICKY (finding 16): an operator who opened the dial console
  // stays there across logged calls, refreshes, and bare render()s. It is cleared
  // only by the explicit "← Operator cockpit" exit and by logout — NOT here, where
  // the old one-shot reset ejected the operator back to the cockpit every log.
  // The flag is also hash-routed (#view=dial, Pass X) so Back closes the console and
  // a hard refresh honestly restores it (see opsOpenConsole/opsCloseConsole/popstate).
  // Swap-once (finding 2): keep the current console on screen during a background
  // refetch (only blank on the FIRST paint, when no console exists yet). A bare
  // 'Loading…' wipe on every focus-regain destroyed in-progress notes + scroll and
  // defeated renderSeller's in-place preservation.
  if (!app.querySelector('.seller-hero')) app.innerHTML = '<h1>Dial Console</h1><p class="mut">Loading…</p>';
  else app.classList.add('seller-refreshing');
  // Generation stamp (finding 10): logCall() does an optimistic in-place repaint and
  // bumps _renderGen. A background render() (focus-regain refetch) that was already
  // in flight would otherwise resolve later and clobber that optimistic row with a
  // server view that hasn't indexed the just-logged call yet. Bail if superseded.
  const _rGen = (window._renderGen = (window._renderGen || 0) + 1);
  const [queue, log, snapRows] = await Promise.all([
    rest("seller_queue?select=*&order=rank.asc"),
    // Trimmed to the columns the console reads (was select=*; the log is up to
    // 1,000 rows — finding 55). Cap tightened to 300 (ticket
    // seller-call-log-fetch-cap): the console only needs the newest row per
    // slug for attempt pills / callback state, so 300 gives ample headroom
    // over the active dial-queue size without the payload scaling unbounded
    // with total historical call volume. fetchSellerCallLog() layers the
    // structured-call-outcome-fields two-tier fallback on top of this same list.
    fetchSellerCallLog(),
    rest("seller_ops_snapshot?select=payload,updated_at&id=eq.1"),
  ]);
  app.classList.remove('seller-refreshing');        // fetch settled — undim (swap-once, finding 2)
  if (queue === null) return;                       // session dead; render() already fired
  if (_rGen !== window._renderGen) return;          // a logCall repaint superseded this fetch (finding 10)
  // The call queue IS the console. If it failed, show the failure — do not paint
  // an empty dial list, which reads as "no prospects" to a seller mid-shift.
  // Hard-fail ONLY on the queue — it IS the console (finding 7). The log and the
  // coaching snapshot are secondary: their fallbacks below degrade to [] / null so a
  // failed coaching-snapshot fetch can't blank the whole dial console mid-shift.
  const _err = bad(queue) ? queue : null;
  if (_err) { window._showConsole = (role === "operator"); app.innerHTML = errorCard(_err.__error, "render()"); return; }
  if (!Array.isArray(queue)) { app.innerHTML = errorCard("parse", "render()"); return; }
  // Cache the fetched data so a logged call repaints from memory instead of
  // refetching the full queue + 1,000-row log every time (findings 21/55).
  window._sellerData = {
    role: role, queue: queue,
    log: Array.isArray(log) ? log : [],
    snap: (snapRows && snapRows[0] && snapRows[0].payload) || null,
    snapAt: (snapRows && snapRows[0] && snapRows[0].updated_at) || null,
  };
  window._lastFetchMs = Date.now();
  return renderSeller(window._sellerData);
}

// Paint the dial console from already-fetched data (window._sellerData). render()
// calls this after a fetch; logCall() calls it directly after mutating the cache in
// place, so a logged call no longer blanks-and-refetches the whole console (finding 21).
async function renderSeller(data) {
  const app = $("#app");
  // Last-resort net (finding 1): a malformed snapshot field (a truthy non-array where
  // an array is expected) would otherwise throw mid-build and freeze the console on the
  // 'Loading…' left by render(). Fail loud with the honest read-error card instead.
  try {
  const role = data.role, queue = data.queue, snap = data.snap, snapAt = data.snapAt;
  const rows = Array.isArray(data.log) ? data.log : [];
  // In-place repaint path: a seller console is already on screen, so preserve scroll
  // position and the rail search/filter across the swap (finding 21).
  const inPlace = !!document.querySelector('.seller-hero');
  const _sy = window.scrollY;
  const _railSearchEl = document.querySelector('.rail-search');
  const _railSearch = _railSearchEl ? _railSearchEl.value : '';
  const _railChipEl = document.querySelector('.rf-chip.active');
  const _railChip = (_railChipEl && _railChipEl.dataset) ? _railChipEl.dataset.f : 'all';
  const today = ptDay(new Date());
  const wkStart = weekStartPT();
  const todayRows = rows.filter((r) => ptDay(r.called_at) === today);
  const weekRows = rows.filter((r) => ptDay(r.called_at) >= wkStart);
  const doneToday = {}; todayRows.forEach((r) => { if (r.prospect_slug && !doneToday[r.prospect_slug]) doneToday[r.prospect_slug] = r.disposition; });
  const attempts = {}; rows.forEach((r) => { if (r.prospect_slug) (attempts[r.prospect_slug] = attempts[r.prospect_slug] || []).push(r); });
  // Terminal-done (W-3): a lead whose MOST-RECENT disposition (attempts are newest-first) is
  // terminal (DNC/declined/wrong number) stays sunk on every day, not just the day it was set,
  // so it never resurfaces as a fresh top card. no_answer/voicemail/connect still recycle.
  const terminalDone = {};
  for (const slug in attempts) { const l = attempts[slug][0]; if (l && TERMINAL_DISP[l.disposition]) terminalDone[slug] = l.disposition; }
  const sunk = Object.assign({}, terminalDone, doneToday);   // today's disposition label wins
  const phoneBySlug = {}; (queue || []).forEach((p) => { phoneBySlug[p.slug] = p.phone || ""; });
  const cnt = (rs, f) => rs.filter(f).length;
  const isPickup = (r) => ["connect", "declined", "booked"].includes(r.disposition);
  const isConvo = (r) => r.conversation || r.disposition === "booked";
  const cards = (queue || []).slice().sort((a, b) => (a.slug in sunk ? 1 : 0) - (b.slug in sunk ? 1 : 0) || a.rank - b.rank);
  const remainingCards = cards.filter((p) => !(p.slug in sunk));

  // ── Callback state model (callback-first-class ticket) ───────────────────
  // Derived from the append-only seller_call_log: the NEWEST row per slug owns the
  // open callback (also picks up pre-migration "CALLBACK <when> —" notes); a newer
  // row without one completes it. States:
  //   overdue     — promised time has passed (dial these FIRST)
  //   due_soon    — due within the next 2h (the dial-shift horizon)
  //   scheduled   — open, further out (stays in rank order; not actionable yet)
  //   rescheduled — open, and an OLDER row also carried a callback (time was moved)
  //   completed   — a callback existed historically; none open now
  //   dnc_blocked — open callback on a DNC-flagged lead: NEVER dialed, never prioritized
  // (in_progress/failed aren't derivable from an append-only log with no session
  // marker — a failed attempt gets re-logged and becomes rescheduled or completed.)
  const cbState = {};
  const _cbNames = {};
  const _nowMs = Date.now(), _soonMs = 2 * 3600 * 1000;
  for (const slug in attempts) {
    const rows = attempts[slug]; // newest-first
    const latest = rows[0];
    let at = latest.callback_at || null;
    if (!at && /^CALLBACK ([0-9T:\-]+)/.test(latest.note || "")) at = (latest.note.match(/^CALLBACK ([0-9T:\-]+)/) || [])[1];
    const hadEarlier = rows.slice(1).some((r) => r.callback_at);
    _cbNames[slug] = latest.prospect_name;
    if (at) {
      const t = new Date(at).getTime();
      let state;
      if (latest.disposition === "do_not_contact") state = "dnc_blocked";
      else if (t <= _nowMs) state = "overdue";
      else if (t <= _nowMs + _soonMs) state = "due_soon";
      else state = hadEarlier ? "rescheduled" : "scheduled";
      cbState[slug] = { state, at, note: latest.note || "" };
    } else if (hadEarlier) {
      cbState[slug] = { state: "completed", at: null, note: "" };
    }
  }
  // Intel-level DNC also blocks: a promised callback does not override a DNC hold.
  cards.forEach((p) => {
    const s = cbState[p.slug];
    if (s && s.at && p.intel && p.intel.dnc) s.state = "dnc_blocked";
  });
  window._cbState = cbState;
  // Open, dialable callbacks (blocked ones surface via the DNC pill, never the queue).
  const cbs = [];
  for (const slug in cbState) {
    const s = cbState[slug];
    if (s.at && s.state !== "dnc_blocked") cbs.push({ slug, name: _cbNames[slug], at: s.at, note: s.note });
  }
  cbs.sort((a, b) => String(a.at).localeCompare(String(b.at)));
  const dueCallbacks = cbs.filter((c) => cbState[c.slug].state === "overdue");
  // A promised callback is a trust obligation, not just another signal. The RENDERED
  // queue is callback-first (the old code computed a callback-first list but only used
  // it to pick the auto-focused card — the visible rail still sold rank order):
  // overdue (earliest promise first) → due-soon → fresh leads by rank; sunk cards last.
  // Priorities: 0 overdue · 1 due-soon · 2 fresh · 3 DO-NOT-DIAL (codex review
  // DEFECT-4 fix: dnc_blocked/intel.dnc previously fell through as "fresh" (2), so
  // a DNC lead could sort high and even become the auto-focused next dial. They now
  // sort LAST and are excluded from nextDial/auto-advance entirely — still rendered
  // in the rail (browsable, chip explains why) but never dial-prompted.)
  const _cbPri = { overdue: 0, due_soon: 1 };
  const _pri = (p) => {
    const s = cbState[p.slug];
    if ((s && s.state === "dnc_blocked") || (p.intel && p.intel.dnc)) return 3;
    return s && _cbPri[s.state] !== undefined ? _cbPri[s.state] : 2;
  };
  const railCards = cards.slice().sort((a, b) => {
    const sa = a.slug in sunk ? 1 : 0, sb = b.slug in sunk ? 1 : 0;
    if (sa !== sb) return sa - sb;
    const pa = _pri(a), pb = _pri(b);
    if (pa !== pb) return pa - pb;
    if (pa < 2) {
      // numeric compare — `at` mixes ISO-with-offset (DB) and zone-less note
      // timestamps; lexical compare mis-orders across formats (edge review LOW-1).
      const ta = new Date(cbState[a.slug].at).getTime(), tb = new Date(cbState[b.slug].at).getTime();
      return (isNaN(ta) ? Infinity : ta) - (isNaN(tb) ? Infinity : tb);
    }
    return (a.rank || 0) - (b.rank || 0);
  });
  const callbackCards = railCards.filter((p) => !(p.slug in sunk) && _pri(p) < 2);
  const freshCards = railCards.filter((p) => !(p.slug in sunk) && _pri(p) === 2);
  // prioritizedCards deliberately EXCLUDES priority-3 (DNC) — nextDial can never
  // land on a lead the seller must not call.
  const prioritizedCards = callbackCards.concat(freshCards);
  const nextDial = prioritizedCards[0] || null;
  const intelReady = cards.filter((c) => c.intel && Object.keys(c.intel || {}).length).length;
  const liveAudits = cards.filter((c) => c.audit_url).length;
  const dncHeld = cards.filter((c) => c.intel && c.intel.dnc).length;
  const trial = (snap && snap.trial) || {};
  const sellerTotals = (snap && snap.totals) || {};
  // Week-at-a-glance tiles are WEEKLY counts — 0 is a valid, honest zero and is never
  // ||-substituted with an all-time total (which would fake "on pace" for a seller who
  // has not dialled this week). Cumulative trial pace uses paceDials/paceConvos below.
  const zackDials = weekRows.length;
  const zackConvos = cnt(weekRows, isConvo);
  const zackBooked = cnt(weekRows, (r) => r.disposition === "booked");
  const trialDialGap = trial.configured ? Math.max(0, 200 - (Number(trial.dials) || 0)) : null;
  const trialConvoGap = trial.configured ? Math.max(0, 5 - (Number(trial.conversations) || 0)) : null;
  const missionOne = dueCallbacks.length
    ? { title:'Clear due callbacks first', sub:'Promised callbacks beat fresh outreach because trust is already open.' }
    : { title:'Start with the top open card', sub:'No callbacks are due. Use the verified hook and keep the first ask simple.' };
  const shiftTitle = dueCallbacks.length
    ? 'Start with promised callbacks'
    : (nextDial ? 'Next dial: ' + (nextDial.business_name || 'this prospect') : 'Queue cleared for today');
  const shiftSub = dueCallbacks.length
    ? plural(dueCallbacks.length, 'callback') + (dueCallbacks.length === 1 ? ' is' : ' are') + ' due now. Handle those before fresh outreach.'
    : (nextDial ? 'Open the top card, use the verified hook, and log the outcome before moving on.' : 'Nothing left in the active queue. Refresh if Zack has pushed more cards.');
  const focusCard = nextDial || cards[0] || null;

    h += '<div class="client-workspace">';
    clientApprovals.concat(clientAsks).slice(0, 6).forEach((ask) => {
      const it = planParts(ask);
      const status = ask.status || ask.stage || ask.type || 'open';
      const rid = Number(ask.request_id || ask.client_request_id || 0);
      const liveId = roleOf() !== 'operator' && Number.isFinite(rid) && rid > 0;
      h += '<div class="client-ask"><div class="client-ask__top"><div><div class="client-ask__title">' + esc(it.title || 'Approval request') + '</div>' +
        '<div class="client-ask__sub">' + esc([status, ask.due || ask.due_at || it.date, it.sub || ask.detail || ask.note].filter(Boolean).join(' · ')) + '</div></div>' +
        '<span class="pill warn">' + esc(status) + '</span></div>' +
        '<div class="client-btnrow">' + (liveId ?
          '<button class="client-action" onclick="clientApprove(this,' + rid + ')">Approve</button>' +
          '<button class="client-action" onclick="clientCompose(' + rid + ',\'request_changes\')">Request changes</button>' :
          clientContactBtn('Message Rankwise', it.title)) +
        '</div>' + (liveId ? '' : SOON_NOTE) + '</div>';
    });
    clientUploads.slice(0, 4).forEach((ask) => {
      const it = planParts(ask);
      h += '<div class="client-ask"><div class="client-ask__top"><div><div class="client-ask__title">' + esc(it.title || 'Upload requested asset') + '</div>' +
        '<div class="client-ask__sub">' + esc([ask.asset_type || ask.type || 'asset', ask.due || ask.due_at || it.date, it.sub || ask.detail].filter(Boolean).join(' · ')) + '</div></div>' +
        '<span class="pill">upload</span></div>' +
        '<div class="client-btnrow">' + clientContactBtn('Message Rankwise', it.title) + '</div>' + SOON_NOTE + '</div>';
    });
    h += '</div>';
  } else if (pendingSetupAsks.length) {
    // No approvals/uploads outstanding, but onboarding steps are still open — surface
    // them here (single source of truth) instead of a misleading "Nothing pending".
    h += '<div class="client-workspace">' + pendingSetupAsks.slice(0, 6).map((ask) =>
      '<div class="client-ask"><div class="client-ask__top"><div><div class="client-ask__title">' + esc(ask.title) + '</div>' +
      '<div class="client-ask__sub">' + esc(ask.detail || 'complete this in the setup checklist above') + '</div></div>' +
      '<span class="pill warn">' + esc(ask.status) + '</span></div></div>').join('') + '</div>' +
      '<p class="mut" style="margin-top:8px">These are your open onboarding steps — resolve them in “Setup and first 30 days” above.</p>';
  } else {
    h += '<div class="attention-list"><div class="attention-item ok"><div class="timeline-dot"></div><div><b>No asks from us right now</b><span>Approvals, uploads, access requests, and content comments will appear here when needed.</span></div></div></div>';
  }
  h += '</section>';

  h += '<div class="role-grid two">';
  if ((p.rankings || []).length) {
    // When nothing ranks yet, a 12-row wall of dashes reads as "we rank nowhere."
    // Collapse it to a compact baseline + ETA (review finding :61); show the table
    // only once at least one term is actually ranking.
    const _rankedRows = p.rankings.filter((r) => r.local != null || r.organic != null).length;
    // rankTotal is only a real denominator when the payload supplies one. The rankings
    // list is display-capped upstream, so its length is never presented as the total.
    const rankShown = p.rankings.length;
    const rankTotal = _rankDataMismatch ? null : _trackedKpi;
    const rankCapNote = rankTotal != null && rankTotal > rankShown ? ' Showing the top ' + rankShown + ' of ' + rankTotal + '.' : '';
    if (_rankedRows === 0) {
      h += '<section class="role-card"><h3>Where you rank on Google</h3>' +
        '<p class="role-empty">Baseline captured for ' + (rankTotal != null ? '<b>' + esc(rankTotal) + '</b> target terms' : 'the current tracked terms') + ' — none are in the tracked top results yet. This is the starting line we grow from; first movement usually shows over the first few content + local cycles.</p></section>';
    } else {
      // Per-row measurement provenance (46d1f73): device / location / checked_at now ride
      // each ranking row. Show a compact "desktop · <location> · checked <date>" subline so a
      // client can tell where/when/how a rank was measured. Honest-omit any field the row lacks.
      const _rankProv = (r) => [r.device, r.location, r.checked_at ? 'checked ' + ptDayShort(r.checked_at) : ''].filter(Boolean).join(' · ');
      h += '<section class="role-card"><h3>Where you rank on Google</h3>' +
        '<p class="mut" style="margin:0 0 8px">Ranking in <b>' + esc(_rankedKpi != null ? _rankedKpi : _rankedRows) + '</b>' + (rankTotal != null ? ' of ' + esc(rankTotal) : ' tracked terms shown in this snapshot') + '.</p>' +
        '<table class="role-table"><tr><th>Search</th><th class="num">Maps</th><th class="num">Organic</th></tr>' +
        p.rankings.map((r) => { const _prov = _rankProv(r);
          return '<tr><td>' + esc(r.keyword) + (_prov ? '<span class="mut" style="display:block;font-size:var(--fs-1);font-weight:400">' + esc(_prov) + '</span>' : '') + '</td><td class="num">' + (r.local == null ? "—" : "#" + esc(r.local)) + '</td><td class="num">' + (r.organic == null ? "—" : "#" + esc(r.organic)) + '</td></tr>'; }).join("") +
        '</table><p class="mut" style="margin-top:9px">A dash means the term is not in the tracked top results yet.' + esc(rankCapNote) + '</p></section>';
    }
  } else {
    h += '<section class="role-card"><h3>Where you rank on Google</h3><p class="role-empty">Rank tracking appears after the next SERP capture.</p></section>';
  }

  if ((p.traffic || []).length) {
    // Drop only exact DUPLICATE WEEK LABELS (a genuine double-write) — NOT rows that merely
    // share values: build_traffic emits overlapping 28-day windows, so a sparse/new client
    // legitimately has consecutive equal-valued weeks that must stay visible (gate review).
    // Addresses finding :98; singularize "1 click" (finding :121).
    const _seenWk = Object.create(null);   // null-proto: a week literally named "__proto__"/"toString" can't false-dup
    const _traffic = p.traffic.filter((w) => { const _k = String(w.week == null ? '' : w.week); if (_k && _seenWk[_k]) return false; _seenWk[_k] = 1; return true; });
    const mx = Math.max.apply(null, _traffic.map((w) => w.clicks || 0).concat([1]));
    h += '<section class="role-card"><h3>Search clicks trend</h3>' +
      _traffic.map((w) => { const _c = Number(w.clicks || 0), _i = Number(w.impressions || 0);
        return '<div class="role-row"><b>' + esc(ptDayShort(w.week)) + '</b><span>' + esc(_c) + ' click' + (_c === 1 ? '' : 's') + ' · ' + esc(_i) + ' impression' + (_i === 1 ? '' : 's') + '</span></div>' +
          meter(_c, mx, _c ? 'ok' : ''); }).join("") +
      '<p class="mut" style="margin-top:8px">Search clicks are organic Google Search only — "Site sessions" above counts visits from every source.</p></section>';
  } else {
    h += '<section class="role-card"><h3>Search clicks trend</h3><p class="role-empty">Traffic trend lands after Google Search Console access is connected.</p></section>';
  }
  h += '</div>';

  h += '<div class="role-grid two">';
  h += '<section class="role-card"><h3>Reputation</h3>';
  if (reviews.count != null) {
    h += '<div class="metric-grid">' +
      metric('Reviews', reviews.count, 'Google Business Profile', 'info') +
      metric('Rating', reviews.rating != null ? reviews.rating : '—', reviews.note || '', reviews.rating == null ? 'info' : (_repNeedsLift ? 'warn' : 'ok')) +
      '</div>';
  } else {
    h += '<p class="role-empty">Review data has not been connected yet.</p>';
  }
  h += '</section>';

  h += '<section class="role-card"><h3>AI visibility</h3>';
  if (aeo.citation_rate_pct != null) {
    h += '<div class="role-row"><b>Queries cited</b><span>' + esc(aeo.cited || 0) + ' of ' + esc(aeo.total || 0) + ' checked</span></div>' +
      '<div class="role-row"><b>Citation rate</b><span>' + esc(aeo.citation_rate_pct) + '% of checked queries</span></div>';
    if ((aeo.engines || []).length) {
      h += '<ul class="mini-list" style="margin-top:9px">' + aeo.engines.map((e) =>
        miniItem(prettyKey(e.engine), e.cited + ' of ' + e.total + ' cited · ' + e.rate_pct + '%', e.rate_pct > 0 ? 'ok' : 'warn')).join("") + '</ul>';
    }
  } else {
    h += '<p class="role-empty">AI citation tracking appears once the citation snapshot is available.</p>';
  }
  h += '</section></div>';

  h += '<div class="role-grid two">';
  h += '<section class="role-card"><h3>What needs attention</h3>';
  if (attention.length) {
    h += '<div class="attention-list">' + attention.slice(0, 5).map((a) =>
      '<div class="attention-item ' + esc(a.tone || '') + '"><div class="timeline-dot"></div><div><b>' +
      esc(a.title) + '</b><span>' + esc(a.sub) + '</span></div></div>').join("") + '</div>';
  } else {
    h += '<div class="attention-list"><div class="attention-item ok"><div class="timeline-dot"></div><div><b>No urgent issues in this snapshot</b><span>We will keep watching rankings, traffic, reviews, and AI citations.</span></div></div></div>';
  }
  h += '</section>';

  h += '<section class="role-card"><h3>' + esc(plannedTitle) + '</h3>';
  if (planned.length) {
    h += '<div class="timeline">' + planned.slice(0, 6).map((item) => {
      const it = planParts(item);
      return '<div class="timeline-item"><span class="timeline-dot"></span><div><div class="timeline-title">' + esc(it.title) + '</div>' +
        (it.sub ? '<div class="timeline-sub">' + esc(it.sub) + '</div>' : '') + '</div><div class="timeline-date">' + esc(it.date || 'planned') + '</div></div>';
    }).join("") + '</div>';
  } else {
    h += '<p class="role-empty">' + esc(planItems.length ? 'Planned content will show here once Zack publishes the next content queue.' : 'Upcoming work will show here once the next delivery plan is ready.') + '</p>';
  }
  h += '</section></div>';

  if (tracking.length) {
    h += '<section class="role-card"><h3>What we are tracking</h3><div class="signal-board">' +
      tracking.slice(0, 6).map((item) => {
        const it = planParts(item);
        return '<div class="signal-card"><div class="s-k">' + esc(it.date || it.sub || 'signal') + '</div><div class="s-v">' + esc(it.title) + '</div>' +
          (it.sub && it.sub !== it.date ? '<div class="s-n">' + esc(it.sub) + '</div>' : '') + '</div>';
      }).join("") + '</div></section>';
  }

  h += '<section class="role-card"><h3>Proof timeline</h3>';
  if (proofTimeline.length) {
    h += '<div class="timeline">' + proofTimeline.slice(0, 8).map((item) => {
      const it = planParts(item);
      const status = item.status || item.stage || item.type || it.sub || 'update';
      return '<div class="timeline-item"><span class="timeline-dot"></span><div><div class="timeline-title">' + esc(it.title) + '</div>' +
        '<div class="timeline-sub">' + esc([status, item.note || item.detail || it.sub].filter(Boolean).join(' · ')) + '</div></div><div class="timeline-date">' + esc(item.date || item.updated_at || it.date || 'live') + '</div></div>';
    }).join("") + '</div>';
  } else {
    h += '<p class="role-empty">Proof timeline appears as shipped work and metric movement accumulate.</p>';
  }
  h += '</section>';

  h += '<section class="role-card"><h3>Files and reports</h3>';
  if (clientReports.length) {
    h += '<div class="timeline">' + clientReports.slice(0, 8).map((item) => {
      const it = planParts(item);
      const url = safeHref(item.url || item.href || item.file_url || '');
      return '<div class="timeline-item"><span class="timeline-dot"></span><div><div class="timeline-title">' + esc(it.title || item.name || 'Report') + '</div>' +
        '<div class="timeline-sub">' + esc([item.type || item.kind || 'file', item.status || it.sub].filter(Boolean).join(' · ')) + '</div></div>' +
        '<div class="timeline-date">' + (url ? '<a href="' + esc(url) + '" style="color:var(--accent)" target="_blank" rel="noopener">Open</a>' : esc(item.date || 'ready')) + '</div></div>';
    }).join("") + '</div>';
  } else {
    h += '<p class="role-empty">Reports, shared assets, and approved deliverables will appear here once the storage path is connected.</p>';
  }
  h += '</section>';

  h += '<section class="role-card"><h3>Work plan</h3><div class="work-split">' +
    '<div><div class="role-kicker">Done recently</div>' +
    ((p.wins || []).length ? '<ul class="mini-list" style="margin-top:8px">' + p.wins.map((w) => miniItem(w, '', 'ok')).join("") + '</ul>' : '<p class="role-empty">Recent work will show here after the first delivery cycle.</p>') +
    '</div><div><div class="role-kicker">Up next</div>' +
    ((p.next || []).length ? '<ul class="mini-list" style="margin-top:8px">' + p.next.map((w) => miniItem(w, '', 'info')).join("") + '</ul>' : '<p class="role-empty">Next actions are being planned.</p>') +
    '</div></div></section>';

  h += '<p class="mut" style="margin:14px 2px">Questions any time: <a href="mailto:zshef@rankwise.ca" style="color:var(--accent)">zshef@rankwise.ca</a> · <a href="tel:+17788870311" style="color:var(--accent)">+1 778 887 0311</a></p></div>';
  app.innerHTML = h;
  // Stamp the fetch clock (finding 4) ONLY on this successful full-snapshot paint —
  // NOT on the no-snapshot / failure returns above — so the visibility-change stale
  // gate (>10 min) actually engages and every focus-regain stops force-reloading.
  window._lastFetchMs = Date.now();
  opsStartFreshTick();   // 60s relative-timestamp tick — role-agnostic, idempotent (finding 5)
  } catch (e) { app.innerHTML = errorCard('parse', 'clientRefresh()'); }
}
// A real client, viewing their OWN dashboard — key is never inferred, always undefined.
function renderClientForCurrentUser() { return renderClientImpl(undefined, false); }
// An operator previewing a specific client — clientKey is REQUIRED. Never silently falls
// back to current-user mode: that would read the OPERATOR's own (nonexistent) client rows,
// not the previewed tenant's.
function renderClientPreview(clientKey) {
  if (!clientKey) { toast("No client selected to preview", "err"); return; }
  return renderClientImpl(clientKey, true);
}
// The single refresh/refetch entry point (header Refresh, failed-section Retry, focus-regain
// staleness refetch). Resolves mode from the CURRENT viewer's own role — never from whether
// window._clientKey happens to be set — which is what let a real client's own refresh silently
// flip into preview semantics (see renderClientImpl's header comment).
function clientRefresh() {
  return roleOf() === 'operator' ? renderClientPreview(window._clientKey) : renderClientForCurrentUser();
}
// Thin dispatcher for anything unlisted: an operator with an explicit key previews that
// client; anything else (no key, or a real client on their own JWT) renders their own view.
function renderClient(key) {
  return (roleOf() === 'operator' && key) ? renderClientPreview(key) : renderClientForCurrentUser();
}
render();
</script>
