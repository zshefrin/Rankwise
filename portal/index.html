<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rankwise — Dashboard</title>
<style>
  :root { --bg:#101418; --card:#1a2026; --line:#2a323a; --text:#e8edf2; --mut:#8a97a3;
          --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --accent:#60a5fa; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, system-ui, sans-serif; padding:12px; max-width:560px; margin:0 auto; }
  /* Dial Console gets a wide desktop canvas (list + dossier); text sections stay narrow for readability. */
  body.dial { max-width:1180px; }
  body.dial .dial-top { max-width:720px; }
  h1 { font-size:18px; margin:8px 0 2px; } .mut { color:var(--mut); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { border:0; border-radius:9px; padding:10px 12px; font-size:14px; font-weight:600; cursor:pointer; background:#2b3640; color:var(--text); }
  button.primary { background:var(--accent); color:#0b1220; }
  button.disp { flex:1 1 30%; padding:12px 6px; }
  button.disp.sel { outline:2px solid var(--accent); }
  button:disabled { opacity:.45; }
  input, textarea { width:100%; background:#0d1115; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:10px; font-size:15px; }
  a.tel { display:block; text-align:center; background:var(--ok); color:#06281c; font-weight:800; font-size:18px; padding:13px; border-radius:10px; text-decoration:none; margin:8px 0; }
  .banner { padding:10px 12px; border-radius:10px; font-size:14px; margin:8px 0; }
  .banner.bad { background:#3a1d1d; color:var(--bad); } .banner.ok { background:#15302a; color:var(--ok); }
  .banner.warn { background:#332a12; color:var(--warn); }
  .tally { display:flex; gap:6px; text-align:center; margin:8px 0; }
  .tally div { flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 2px; }
  .tally b { display:block; font-size:20px; }
  .tally.wk b { font-size:16px; }
  .bar { height:8px; background:#0d1115; border-radius:99px; overflow:hidden; margin:4px 0; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .done { opacity:.55; } .pill { font-size:12px; padding:2px 8px; border-radius:99px; background:#2b3640; }
  .pill.ok { background:#15302a; color:var(--ok); } .pill.warn { background:#332a12; color:var(--warn); }
  .pill.bad { background:#3a1d1d; color:var(--bad); }
  details summary { cursor:pointer; color:var(--accent); font-size:14px; margin:6px 0; }
  .opener { background:#0d1115; border-left:3px solid var(--accent); padding:10px; border-radius:8px; font-size:14px; margin:6px 0; font-style:italic; }
  /* ── dial card: site condition ─────────────────────────────────────── */
  .dc__hd { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .dc__nm { font-size:16px; font-weight:700; letter-spacing:-.012em; line-height:1.2; }
  .dc__ct { color:var(--mut); font-size:12.5px; margin-top:2px; }
  .dc__rk { flex:none; font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--mut); padding-top:2px; }
  .hook { display:flex; gap:8px; align-items:flex-start; margin:11px 0 0; padding:10px 12px; border-radius:10px; font-size:14.5px; font-weight:650; line-height:1.34; }
  .hook i { font-style:normal; flex:none; }
  .hook--bad  { background:rgba(248,113,113,.12); color:#fca5a5; }
  .hook--warn { background:rgba(251,191,36,.13);  color:#fcd34d; }
  .hook--info { background:rgba(96,165,250,.13);  color:#93c5fd; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; align-items:center; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:7px; background:#222c34; color:#cdd6df; display:inline-flex; gap:5px; align-items:center; line-height:1.5; }
  .chip--bad { background:rgba(248,113,113,.15); color:#fca5a5; }
  .chip--ok  { background:rgba(52,211,153,.15);  color:#6ee7b7; }
  .chip--warn{ background:rgba(251,191,36,.15);  color:#fcd34d; }
  .dots { display:inline-flex; gap:3px; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .gapv { margin:12px 0 0; padding:10px 12px; background:#0e141a; border:1px solid var(--line); border-radius:10px; }
  .gapv__t { font-size:11px; color:var(--mut); margin-bottom:8px; }
  .gr { display:flex; align-items:center; gap:9px; margin:5px 0; }
  .gr__l { width:88px; flex:none; font-size:11.5px; color:#aab4bd; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gr__t { flex:1; height:8px; background:#141b22; border-radius:99px; overflow:hidden; }
  .gr__f { display:block; height:100%; border-radius:99px; min-width:6px; }
  .gr__f.them { background:#fb7185; } .gr__f.riv { background:#64748b; }
  .gr__n { width:52px; flex:none; text-align:right; font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums; color:#cdd6df; }
  .gr__n.them { color:#fca5a5; }
  .dccall { display:flex; align-items:center; justify-content:center; gap:9px; margin:12px 0 0; background:var(--ok); color:#04130d; font-weight:800; font-size:18px; padding:14px; border-radius:11px; text-decoration:none; font-variant-numeric:tabular-nums; transition:transform .12s ease, filter .12s ease; }
  .dccall:active { transform:scale(.985); filter:brightness(.94); }
  .dccall.dnc { background:rgba(248,113,113,.12); color:#fca5a5; font-weight:700; font-size:14px; }
  .sec { margin:11px 0 0; padding:10px 12px; border-radius:10px; }
  .sec__l { font-size:11px; font-weight:700; margin-bottom:7px; }
  .sec--open { background:rgba(96,165,250,.10); } .sec--open .sec__l { color:#93c5fd; }
  .sec--open p { font-size:13.5px; line-height:1.4; color:#dbe7f5; margin:0; }
  .sec--say { background:rgba(52,211,153,.08); } .sec--say .sec__l { color:#6ee7b7; }
  .pt { display:flex; gap:8px; align-items:flex-start; font-size:13.5px; line-height:1.34; margin:5px 0; color:#dceee6; }
  .pt b { color:#34d399; flex:none; font-weight:800; }
  .sec--avoid { background:rgba(248,113,113,.09); } .sec--avoid .sec__l { color:#fca5a5; }
  .sec--avoid .sec__l span { font-weight:500; color:var(--mut); }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:12px; padding:3px 9px; border-radius:7px; background:rgba(248,113,113,.15); color:#f4a8a8; }
  /* ── console: list rail + dossier ─────────────────────────────────────── */
  .console { display:flex; gap:14px; align-items:flex-start; margin-top:10px; }
  .rail { flex:0 0 270px; display:flex; flex-direction:column; gap:6px; max-height:calc(100vh - 40px); overflow-y:auto; position:sticky; top:8px; }
  .dossier { flex:1; min-width:0; }
  .railrow { width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; cursor:pointer; color:var(--text); transition:border-color .12s, background .12s; }
  .railrow:hover { border-color:#3a4652; }
  .railrow.active { border-color:var(--accent); background:#18222c; }
  .railrow.done { opacity:.5; }
  .railrow__top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .railrow__nm { font-weight:650; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .railrow__sub { color:var(--mut); font-size:11.5px; margin-top:3px; display:flex; align-items:center; gap:6px; min-width:0; }
  .railrow__sub span.t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dossier-card { margin:0 !important; }
  .dgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; margin-top:2px; }
  .dcol { min-width:0; }
  .dback { display:none; margin-bottom:10px; background:#222c34; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer; }
  .verif { margin:11px 0 0; font-size:11.5px; color:var(--mut); display:flex; align-items:center; gap:7px; }
  .verif b { color:#6ee7b7; font-weight:600; }
  @media (max-width:900px) { .dgrid { grid-template-columns:1fr; gap:0; } }
  @media (max-width:760px) {
    .console { display:block; }
    .console .dossier { display:none; }
    .console.show .rail { display:none; }
    .console.show .dossier { display:block; }
    .console.show .dback { display:inline-flex; }
    .rail { position:static; max-height:none; }
  }
  .cond { font-size:12.5px; margin-top:6px; }
  .cond dl { display:grid; grid-template-columns:80px 1fr; gap:5px 10px; margin:0 0 4px; }
  .cond dt { color:var(--mut); } .cond dd { margin:0; }
  .cond__sec { font-size:11px; color:var(--mut); margin:11px 0 4px; }
  .maprow { display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:3px 0; }
  .maprow + .maprow, .cgrid div + div { border-top:1px solid var(--line); }
  .maprow .miss { color:var(--bad); font-weight:700; } .maprow .hit { color:var(--ok); font-weight:700; }
  .cgrid div { display:flex; justify-content:space-between; gap:8px; padding:3px 0; }
  @media (prefers-reduced-motion: reduce) { .dccall { transition:none; } }
  .kit { background:#0d1115; border-radius:8px; padding:10px; font-size:13px; white-space:pre-wrap; max-height:300px; overflow-y:auto; }
  label.cb { display:flex; gap:8px; align-items:center; font-size:14px; margin:8px 0; }
  label.cb input { width:auto; transform:scale(1.3); }
  .hist { font-size:13px; border-top:1px solid var(--line); padding:6px 0; }
  table.pay { width:100%; border-collapse:collapse; font-size:13px; }
  table.pay td, table.pay th { padding:4px 6px; text-align:left; border-bottom:1px solid var(--line); }
  #toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--accent); color:#0b1220; font-weight:700; padding:10px 18px; border-radius:99px; display:none; }

  /* ── Operator cockpit — scoped to body.ops only. Nothing below touches seller/client views. ── */
  body.ops { max-width:1120px; background:radial-gradient(1200px 500px at 80% -10%,#14202c 0%,transparent 60%) var(--bg); padding:0; -webkit-font-smoothing:antialiased; }
  body.ops .ops-wrap { max-width:1120px; margin:0 auto; padding:0 16px 64px; }
  body.ops header.ops-top { display:flex; align-items:center; gap:12px; padding:18px 0 14px; flex-wrap:wrap; }
  body.ops .ops-brand { display:flex; align-items:baseline; gap:10px; }
  body.ops .ops-brand h1 { font-size:19px; font-weight:650; letter-spacing:-.01em; margin:0; }
  body.ops .ops-brand .ops-tag { font-size:12px; color:#6b7884; }
  body.ops .ops-spacer { flex:1; }
  body.ops .ops-asof { font-size:12px; color:#6b7884; }
  body.ops .ops-iconbtn { background:#141a20; border:1px solid #2a323a; color:#9aa7b3; border-radius:9px; height:34px; padding:0 12px; font-size:13px; font-weight:550; cursor:pointer; transition:.15s cubic-bezier(.22,.61,.36,1); }
  body.ops .ops-iconbtn:hover { color:#eef2f6; border-color:#36424c; }
  body.ops nav.ops-tabs { position:sticky; top:0; z-index:20; display:flex; gap:2px; background:rgba(14,18,22,.82); backdrop-filter:blur(8px); border-bottom:1px solid #222a31; margin:0 -16px; padding:0 12px; overflow-x:auto; scrollbar-width:none; }
  body.ops nav.ops-tabs::-webkit-scrollbar { display:none; }
  body.ops .ops-tab { appearance:none; background:none; border:0; color:#9aa7b3; font:550 14px/1 -apple-system,system-ui,sans-serif; cursor:pointer; padding:13px 14px; position:relative; white-space:nowrap; transition:color .15s cubic-bezier(.22,.61,.36,1); display:flex; gap:7px; align-items:center; }
  body.ops .ops-tab:hover { color:#eef2f6; }
  body.ops .ops-tab[aria-selected="true"] { color:#eef2f6; }
  body.ops .ops-tab[aria-selected="true"]::after { content:""; position:absolute; left:14px; right:14px; bottom:-1px; height:2px; background:#60a5fa; border-radius:2px; }
  body.ops .ops-tab .ops-badge { background:#1f272e; color:#9aa7b3; font-size:11px; font-weight:650; padding:1px 7px; border-radius:99px; border:1px solid #2a323a; }
  body.ops .ops-tab .ops-badge.hot { background:#3a1c1c; color:#fca5a5; border-color:#4a2222; }
  body.ops section.ops-view { padding-top:18px; animation:ops-rise .22s cubic-bezier(.22,.61,.36,1); }
  body.ops section.ops-view[hidden] { display:none; }
  @keyframes ops-rise { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  @media (prefers-reduced-motion:reduce) { body.ops section.ops-view { animation:none; } }
  body.ops h2.ops-sec { font-size:12.5px; font-weight:650; letter-spacing:.04em; text-transform:uppercase; color:#6b7884; margin:2px 2px 10px; }
  body.ops .ops-nextmove { display:flex; align-items:center; gap:14px; background:linear-gradient(180deg,#18263a,#15202f); border:1px solid #2b3b53; border-radius:14px; padding:16px 18px; box-shadow:0 1px 0 rgba(255,255,255,.02) inset,0 8px 24px -16px rgba(0,0,0,.7); }
  body.ops .ops-nextmove .nm-i { width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:10px; background:#60a5fa; color:#0b1220; font-size:19px; }
  body.ops .ops-nextmove .nm-t { flex:1; min-width:0; }
  body.ops .ops-nextmove .nm-k { font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; color:#7fa9e0; font-weight:650; }
  body.ops .ops-nextmove .nm-h { font-size:16px; font-weight:600; margin-top:2px; }
  body.ops .ops-nextmove .nm-h span { color:#9aa7b3; font-weight:400; }
  body.ops .ops-grid-today { display:grid; gap:16px; margin-top:16px; grid-template-columns:1fr; }
  @media(min-width:900px) { body.ops .ops-grid-today { grid-template-columns:1.55fr 1fr; align-items:start; } }
  body.ops .ops-panel { background:#1a2026; border:1px solid #2a323a; border-radius:14px; box-shadow:0 1px 0 rgba(255,255,255,.02) inset,0 8px 24px -16px rgba(0,0,0,.7); }
  body.ops .ops-panel-h { display:flex; align-items:center; gap:8px; padding:13px 15px; border-bottom:1px solid #222a31; }
  body.ops .ops-panel-h b { font-size:14px; font-weight:600; }
  body.ops .ops-panel-h .ops-count { margin-left:auto; font-size:12px; color:#6b7884; font-weight:550; }
  body.ops ul.ops-needs { list-style:none; }
  body.ops .ops-need { display:flex; align-items:center; gap:13px; padding:13px 15px; border-top:1px solid #222a31; transition:background .15s cubic-bezier(.22,.61,.36,1); }
  body.ops .ops-need:first-child { border-top:0; }
  body.ops .ops-need:hover { background:#1f272e; }
  body.ops .ops-dot { width:9px; height:9px; border-radius:99px; flex:none; box-shadow:0 0 0 4px rgba(255,255,255,.02); }
  body.ops .ops-dot.bad { background:#f87171; }
  body.ops .ops-dot.warn { background:#fbbf24; }
  body.ops .ops-dot.info { background:#60a5fa; }
  body.ops .ops-dot.lo { background:#6b7884; }
  body.ops .ops-need .ops-body { flex:1; min-width:0; }
  body.ops .ops-need .ops-ttl { font-size:14.5px; font-weight:550; }
  body.ops .ops-need .ops-sub { font-size:12.5px; color:#9aa7b3; margin-top:1px; }
  body.ops .ops-need .ops-act { flex:none; }
  body.ops .ops-btn { appearance:none; border:1px solid #2a323a; background:#1f272e; color:#eef2f6; font:600 12.5px/1 -apple-system,system-ui,sans-serif; padding:8px 12px; border-radius:9px; cursor:pointer; transition:.15s cubic-bezier(.22,.61,.36,1); white-space:nowrap; }
  body.ops .ops-btn:hover { border-color:#3a4650; background:#252e36; }
  body.ops .ops-btn.primary { background:#60a5fa; color:#0b1220; border-color:transparent; }
  body.ops .ops-btn.primary:hover { filter:brightness(1.07); }
  body.ops .ops-btn.ghost { background:transparent; color:#9aa7b3; }
  body.ops .ops-btn.ghost:hover { color:#eef2f6; }
  body.ops .ops-btn:focus-visible { outline:2px solid #60a5fa; outline-offset:2px; }
  body.ops .ops-rail { display:flex; flex-direction:column; gap:16px; }
  body.ops .ops-pulse { padding:6px 15px 14px; }
  body.ops .ops-pulse .ops-row { display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-top:1px solid #222a31; font-size:13.5px; }
  body.ops .ops-pulse .ops-row:first-child { border-top:0; }
  body.ops .ops-pulse .ops-row .ops-v { font-weight:650; font-size:15px; }
  body.ops .ops-pulse .ops-row .ops-v small { color:#6b7884; font-weight:500; font-size:12px; }
  body.ops .ops-loop { padding:6px 15px 13px; }
  body.ops .ops-loop .ops-step { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid #222a31; font-size:13.5px; }
  body.ops .ops-loop .ops-step:first-child { border-top:0; }
  body.ops .ops-chk { width:18px; height:18px; border-radius:6px; border:1.5px solid #2a323a; flex:none; display:grid; place-items:center; font-size:11px; color:#34d399; }
  body.ops .ops-chk.done { background:#13302a; border-color:#1f5a47; }
  body.ops .ops-step-lbl { flex:1; }
  body.ops .ops-step-n { font-size:12px; color:#9aa7b3; font-weight:600; }
  body.ops .ops-tier { font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#6b7884; font-weight:650; padding:13px 15px 3px; }
  body.ops .ops-tier:first-of-type { padding-top:6px; }
  body.ops .ops-tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; padding:14px 15px; }
  body.ops .ops-tile { background:#141a20; border:1px solid #222a31; border-radius:10px; padding:12px; }
  body.ops .ops-tile .ops-b { font-size:22px; font-weight:680; letter-spacing:-.02em; }
  body.ops .ops-tile .ops-l { font-size:12px; color:#9aa7b3; margin-top:2px; }
  body.ops .ops-up { color:#34d399; }
  body.ops .ops-down { color:#f87171; }
  body.ops .ops-bar { height:7px; background:#0c1115; border-radius:99px; overflow:hidden; margin:7px 0 2px; }
  body.ops .ops-bar > i { display:block; height:100%; background:#60a5fa; border-radius:99px; }
  body.ops .ops-bar.ok > i { background:#34d399; }
  body.ops .ops-bar.warn > i { background:#fbbf24; }
  body.ops .ops-list { list-style:none; }
  body.ops .ops-li { display:flex; align-items:center; gap:12px; padding:12px 15px; border-top:1px solid #222a31; font-size:13.5px; }
  body.ops .ops-li:first-child { border-top:0; }
  body.ops .ops-li .ops-grow { flex:1; min-width:0; }
  body.ops .ops-li .ops-li-ttl { font-weight:550; }
  body.ops .ops-li .ops-li-meta { font-size:12px; color:#9aa7b3; margin-top:1px; }
  body.ops .ops-pill { font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; background:#1f272e; color:#9aa7b3; border:1px solid #2a323a; }
  body.ops .ops-pill.ok { background:#13302a; color:#6ee7b7; border-color:#1f5a47; }
  body.ops .ops-pill.warn { background:#33290f; color:#fcd34d; border-color:#574414; }
  body.ops .ops-pill.bad { background:#3a1c1c; color:#fca5a5; border-color:#4a2222; }
  body.ops .ops-pill.dim { color:#6b7884; }
  body.ops .ops-colset { display:grid; gap:16px; grid-template-columns:1fr; }
  @media(min-width:900px) { body.ops .ops-colset.two { grid-template-columns:1fr 1fr; } }
  body.ops .ops-muted { color:#9aa7b3; font-size:13px; }
  body.ops .ops-pad { padding:14px 15px; }
  body.ops .ops-chanrow { display:flex; align-items:center; gap:10px; font-size:13px; padding:7px 0; }
  body.ops .ops-chanrow .ops-chan-name { width:64px; color:#9aa7b3; }
  body.ops .ops-chanrow .ops-chan-bar { flex:1; height:7px; background:#0c1115; border-radius:99px; overflow:hidden; }
  body.ops .ops-chanrow .ops-chan-bar i { display:block; height:100%; background:#60a5fa; border-radius:99px; }
  body.ops .ops-chanrow .ops-chan-n { width:84px; text-align:right; color:#9aa7b3; font-size:12px; }
  body.ops footer.ops-note { margin-top:26px; padding-top:14px; border-top:1px solid #222a31; color:#6b7884; font-size:12px; text-align:center; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
const SB = "https://mxzkzgbonxrgkwanhnxs.supabase.co", KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14emt6Z2JvbnhyZ2t3YW5obnhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzOTI1NTMsImV4cCI6MjA5MTk2ODU1M30.OCLEdrLTOjvEe6HMk5cGL9JqoWQ5t2nTInaveKLoQPQ";
const $ = (s) => document.querySelector(s);
const tok = () => localStorage.getItem("rw_tok") || "";
const hdr = () => ({ apikey: KEY, Authorization: "Bearer " + tok(), "Content-Type": "application/json" });
const toast = (m) => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; setTimeout(() => t.style.display = "none", 1800); };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function roleOf() {
  // Role rides in the JWT's app_metadata (admin-set only; users can't change it).
  try {
    const p = JSON.parse(atob(tok().split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    return (p.app_metadata && p.app_metadata.role) || "";
  } catch { return ""; }
}
const PT = "America/Vancouver";
const ptDay = (d) => new Date(d).toLocaleDateString("en-CA", { timeZone: PT });
const ptTime = (d) => new Date(d).toLocaleString("en-CA", { timeZone: PT, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

function hoursStatus() {
  // CRTC window, Pacific time (all prospects are Metro Vancouver).
  const now = new Date(new Date().toLocaleString("en-US", { timeZone: PT }));
  const d = now.getDay(), mins = now.getHours() * 60 + now.getMinutes();
  const okNow = (d >= 1 && d <= 5) ? (mins >= 540 && mins <= 1290) : (mins >= 600 && mins <= 1080);
  return okNow
    ? '<div class="banner ok">✓ Inside calling hours (Pacific)</div>'
    : '<div class="banner bad">⛔ OUTSIDE CALLING HOURS — weekdays 9:00am–9:30pm, weekends 10am–6pm Pacific. Do not dial.</div>';
}

function weekStartPT() {
  // Monday 00:00 Pacific, as a YYYY-MM-DD string for date-key comparison.
  const now = new Date(new Date().toLocaleString("en-US", { timeZone: PT }));
  const back = (now.getDay() + 6) % 7;
  now.setDate(now.getDate() - back);
  return now.toLocaleDateString("en-CA");
}

async function login(e) {
  e.preventDefault();
  const r = await fetch(SB + "/auth/v1/token?grant_type=password", {
    method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: $("#em").value.trim(), password: $("#pw").value }),
  });
  const d = await r.json();
  if (d.access_token) { localStorage.setItem("rw_tok", d.access_token); render(); }
  else $("#err").textContent = d.error_description || d.msg || "Login failed";
}

function googleLogin() {
  // Supabase OAuth: provider must be enabled in dashboard → Auth → Providers,
  // and this page's URL allow-listed under Auth → URL Configuration.
  location.href = SB + "/auth/v1/authorize?provider=google&redirect_to=" +
    encodeURIComponent(location.origin + location.pathname);
}

// Catch auth redirects (OAuth sign-in AND password-recovery links both return
// tokens in the URL hash — implicit flow).
(function () {
  if (!location.hash) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token")) {
    localStorage.setItem("rw_tok", h.get("access_token"));
    if (h.get("type") === "recovery" || h.get("type") === "invite") window._recovery = true;
  } else if (h.get("error_description") || h.get("error")) {
    window._oauthErr = h.get("error_description") || "Sign-in failed";
  }
  history.replaceState(null, "", location.pathname + location.search);
})();

async function setNewPassword(e) {
  e.preventDefault();
  const pw = $("#np").value;
  if (pw.length < 8) { $("#err2").textContent = "Use at least 8 characters."; return; }
  if (pw !== $("#np2").value) { $("#err2").textContent = "Passwords don't match."; return; }
  const r = await fetch(SB + "/auth/v1/user", { method: "PUT", headers: hdr(), body: JSON.stringify({ password: pw }) });
  const d = await r.json();
  if (r.ok) { window._recovery = false; toast("Password saved"); render(); }
  else $("#err2").textContent = d.error_description || d.msg || "Could not save — link may have expired; request a new one.";
}

async function rest(path) {
  const r = await fetch(SB + "/rest/v1/" + path, { headers: hdr() });
  if (r.status === 401) { localStorage.removeItem("rw_tok"); render(); return null; }
  return r.json();
}

async function enqueueAction(action, params) {
  const r = await fetch(SB + "/rest/v1/operator_action_queue", {
    method: "POST", headers: hdr(), body: JSON.stringify({ action, params: params || {} }),
  });
  if (r.ok) { toast("Queued — applies in ~2 min"); renderOps(); }
  else toast("Could not queue");
}

window._nm = {}; // slug → business name (filled at render; avoids name-in-onclick escaping)

async function logCall(slug) {
  const card = document.querySelector('[data-card="' + slug + '"]');
  const sel = card.querySelector(".disp.sel");
  if (!sel) { toast("Pick a disposition first"); return; }
  const body = {
    prospect_slug: slug, prospect_name: window._nm[slug] || slug, disposition: sel.dataset.d,
    note: card.querySelector(".note").value.trim(),
    conversation: card.querySelector(".conv").checked,
  };
  const cbAt = card.querySelector(".cbat") ? card.querySelector(".cbat").value : "";
  if (cbAt) body.callback_at = new Date(cbAt).toISOString();
  let r = await fetch(SB + "/rest/v1/seller_call_log", { method: "POST", headers: hdr(), body: JSON.stringify(body) });
  if (!r.ok && body.callback_at) {
    // pre-migration-014 backend: retry without the callback column, keep it in the note
    delete body.callback_at;
    body.note = "CALLBACK " + cbAt + (body.note ? " — " + body.note : "");
    r = await fetch(SB + "/rest/v1/seller_call_log", { method: "POST", headers: hdr(), body: JSON.stringify(body) });
  }
  if (r.ok) { toast("Logged: " + sel.dataset.d); render(); }
  else toast("Log failed — try again");
}

const DISPS = ["connect", "voicemail", "no_answer", "declined", "wrong_number", "booked", "do_not_contact"];

function logForm(slug, open) {
  const dispBtns = DISPS.map((d) => {
    const isDnc = d === "do_not_contact";
    const style = isDnc ? ' style="flex:1 1 30%;background:#3a1d1d;color:var(--bad)"' : '';
    const label = isDnc ? "DO NOT CONTACT" : d.replace(/_/g, " ");
    return '<button class="disp" data-d="' + esc(d) + '"' + style +
      ' onclick="this.closest(\'.row\').querySelectorAll(\'.disp\').forEach(b=>b.classList.remove(\'sel\'));this.classList.add(\'sel\')">' +
      esc(label) + '</button>';
  }).join("");
  return '<details' + (open ? " open" : "") + '><summary>Log this call</summary><div class="row">' +
    dispBtns +
    '</div><label class="cb"><input type="checkbox" class="conv"> Real conversation (got past the opener)</label>' +
    '<input class="note" placeholder="Note — callback time, objection, email given…">' +
    '<label class="cb" style="display:block"><span class="mut">Call back at (optional):</span> <input type="datetime-local" class="cbat"></label>' +
    '<button class="primary" style="width:100%;margin-top:8px" onclick="logCall(\'' + esc(slug) + '\')">Save call log</button></details>';
}

// ── dial-card site condition (Griffin's mid-call intel) ──────────────────────
// Every field is optional — a card with intel={} (un-repushed / un-enriched row)
// falls back to the flat signal line. The ✅/❌ split mirrors the handout: a fact
// in dont_say was unprovable, so it is shown as "do not say", never as a hook.
function num(n) { return (n == null || isNaN(n)) ? "" : Number(n).toLocaleString(); }
function clip(s, n) { s = String(s == null ? "" : s); return s.length <= n ? s : s.slice(0, n).replace(/\s+\S*$/, "") + "…"; }

// The dial card is one function so the call button, DNC suppression, and the
// trust-tiered ✅/❌ stay co-located. Every field is optional → degrades to a
// name + flat signal line + call button when intel={}.
function callBtn(p) {
  if (p.intel && p.intel.dnc) return '<div class="dccall dnc">📵 DO NOT CALL — number withheld</div>';
  if (!p.phone) return '';
  return '<a class="dccall" href="tel:' + esc(p.phone).replace(/[^0-9+]/g, "") + '">📞 ' + esc(p.phone) + '</a>';
}

function hookBlock(it) {
  if (it.dnc) return '<div class="hook hook--bad"><i>⛔</i><span>DO NOT CALL — ' + esc(it.dnc_reason || 'flagged') + '</span></div>';
  if (!it.hook) return '';
  const bad = /invisible|no website|no google|parked|reviews vs/i.test(it.hook);
  const cls = it.is_icp === false ? 'warn' : (bad ? 'bad' : 'warn');
  return '<div class="hook hook--' + cls + '"><i>' + (it.is_icp === false ? '⚠' : '🎯') + '</i><span>' + esc(it.hook) + '</span></div>';
}

function chipsRow(it) {
  const c = [];
  if (it.map_pack && it.map_pack.length) {
    const hit = it.map_pack.filter((m) => m.rank != null).length;
    const dots = it.map_pack.map((m) => '<span class="dot' + (m.rank != null ? ' on' : '') + '"></span>').join('');
    c.push('<span class="chip' + (hit ? '' : ' chip--bad') + '"><span class="dots">' + dots + '</span> map ' + hit + '/' + it.map_pack.length + '</span>');
  }
  if (it.aeo && it.aeo.cited === false) c.push('<span class="chip">AI ✕</span>');
  if (it.icp_label) c.push(it.is_icp === false
    ? '<span class="chip chip--warn">' + esc(it.icp_label) + '</span>'
    : '<span class="chip chip--ok">ICP ✓</span>');
  if (it.trust) c.push('<span class="chip">trust ' + esc(it.trust) + '</span>');
  return c.length ? '<div class="chips">' + c.join('') + '</div>' : '';
}

// review-gap as proportional bars — 9 vs 12,146 lands harder as a bar than text
function gapViz(it) {
  const bar = (lab, n, max, kind) => {
    const w = max > 0 ? Math.max(n > 0 ? 5 : 2, Math.round((n / max) * 100)) : 2;
    return '<div class="gr"><span class="gr__l">' + esc(clip(lab, 16)) + '</span>' +
      '<span class="gr__t"><span class="gr__f ' + kind + '" style="width:' + w + '%"></span></span>' +
      '<span class="gr__n ' + (kind === 'them' ? 'them' : '') + '">' + (n != null ? esc(num(n)) : '—') + '</span></div>';
  };
  if (it.review_gap) {
    const t = Number(it.review_gap.theirs) || 0, r = Number(it.review_gap.rival_reviews) || 0, mx = Math.max(t, r, 1);
    return '<div class="gapv"><div class="gapv__t">Google reviews — them vs the local leader</div>' +
      bar('Them', t, mx, 'them') + bar(it.review_gap.rival, r, mx, 'riv') + '</div>';
  }
  if (it.competitors && it.competitors.length) {
    const c0 = it.competitors[0];
    return '<div class="gapv"><div class="gapv__t">Beating them on Google Maps</div>' +
      bar(c0.name, c0.reviews, c0.reviews || 1, 'riv') + '</div>';
  }
  return '';
}

// Card-face sections are SHORT and labelled by action — the verbose verifier
// wording lives only in the expand. Each is skipped when its data is absent.
function openWith(it) {
  if (!it.angle) return '';
  return '<div class="sec sec--open"><div class="sec__l">↳ Open with</div><p>' + esc(clip(it.angle, 175)) + '</p></div>';
}
function proofList(it) {
  const pts = it.talking_points || [];
  if (!pts.length) return '';
  return '<div class="sec sec--say"><div class="sec__l">Say this — verified facts</div>' +
    pts.map((s) => '<div class="pt"><b>✓</b><span>' + esc(s) + '</span></div>').join('') + '</div>';
}
function avoidTags(it) {
  const d = it.dont_claim || [];
  if (!d.length) return '';
  return '<div class="sec sec--avoid"><div class="sec__l">Don\'t claim <span>· unverified, would burn the call</span></div>' +
    '<div class="tags">' + d.map((s) => '<span class="tag">' + esc(s) + '</span>').join('') + '</div></div>';
}

// ── Console: a clickable rail of prospects + a full dossier for the selected
// one. Desktop shows both; phone shows the rail, tap → dossier, back to queue.
function buildRail(cards, done, sel) {
  if (!cards.length) return '<div class="rail"><div class="card mut">No dial cards pushed yet — Zack runs push_seller_queue.py.</div></div>';
  return '<div class="rail">' + cards.map((p) => {
    const it = p.intel || {};
    const isDone = done[p.slug];
    const dots = (it.map_pack && it.map_pack.length)
      ? '<span class="dots">' + it.map_pack.map((m) => '<span class="dot' + (m.rank != null ? ' on' : '') + '"></span>').join('') + '</span>' : '';
    return '<button class="railrow' + (p.slug === sel ? ' active' : '') + (isDone ? ' done' : '') +
      '" data-slug="' + esc(p.slug) + '" onclick="selectProspect(\'' + esc(p.slug) + '\')">' +
      '<div class="railrow__top"><span class="railrow__nm">' + esc(p.business_name) + '</span>' +
      (isDone ? '<span class="chip chip--ok">✓</span>' : '<span class="dc__rk">#' + (p.rank || 0) + '</span>') + '</div>' +
      '<div class="railrow__sub"><span class="t">' + esc(p.city) + (it.hook ? ' · ' + esc(clip(it.hook, 26)) : '') + '</span>' + dots + '</div>' +
      '</button>';
  }).join('') + '</div>';
}

function attemptPillFor(slug) {
  if ((window._done || {})[slug]) return '';
  const past = (window._attempts || {})[slug] || [];
  if (!past.length) return '';
  return '<span class="pill warn">attempt ' + (past.length + 1) + ' · last: ' + esc(past[0].disposition) + ' ' + ptTime(past[0].called_at) + '</span>';
}

function renderDossier(slug) {
  window._sel = slug;
  document.querySelectorAll('.railrow').forEach((r) => r.classList.toggle('active', r.dataset.slug === slug));
  const p = (window._cards || []).find((c) => c.slug === slug);
  const dz = document.getElementById('dossier');
  if (dz && p) dz.innerHTML = buildDossier(p, (window._done || {})[slug], attemptPillFor(slug));
}
function selectProspect(slug) {
  renderDossier(slug);
  const con = document.querySelector('.console'); if (con) con.classList.add('show');
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function backToQueue() { const con = document.querySelector('.console'); if (con) con.classList.remove('show'); }

function buildDossier(p, done, attemptPill) {
  const it = p.intel || {};
  const has = Object.keys(it).length > 0;
  let h = '<div class="card dossier-card" data-card="' + esc(p.slug) + '">' +
    '<button class="dback" onclick="backToQueue()">← Queue</button>' +
    '<div class="dc__hd"><div><div class="dc__nm">' + esc(p.business_name) + '</div>' +
    '<div class="dc__ct">' + esc(p.city) + (!has && p.signal ? ' · ' + esc(p.signal) : '') + '</div></div>' +
    (done ? '<span class="chip chip--ok">✓ ' + esc(done) + '</span>' : '<span class="dc__rk">#' + (p.rank || 0) + '</span>') + '</div>';
  if (attemptPill) h += '<div style="margin-top:7px">' + attemptPill + '</div>';
  if (!has) return h + callBtn(p) + logForm(p.slug, false) + '</div>';   // degrade
  h += hookBlock(it) + chipsRow(it) + callBtn(p);
  h += '<div class="dgrid">' +
    '<div class="dcol">' + openWith(it) + proofList(it) + avoidTags(it) + '</div>' +
    '<div class="dcol">' + gapViz(it) + evidenceBlock(it) + '</div></div>';
  h += '<details><summary>Exact verified wording (the receipts)</summary>' + wordingBlock(it) + '</details>';
  if (p.opener) h += '<details><summary>Opener script</summary><div class="opener">' + esc(p.opener) + '</div></details>';
  if (p.audit_url && /^https?:\/\//.test(p.audit_url)) h += '<p class="mut" style="margin-top:10px">Live audit: <a href="' + esc(p.audit_url) + '" style="color:var(--accent)">' + esc(p.audit_url) + '</a></p>';
  return h + logForm(p.slug, false) + '</div>';
}

// The evidence half of the dossier — visible proof for due diligence.
function evidenceBlock(it) {
  let dl = '';
  const w = it.website || {};
  if (w.status) {
    const live = w.status === 'confirmed' && w.url && /^https?:\/\//.test(w.url);
    const dom = w.url ? esc(w.url.replace(/^https?:\/\//, '').replace(/\/$/, '')) : '';
    const v = live ? ('<a href="' + esc(w.url) + '" target="_blank" rel="noopener" style="color:var(--accent)">' + dom + '</a> <span style="color:#6ee7b7">✓ live</span>')
      : (w.status === 'candidate' ? ((dom ? dom + ' ' : '') + '<span style="color:var(--warn)">— parked / dead, goes nowhere</span>')
        : (w.status === 'none-found' ? '<span style="color:var(--bad)">none — invisible online</span>' : esc(w.status)));
    dl += '<dt>Website</dt><dd>' + v + '</dd>';
  }
  if (it.gbp) {
    const g = it.gbp, parts = [];
    if (g.rating != null) parts.push('⭐ ' + esc(g.rating));
    if (g.reviews != null) parts.push(esc(num(g.reviews)) + ' reviews');
    if (g.category) parts.push('<span' + (/hvac|heat/i.test(g.category) ? '' : ' style="color:var(--warn)"') + '>' + esc(g.category) + (/hvac|heat/i.test(g.category) ? '' : ' (not HVAC)') + '</span>');
    dl += '<dt>Google</dt><dd>' + (parts.join(' · ') || '—') + '</dd>';
  } else {
    dl += '<dt>Google</dt><dd><span style="color:var(--bad)">no Business Profile found</span></dd>';
  }
  if (it.owner) dl += '<dt>Owner</dt><dd>' + esc(it.owner.name) + (it.owner.title ? ' · ' + esc(it.owner.title) : '') +
    (it.owner.unverified ? ' <span class="mut">⚠ unverified</span>' : '') + '</dd>';
  if (it.email) dl += '<dt>Email</dt><dd>' + esc(it.email) + '</dd>';
  let h = '<div class="cond"><dl>' + dl + '</dl>';
  if (it.map_pack && it.map_pack.length) {
    h += '<div class="cond__sec">Map pack — core queries</div>';
    h += it.map_pack.map((m) => '<div class="maprow"><span>' + esc(m.q) + '</span>' +
      (m.rank != null ? '<span class="hit">#' + esc(m.rank) + '</span>' : '<span class="miss">not in pack</span>') + '</div>').join('');
  }
  if (it.competitors && it.competitors.length) {
    h += '<div class="cond__sec">Who\'s winning the map</div><div class="cgrid">';
    h += it.competitors.map((c) => '<div><span>' + esc(c.name) + '</span><span class="mut">' +
      (c.reviews != null ? esc(num(c.reviews)) + ' rev' : '') + (c.rating != null ? ' · ⭐' + esc(c.rating) : '') + '</span></div>').join('');
    h += '</div>';
  }
  // verification status — surfaces the system's confidence so diligence is honest
  if (it.trust === 'low') {
    h += '<div class="verif" style="color:var(--warn)">⚠ Lower confidence — triple-check on the call before quoting anything</div>';
  } else {
    h += '<div class="verif">🛡 <b>Verified</b> · Google Places + adversarial crawl-check' + (it.trust ? ' · ' + esc(it.trust) + ' confidence' : '') + '</div>';
  }
  return h + '</div>';
}

// The verbatim verified hooks + the full don't-say list — the exact wording.
function wordingBlock(it) {
  let h = '';
  if (it.safe_to_say && it.safe_to_say.length) {
    h += '<div class="cond__sec">✅ Safe to say — exact wording</div><ul style="margin:0;padding-left:16px">' +
      it.safe_to_say.map((s) => '<li style="margin:3px 0;line-height:1.42">' + esc(s) + '</li>').join('') + '</ul>';
  }
  if (it.dont_say && it.dont_say.length) {
    h += '<div class="cond__sec">❌ Don\'t say — full list <span style="color:var(--bad)">(unverified)</span></div><ul style="margin:0;padding-left:16px">' +
      it.dont_say.map((s) => '<li style="margin:3px 0;line-height:1.42;color:#f0a8a8">' + esc(s) + '</li>').join('') + '</ul>';
  }
  return '<div class="cond">' + (h || '<p class="mut">No further wording.</p>') + '</div>';
}

async function render() {
  document.body.classList.remove('ops', 'dial');
  const app = $("#app");
  if (tok() && window._recovery) {
    app.innerHTML = '<h1>Rankwise — Dashboard</h1><p class="mut">Choose your new password.</p>' +
      '<form class="card" onsubmit="setNewPassword(event)">' +
      '<input id="np" type="password" placeholder="new password (8+ characters)" autocomplete="new-password"><br><br>' +
      '<input id="np2" type="password" placeholder="repeat new password" autocomplete="new-password"><br><br>' +
      '<button class="primary" style="width:100%">Save password</button>' +
      '<p id="err2" class="mut" style="color:var(--bad)"></p></form>';
    return;
  }
  if (!tok()) {
    app.innerHTML = '<h1>Rankwise — Dashboard</h1><p class="mut">Sign in with the login Zack set up for you.</p>' +
      '<form class="card" onsubmit="login(event)"><input id="em" type="email" placeholder="email" autocomplete="username"><br><br>' +
      '<input id="pw" type="password" placeholder="password" autocomplete="current-password"><br><br>' +
      '<button class="primary" style="width:100%">Sign in</button>' +
      '<p class="mut" style="text-align:center;margin:10px 0">or</p>' +
      '<button type="button" style="width:100%" onclick="googleLogin()">Continue with Google</button>' +
      '<p id="err" class="mut" style="color:var(--bad)"></p></form>';
    if (window._oauthErr) $("#err").textContent = window._oauthErr;
    return;
  }
  const role = roleOf();
  if (role === "client") return renderClient();
  if (role !== "seller" && role !== "operator") {
    app.innerHTML = '<h1>Rankwise — Dashboard</h1>' +
      '<div class="card">This account has no access assigned yet. Email <a href="mailto:zshef@rankwise.ca" style="color:var(--accent)">zshef@rankwise.ca</a> and Zack will set you up.</div>' +
      '<button onclick="localStorage.removeItem(\'rw_tok\');render()">Log out</button>';
    return;
  }
  if (role === "operator" && !window._showConsole) return renderOps();
  window._showConsole = false;
  app.innerHTML = '<h1>Dial Console</h1><p class="mut">Loading…</p>';
  const [queue, log, snapRows] = await Promise.all([
    rest("seller_queue?select=*&order=rank.asc"),
    rest("seller_call_log?select=*&order=called_at.desc&limit=1000"),
    rest("seller_ops_snapshot?select=payload&id=eq.1"),
  ]);
  if (!queue) return;
  const snap = (snapRows && snapRows[0] && snapRows[0].payload) || null;
  const rows = log || [];
  const today = ptDay(new Date());
  const wkStart = weekStartPT();
  const todayRows = rows.filter((r) => ptDay(r.called_at) === today);
  const weekRows = rows.filter((r) => ptDay(r.called_at) >= wkStart);
  const doneToday = {}; todayRows.forEach((r) => { if (r.prospect_slug && !doneToday[r.prospect_slug]) doneToday[r.prospect_slug] = r.disposition; });
  const attempts = {}; rows.forEach((r) => { if (r.prospect_slug) (attempts[r.prospect_slug] = attempts[r.prospect_slug] || []).push(r); });
  const phoneBySlug = {}; (queue || []).forEach((p) => { phoneBySlug[p.slug] = p.phone || ""; });
  const cnt = (rs, f) => rs.filter(f).length;
  const isPickup = (r) => ["connect", "declined", "booked"].includes(r.disposition);
  const isConvo = (r) => r.conversation || r.disposition === "booked";

  document.body.classList.add('dial');
  let h = '<div class="row" style="justify-content:space-between"><h1>Dial Console</h1>' +
    '<button onclick="localStorage.removeItem(\'rw_tok\');render()">Log out</button></div>' + hoursStatus() +
    '<div class="dial-top">';   // scorecard/coach/cheatsheet stay readable-width

  // ── Operator only: Ops rollup tab + preview any client dashboard ──────────
  if (role === "operator") {
    h += '<div class="row"><button onclick="renderOps()">📊 Ops overview</button></div>';
    const cl = (await rest("client_portal_snapshot?select=client_key&order=client_key.asc")) || [];
    if (cl.length) {
      h += '<p class="mut">Client dashboards: ' + cl.map((c) =>
        '<a href="#" style="color:var(--accent)" onclick="renderClient(decodeURIComponent(\'' + encodeURIComponent(c.client_key).replace(/'/g, "%27") + '\'));return false">' + esc(c.client_key) + '</a>').join(" · ") + '</p>';
    }
  }

  // ── Callbacks due ──────────────────────────────────────────────────────────
  // Open = the newest log row per slug has a callback_at and nothing newer was
  // logged after it (also picks up pre-migration "CALLBACK <when> —" notes).
  const cbs = [];
  for (const slug in attempts) {
    const latest = attempts[slug][0]; // rows are newest-first
    let at = latest.callback_at || null;
    if (!at && /^CALLBACK ([0-9T:\-]+)/.test(latest.note || "")) at = (latest.note.match(/^CALLBACK ([0-9T:\-]+)/) || [])[1];
    if (at) cbs.push({ slug, name: latest.prospect_name, at, note: latest.note || "" });
  }
  cbs.sort((a, b) => String(a.at).localeCompare(String(b.at)));
  if (cbs.length) {
    h += '<div class="card"><b>📞 Callbacks promised (' + cbs.length + ')</b>';
    for (const c of cbs.slice(0, 8)) {
      const overdue = new Date(c.at) <= new Date();
      h += '<div class="hist"><span class="pill ' + (overdue ? "warn" : "") + '">' + (overdue ? "DUE" : ptTime(c.at)) + '</span> <b>' + esc(c.name) + '</b>' +
        (phoneBySlug[c.slug] ? ' · <a href="tel:' + esc(phoneBySlug[c.slug]).replace(/[^0-9+]/g, "") + '" style="color:var(--ok)">call</a>' : '') +
        (c.note ? '<br><span class="mut">' + esc(c.note) + '</span>' : '') + '</div>';
    }
    h += '<p class="mut">Logging any new call for that business clears its callback.</p></div>';
  }

  // ── Today + this-week tallies ──────────────────────────────────────────────
  h += '<div class="tally"><div><b>' + todayRows.length + '</b><span class="mut">dials today</span></div>' +
    '<div><b>' + cnt(todayRows, isPickup) + '</b><span class="mut">pickups</span></div>' +
    '<div><b>' + cnt(todayRows, isConvo) + '</b><span class="mut">convos</span></div>' +
    '<div><b>' + cnt(todayRows, (r) => r.disposition === "booked") + '</b><span class="mut">booked</span></div></div>' +
    '<div class="tally wk"><div><b>' + weekRows.length + '</b><span class="mut">wk dials</span></div>' +
    '<div><b>' + cnt(weekRows, isPickup) + '</b><span class="mut">wk pickups</span></div>' +
    '<div><b>' + cnt(weekRows, isConvo) + '</b><span class="mut">wk convos</span></div>' +
    '<div><b>' + cnt(weekRows, (r) => r.disposition === "booked") + '</b><span class="mut">wk booked</span></div></div>';

  // ── Trial progress + pay (authoritative snapshot from the vault) ───────────
  if (snap && snap.trial && snap.trial.configured) {
    const t = snap.trial, needD = 200, needC = 5;
    h += '<div class="card"><b>Trial: ' + esc(t.verdict || "") + '</b><p class="mut">window ' + esc(t.window || "") + '</p>' +
      '<p class="mut" style="margin-top:6px">' + (t.dials || 0) + ' / ' + needD + ' dials</p><div class="bar"><i style="width:' + Math.min(100, 100 * (t.dials || 0) / needD) + '%"></i></div>' +
      '<p class="mut">' + (t.conversations || 0) + ' / ' + needC + ' real conversations</p><div class="bar"><i style="width:' + Math.min(100, 100 * (t.conversations || 0) / needC) + '%"></i></div>';
    const ledger = snap.pay_ledger || [];
    if (ledger.length) {
      h += '<details><summary>Pay ledger</summary><table class="pay"><tr><th>Week</th><th>Blocks</th><th>Shows</th><th>Due</th><th>Paid</th></tr>' +
        ledger.map((w) => '<tr><td>' + esc(w.week) + '</td><td>' + (w.qualified_blocks || 0) + '</td><td>' + (w.shows || 0) + '</td><td>$' + (w.due_cad || 0) + '</td><td>' + (w.paid ? "✓" : "due Friday") + '</td></tr>').join("") +
        '</table><p class="mut">Blocks count when a day hits the minimum dials. Bounties land the week of the show.</p></details>';
    }
    h += '</div>';
  }

  // ── Coach card (pushed from vault/_export/seller-coach.json) ────────────────
  if (snap && snap.coach) {
    const co = snap.coach;
    h += '<div class="card"><b>Coach</b>';
    if (co.as_of) h += '<p class="mut">based on calls through ' + esc(co.as_of) + '</p>';
    if (co.note) h += '<p class="mut">' + esc(co.note) + '</p>';
    if (co.blocks && co.blocks.length) {
      const b = co.blocks[0]; // most recent block
      if (b.best_line) h += '<div class="opener">' + esc(b.best_line) + '</div>';
      if (b.what_worked && b.what_worked.length)
        h += '<details><summary>What worked (' + esc(b.date) + ', ' + (b.n_calls || 0) + ' calls)</summary><div class="kit">' + esc(b.what_worked.join('\n')) + '</div></details>';
      if (b.what_to_fix && b.what_to_fix.length)
        h += '<details><summary>Fix next block</summary><div class="kit">' + esc(b.what_to_fix.join('\n')) + '</div></details>';
      if (b.themes && b.themes.length)
        h += '<details><summary>Themes</summary><div class="kit">' + esc(b.themes.join('\n')) + '</div></details>';
      if (co.blocks.length > 1) {
        h += '<details><summary>Earlier blocks (' + (co.blocks.length - 1) + ')</summary>';
        for (const ob of co.blocks.slice(1)) {
          h += '<p class="mut"><b>' + esc(ob.date) + '</b> · ' + (ob.n_calls || 0) + ' calls</p>';
          if (ob.best_line) h += '<div class="opener">' + esc(ob.best_line) + '</div>';
        }
        h += '</details>';
      }
    }
    h += '</div>';
  }

  // ── Cheat sheet (pushed from the seller kit) ───────────────────────────────
  if (snap && snap.kit && (snap.kit.objections || snap.kit.must_not_say)) {
    h += '<div class="card"><b>📋 Cheat sheet</b>';
    if (snap.kit.must_not_say) h += '<details><summary>Must-not-say (compliance)</summary><div class="kit">' + esc(snap.kit.must_not_say) + '</div></details>';
    if (snap.kit.objections) h += '<details><summary>Objections + FAQ</summary><div class="kit">' + esc(snap.kit.objections) + '</div></details>';
    h += '</div>';
  }

  h += '<p class="mut">Booking close: "I\'ll set that up right now — what\'s your email?" → book them at <b>rankwise.ca/audit</b> while you\'re on the line. Log every call. Real conversation = got past the opener.</p>';

  // ── Recent calls (still inside the readable-width column) ────────────────────
  if (rows.length) {
    h += '<div class="card"><details><summary>My recent calls (' + rows.length + ' logged)</summary>' +
      rows.slice(0, 15).map((r) => '<div class="hist"><span class="pill">' + esc(r.disposition) + '</span> <b>' + esc(r.prospect_name) + '</b> <span class="mut">' + ptTime(r.called_at) + '</span>' +
        (r.note ? '<br><span class="mut">' + esc(r.note) + '</span>' : '') + '</div>').join("") +
      '</details></div>';
  }
  h += '</div>';   // close .dial-top

  // ── Dial console: rail of prospects + dossier for the selected one ──────────
  const cards = (queue || []).slice().sort((a, b) => (a.slug in doneToday ? 1 : 0) - (b.slug in doneToday ? 1 : 0) || a.rank - b.rank);
  window._cards = cards; window._done = doneToday; window._attempts = attempts;
  window._nm = {}; cards.forEach((p) => { window._nm[p.slug] = p.business_name; });
  const sel = (window._sel && cards.some((c) => c.slug === window._sel)) ? window._sel : (cards[0] && cards[0].slug);
  h += '<div class="console">' + buildRail(cards, doneToday, sel) + '<div class="dossier" id="dossier"></div></div>';

  app.innerHTML = h;
  if (sel) renderDossier(sel);     // populate the dossier (no .show → phone shows the list first)
}

// ── Ops tab switcher (global; called from inline onclick in renderOps HTML) ──
window._opsTab = window._opsTab || 'today';
function opsTab(id) {
  window._opsTab = id;
  const views = document.querySelectorAll('section.ops-view');
  const tabs = document.querySelectorAll('.ops-tab');
  views.forEach(function(v) { v.hidden = (v.id !== 'ops-' + id); });
  tabs.forEach(function(t) { t.setAttribute('aria-selected', String(t.dataset.v === id)); });
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// ── Ops overview (role=operator only; data via operator_portal_snapshot RLS) ──
async function renderOps() {
  if (roleOf() !== 'operator') return render();  // hygiene; RLS is the real gate
  document.body.classList.add('ops');
  const app = $("#app");
  app.innerHTML = '<p class="mut" style="padding:12px">Loading…</p>';

  const [rows, actionRows] = await Promise.all([
    rest("operator_portal_snapshot?select=payload,updated_at&id=eq.1"),
    rest("operator_action_queue?select=*&order=id.desc&limit=10"),
  ]);
  if (!rows) return;
  const snap = rows[0] || null;
  const recentActions = actionRows || [];
  const p = (snap && snap.payload) ? snap.payload : {};

  // ── Derived counts for tab badges ────────────────────────────────────────
  const needsYou = p.needs_you || [];
  const actNow = needsYou.filter(function(n) { return n.tier === 'act_now'; });
  const todayNeeds = needsYou.filter(function(n) { return n.tier === 'today'; });
  const backlog = needsYou.filter(function(n) { return n.tier === 'backlog'; });
  const pendingExp = p.pending_expenses || [];
  const contentItems = p.content_items || [];
  const dueCalls = p.due_calls || [];
  const fu = p.funnel || {}, pipe = fu.pipeline || {}, gate = fu.gate || null, byChannel = fu.by_channel || {};
  const s = p.seller || {}, trial = s.trial || {}, totals = s.totals || {};
  const sys = p.system || {};
  const gl = p.go_live || null;
  const sp = p.spend || null;
  const co = p.content || {};

  // badge counts
  const todayBadge = actNow.length + todayNeeds.length;
  const outreachBadge = dueCalls.length;
  const contentBadge = contentItems.length || (Number(co.inbox) || 0) + (Number(co.hold) || 0);
  const moneyBadge = pendingExp.length + (s.pay_due_cad > 0 ? 1 : 0);

  // ── Helper: dot color from severity ──────────────────────────────────────
  function dotCls(sev) { return esc(sev === 'bad' ? 'bad' : sev === 'warn' ? 'warn' : sev === 'info' ? 'info' : 'lo'); }

  // ── TODAY section ─────────────────────────────────────────────────────────
  const nm = p.next_move || null;
  let todayH = '';
  // next-move hero
  if (nm) {
    todayH += '<div class="ops-nextmove">' +
      '<div class="nm-i">→</div>' +
      '<div class="nm-t"><div class="nm-k">Next best move</div>' +
      '<div class="nm-h">' + esc(nm.title) + (nm.sub ? ' <span>— ' + esc(nm.sub) + '</span>' : '') + '</div></div>' +
      '<button class="ops-btn primary" onclick="opsTab(\'' + esc(nm.tab || 'today') + '\')">' + 'Open' + '</button></div>';
  } else {
    todayH += '<div class="ops-nextmove">' +
      '<div class="nm-i">→</div>' +
      '<div class="nm-t"><div class="nm-k">Next best move</div>' +
      '<div class="nm-h">No priority queued yet <span>— snapshot may be stale</span></div></div></div>';
  }

  todayH += '<div class="ops-grid-today">';

  // ── Left: Your queue ──
  todayH += '<div class="ops-panel"><div class="ops-panel-h"><b>Your queue</b><span class="ops-count">things only you can clear</span></div>';
  if (!needsYou.length) {
    todayH += '<p class="ops-muted ops-pad">Nothing needs you right now.</p>';
  } else {
    function renderTier(label, items) {
      if (!items.length) return '';
      let out = '<div class="ops-tier">' + esc(label) + '</div><ul class="ops-needs">';
      for (const n of items) {
        const tab = n.action_tab || 'today';
        const btnStyle = n.severity === 'bad' ? ' primary' : n.severity === 'lo' ? ' ghost' : '';
        out += '<li class="ops-need">' +
          '<span class="ops-dot ' + dotCls(n.severity) + '"></span>' +
          '<div class="ops-body"><div class="ops-ttl">' + esc(n.title) + '</div>' +
          (n.sub ? '<div class="ops-sub">' + esc(n.sub) + '</div>' : '') + '</div>' +
          '<div class="ops-act"><button class="ops-btn' + btnStyle + '" onclick="opsTab(\'' + esc(tab) + '\')">' + esc(n.action_label || 'View') + '</button></div></li>';
      }
      out += '</ul>';
      return out;

    todayH += renderTier('Act now', actNow);

  todayH += '</div>'; // ops-panel

  // ── Right rail ──

  const spendCAD = (sp && sp.totals) ? (Number(sp.totals.CAD) || 0) : 0;
  const trialDials = trial.configured ? (trial.dials || 0) : null;
  const trialConvos = trial.configured ? (trial.conversations || 0) : null;
  todayH += '<div class="ops-panel"><div class="ops-panel-h"><b>This week</b>' +
    (sp && sp.month ? '<span class="ops-count">' + esc(sp.month) + '</span>' : '') + '</div>' +
    '<div class="ops-pulse">' +
    '<div class="ops-row"><span class="ops-muted">Dials</span><span class="ops-v">' + esc(wkDials) +
    (trialDials !== null ? ' <small>/ 200 trial</small>' : '') + '</span></div>' +

    '<div class="ops-pulse">' +
    '<div class="ops-row"><span class="ops-muted">Calls due</span><span class="ops-v">' + esc(callsDueCount) +

    '<div class="ops-row"><span class="ops-muted">Convos this week</span><span class="ops-v">' + esc(wkConvos) +

    { key: 'content', label: 'Content — approve drafts', n: contentPending || null, done: contentPending === 0 },

    }

  } else {
    outH += '<p class="ops-muted ops-pad">No calls due today.</p>';
  }
  outH += '</div>';
  outH += '</div>'; // colset

  // Seller trial panel
  if (s.active || trial.configured) {

    const trialWindow = trial.window || s.as_of || '';

    const cPct = trialConvos !== null ? Math.min(100, Math.round(100 * trialConvos / needC)) : 0;
    outH += '<div class="ops-panel" style="margin-top:16px"><div class="ops-panel-h"><b>Seller — ' + esc(s.name || 'Griffin') + '</b>' +
      (trial.configured ? '<span class="ops-count">' + (trialVerdict ? esc(trialVerdict) + ' · ' : '') + (trialDay ? 'day ' + esc(trialDay) + ' of 14' : esc(trialWindow)) + '</span>' : '') + '</div>';
    if (trial.configured) {
      outH += '<div class="ops-pad">' +
        '<div class="ops-muted">Dials toward keep/kill (200)</div>' +
        '<div class="ops-bar"><i style="width:' + esc(dPct) + '%"></i></div>' +
        '<div class="ops-muted" style="margin-top:8px">Real conversations (5)</div>' +
        '<div class="ops-bar warn"><i style="width:' + esc(cPct) + '%"></i></div>' +
        '</div>';
    }
    outH += '<div class="ops-tiles" style="border-top:1px solid #222a31">' +
      '<div class="ops-tile"><div class="ops-b">' + esc(trialDials !== null ? trialDials : (Number(totals.dials)||0)) + '</div><div class="ops-l">dials</div></div>' +
      '<div class="ops-tile"><div class="ops-b">' + esc(Number(totals.pickups)||0) + '</div><div class="ops-l">pickups</div></div>' +
      '<div class="ops-tile"><div class="ops-b">' + esc(trialConvos !== null ? trialConvos : (Number(totals.conversations)||0)) + '</div><div class="ops-l">convos</div></div>' +
      '<div class="ops-tile"><div class="ops-b">' + esc(Number(totals.closes)||Number(totals.bookings)||0) + '</div><div class="ops-l">booked</div></div>' +
      '<div class="ops-tile"><div class="ops-b">' + esc(callbacksDue) + '</div><div class="ops-l">callbacks</div></div>' +
      (s.pay_due_cad ? '<div class="ops-tile"><div class="ops-b ops-up">$' + esc(Number(s.pay_due_cad)) + '</div><div class="ops-l">pay due</div></div>' : '') +
      '</div></div>';
  }

  // ── CONTENT section ───────────────────────────────────────────────────────
  let contH = '';
  contH += '<div class="ops-panel"><div class="ops-panel-h"><b>Awaiting your approval</b>' +
    '<span class="ops-count">' + esc(contentItems.length) + '</span></div>';
  if (contentItems.length) {
    contH += '<ul class="ops-list">';
    for (const ci of contentItems) {
      const typePill = '<span class="ops-pill ' + (ci.readiness === 'ready' ? 'warn' : '') + '">' + esc(ci.type || '') + '</span>';
      contH += '<li class="ops-li">' + typePill +
        '<div class="ops-grow"><div class="ops-li-ttl">' + esc(ci.title) + '</div>' +
        (ci.readiness ? '<div class="ops-li-meta">' + esc(ci.readiness) + '</div>' : '') + '</div>' +
        '</li>';
    }
    contH += '</ul>';
  } else {
    contH += '<p class="ops-muted ops-pad">No items awaiting approval.</p>';
  }
  contH += '</div>';

  // Pipeline counts
  contH += '<div class="ops-panel" style="margin-top:16px"><div class="ops-panel-h"><b>Pipeline</b>' +
    (co.as_of ? '<span class="ops-count">as of ' + esc(ptTime(co.as_of)) + '</span>' : '') + '</div>' +
    '<div class="ops-tiles">' +
    '<div class="ops-tile"><div class="ops-b">' + esc(Number(co.inbox)||0) + '</div><div class="ops-l">inbox</div></div>' +
    '<div class="ops-tile"><div class="ops-b">' + esc(Number(co.hold)||0) + '</div><div class="ops-l">hold</div></div>' +
    '<div class="ops-tile"><div class="ops-b">' + esc(Number(co.outreach)||0) + '</div><div class="ops-l">outreach</div></div>' +
    '<div class="ops-tile"><div class="ops-b">' + esc(Number(co.approved)||0) + '</div><div class="ops-l">approved</div></div>' +
    (pipeCompleted ? '<div class="ops-tile"><div class="ops-b">' + esc(pipeCompleted) + '</div><div class="ops-l">completed</div></div>' : '') +
    '</div></div>';

  // ── MONEY section ─────────────────────────────────────────────────────────
  let monH = '<div class="ops-colset two">';
  // Pending expenses
  monH += '<div class="ops-panel"><div class="ops-panel-h"><b>Invoices to confirm</b>' +
    '<span class="ops-count">' + esc(pendingExp.length) + '</span></div>';
  if (pendingExp.length) {
    monH += '<ul class="ops-list">';
    for (const row of pendingExp) {
      monH += '<li class="ops-li"><div class="ops-grow">' +
        '<div class="ops-li-ttl">' + esc(row.vendor) + '</div>' +
        '<div class="ops-li-meta">' + esc(row.amount) + ' ' + esc(row.currency) +
        (row.description ? ' · ' + esc(row.description) : '') + (row.date ? ' · ' + esc(row.date) : '') + '</div></div>' +
        '<button class="ops-btn primary" data-id="' + esc(row.id) + '" onclick="enqueueAction(\'confirm_expense\',{id:this.dataset.id})">Confirm</button>' +
        '<button class="ops-btn ghost" data-id="' + esc(row.id) + '" onclick="enqueueAction(\'reject_expense\',{id:this.dataset.id})">Reject</button>' +
        '</li>';
    }
    monH += '</ul>';
  } else {
    monH += '<p class="ops-muted ops-pad">No pending invoices.</p>';
  }
  monH += '</div>';
  // Spend
  monH += '<div class="ops-panel"><div class="ops-panel-h"><b>Spend — this month</b>' +
    (sp && sp.month ? '<span class="ops-count">' + esc(sp.month) + '</span>' : '') + '</div>' +
    '<div class="ops-tiles">' +
    '<div class="ops-tile"><div class="ops-b">$' + esc(spendUSD) + '</div><div class="ops-l">USD</div></div>' +
    '<div class="ops-tile"><div class="ops-b">CAD ' + esc(spendCAD) + '</div><div class="ops-l">CAD</div></div>' +
    '</div>' +
    '<div class="ops-muted ops-pad" style="border-top:1px solid #222a31">' +
    (sp && sp.as_of ? 'as of ' + esc(ptTime(sp.as_of)) : 'No spend data yet.') +
    '</div></div>';
  monH += '</div>'; // colset
  // Seller pay
  if (s.active || s.pay_due_cad > 0) {
    const ledger = p.pay_ledger || (p.seller && p.seller.pay_ledger) || [];
    monH += '<div class="ops-panel" style="margin-top:16px"><div class="ops-panel-h"><b>Seller pay</b>' +
      (s.pay_due_cad ? '<span class="ops-count">$' + esc(Number(s.pay_due_cad)) + ' due</span>' : '<span class="ops-count">all paid</span>') + '</div>';
    if (ledger.length) {
      monH += '<ul class="ops-list">';
      for (const w of ledger) {
        const paid = w.paid || w.due_cad === 0;
        monH += '<li class="ops-li">' +
          '<span class="ops-pill ' + (paid ? 'ok' : 'bad') + '">' + (paid ? 'paid' : 'due Fri') + '</span>' +
          '<div class="ops-grow"><div class="ops-li-ttl">' + esc(w.week || '') + '</div>' +
          '<div class="ops-li-meta">' + (w.qualified_blocks ? esc(w.qualified_blocks) + ' blocks' : '') +
          (w.shows ? ' · ' + esc(w.shows) + ' shows' : '') + '</div></div>' +
          '<span' + (paid ? ' class="ops-muted"' : '') + '>$' + esc(w.due_cad || 0) + '</span>' +
          // Mark paid: no action in frozen contract — omitted intentionally (consistent with Content approve/reject)

          '</li>';
      }
      monH += '</ul>';
    } else if (s.pay_due_cad) {
      monH += '<p class="ops-muted ops-pad">$' + esc(Number(s.pay_due_cad)) + ' due — no ledger detail available.</p>';
    } else {
      monH += '<p class="ops-muted ops-pad">No pay due.</p>';
    }
    monH += '</div>';
  }

  // ── SYSTEM section ────────────────────────────────────────────────────────
  const sysOk = sys.sources_ok === sys.sources_total;
  let sysH = '<div class="ops-colset two">';
  // Data integrity
  sysH += '<div class="ops-panel"><div class="ops-panel-h"><b>Data integrity</b>' +
    '<span class="ops-count">' + esc(Number(sys.sources_ok)||0) + ' / ' + esc(Number(sys.sources_total)||0) + ' OK</span></div>';
  sysH += '<ul class="ops-list">';
  if ((sys.not_ok || []).length) {
    for (const r of sys.not_ok) {
      sysH += '<li class="ops-li"><span class="ops-pill bad">' + esc(r.status) + '</span>' +
        '<div class="ops-grow"><div class="ops-li-ttl">' + esc(r.source) + '</div>' +
        '<div class="ops-li-meta">' + esc(r.detail) + '</div></div></li>';
    }
  }
  if ((sys.warns || []).length) {
    for (const r of sys.warns) {
      sysH += '<li class="ops-li"><span class="ops-pill warn">stale</span>' +
        '<div class="ops-grow"><div class="ops-li-ttl">' + esc(r.source) + '</div>' +
        '<div class="ops-li-meta">' + esc(r.detail) + '</div></div></li>';
    }
  }
  if (sysOk && !(sys.not_ok||[]).length && !(sys.warns||[]).length) {
    sysH += '<li class="ops-li"><span class="ops-pill ok">ok</span>' +
      '<div class="ops-grow"><div class="ops-li-ttl">All sources</div>' +
      '<div class="ops-li-meta">checked ' + esc(sys.data_truth_ran_at ? ptTime(sys.data_truth_ran_at) : 'never') + '</div></div></li>';
  }
  if ((sys.skipped || []).length) {
    sysH += '<li class="ops-li"><span class="ops-pill dim">skip</span>' +
      '<div class="ops-grow"><div class="ops-li-ttl">' + esc(sys.skipped.map(function(r){return r.source;}).join(', ')) + '</div>' +
      '<div class="ops-li-meta">skipped by design</div></div></li>';
  }
  sysH += '</ul></div>';

  // Go-live gate
  const glChecks = gl ? (gl.checks || {}) : {};
  const glCheckEntries = Object.entries(glChecks);
  sysH += '<div class="ops-panel"><div class="ops-panel-h"><b>Go-live gate</b></div>';
  sysH += '<ul class="ops-list">';
  if (gl) {
    for (const [name, passing] of glCheckEntries) {
      sysH += '<li class="ops-li"><span class="ops-pill ' + (passing ? 'ok' : 'bad') + '">' + (passing ? '✓' : '✗') + '</span>' +
        '<div class="ops-grow"><div class="ops-li-ttl">' + esc(name) + '</div></div>' +
        (!passing ? '<button class="ops-btn ghost" onclick="opsTab(\'outreach\')">Open</button>' : '') + '</li>';
    }
    if (!glCheckEntries.length) {
      const gateOpen2 = gl.sending_enabled;
      sysH += '<li class="ops-li"><span class="ops-pill ' + (gateOpen2 ? 'ok' : 'bad') + '">sending: ' + esc(gateOpen2 ? 'OPEN' : 'closed') + '</span>' +
        '<div class="ops-grow"><div class="ops-li-ttl">Send gate</div></div></li>';
    }
  } else {
    sysH += '<li class="ops-li"><span class="ops-pill dim">—</span><div class="ops-grow"><div class="ops-li-ttl">No gate data</div></div></li>';
  }
  sysH += '</ul></div>';
  sysH += '</div>'; // colset

  // Client dashboards + recent actions
  sysH += '<div class="ops-colset two" style="margin-top:16px">';
  // Client dashboards
  sysH += '<div class="ops-panel"><div class="ops-panel-h"><b>Client dashboards</b>' +
    ((p.clients||[]).length ? '<span class="ops-count">' + esc((p.clients||[]).length) + '</span>' : '') + '</div>';
  if ((p.clients||[]).length) {
    sysH += '<ul class="ops-list">';
    for (const c of p.clients) {
      sysH += '<li class="ops-li"><div class="ops-grow">' +
        '<div class="ops-li-ttl">' + esc(c.client_key) + '</div>' +
        (c.updated_at ? '<div class="ops-li-meta">updated ' + esc(ptTime(c.updated_at)) + '</div>' : '') + '</div>' +
        '<button class="ops-btn ghost" onclick="renderClient(decodeURIComponent(\'' + encodeURIComponent(c.client_key).replace(/'/g, "%27") + '\'))">Preview</button></li>';
    }
    sysH += '</ul>';
  } else {
    sysH += '<p class="ops-muted ops-pad">No client dashboards.</p>';
  }
  sysH += '</div>';

  // Recent actions
  const statusClass = { queued: 'dim', processing: 'warn', done: 'ok', failed: 'bad' };
  sysH += '<div class="ops-panel"><div class="ops-panel-h"><b>Recent actions</b><span class="ops-count">last 10</span></div>' +
    '<div class="ops-pad" style="border-bottom:1px solid #222a31"><div class="ops-muted" style="margin-bottom:8px">Queue</div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
    '<button class="ops-btn ghost" onclick="enqueueAction(\'refresh_seller\')">Refresh seller</button>' +
    '<button class="ops-btn ghost" onclick="enqueueAction(\'refresh_clients\')">Refresh clients</button>' +
    '<button class="ops-btn ghost" onclick="enqueueAction(\'refresh_ops\')">Refresh ops</button>' +
    '</div></div>';
  if (recentActions.length) {
    sysH += '<ul class="ops-list">';
    for (const row of recentActions) {
      const cls = statusClass[row.status] || 'dim';
      sysH += '<li class="ops-li"><span class="ops-pill ' + esc(cls) + '">' + esc(row.status) + '</span>' +
        '<div class="ops-grow"><div class="ops-li-ttl">' + esc(row.action) + '</div>' +
        '<div class="ops-li-meta">' + esc(ptTime(row.created_at)) +
        (row.result ? ' · ' + esc(row.result) : '') + '</div></div></li>';
    }
    sysH += '</ul>';
  } else {
    sysH += '<p class="ops-muted ops-pad">No actions queued yet.</p>';
  }
  sysH += '</div>';
  sysH += '</div>'; // colset

  // Signals
  if (p.signals) {
    sysH += '<div class="ops-panel" style="margin-top:16px"><div class="ops-panel-h"><b>Signals</b></div>' +
      '<div class="ops-tiles">' +
      '<div class="ops-tile"><div class="ops-b">' + esc(Number(p.signals.triaged)||0) + '</div><div class="ops-l">triaged</div></div>' +
      '<div class="ops-tile"><div class="ops-b">' + esc(Number(p.signals.briefed)||0) + '</div><div class="ops-l">briefed</div></div>' +
      '</div></div>';
  }

  // ── Assemble full cockpit HTML ─────────────────────────────────────────────
  const asof = snap ? 'synced ' + esc(ptTime(snap.updated_at)) : 'no snapshot';
  let h = '<div class="ops-wrap">' +
    '<header class="ops-top">' +
    '<div class="ops-brand"><h1>Rankwise</h1><span class="ops-tag">Operator</span></div>' +
    '<span class="ops-spacer"></span>' +
    '<span class="ops-asof">' + asof + '</span>' +
    '<button class="ops-iconbtn" onclick="renderOps()">↻ Refresh</button>' +
    '<button class="ops-iconbtn" onclick="window._showConsole=true;render()">Dial console →</button>' +
    '<button class="ops-iconbtn" onclick="localStorage.removeItem(\'rw_tok\');render()">Log out</button>' +
    '</header>' +
    '<nav class="ops-tabs" role="tablist">' +
    '<button class="ops-tab" role="tab" aria-selected="' + (window._opsTab==='today'?'true':'false') + '" data-v="today" onclick="opsTab(\'today\')">Today' +
    (todayBadge ? ' <span class="ops-badge hot">' + esc(todayBadge) + '</span>' : '') + '</button>' +
    '<button class="ops-tab" role="tab" aria-selected="' + (window._opsTab==='outreach'?'true':'false') + '" data-v="outreach" onclick="opsTab(\'outreach\')">Outreach' +
    (outreachBadge ? ' <span class="ops-badge">' + esc(outreachBadge) + ' due</span>' : '') + '</button>' +
    '<button class="ops-tab" role="tab" aria-selected="' + (window._opsTab==='content'?'true':'false') + '" data-v="content" onclick="opsTab(\'content\')">Content' +
    (contentBadge ? ' <span class="ops-badge">' + esc(contentBadge) + '</span>' : '') + '</button>' +
    '<button class="ops-tab" role="tab" aria-selected="' + (window._opsTab==='money'?'true':'false') + '" data-v="money" onclick="opsTab(\'money\')">Money' +
    (moneyBadge ? ' <span class="ops-badge hot">' + esc(moneyBadge) + '</span>' : '') + '</button>' +
    '<button class="ops-tab" role="tab" aria-selected="' + (window._opsTab==='system'?'true':'false') + '" data-v="system" onclick="opsTab(\'system\')">System</button>' +
    '</nav>' +
    '<section class="ops-view" id="ops-today" role="tabpanel"' + (window._opsTab!=='today'?' hidden':'') + '>' + todayH + '</section>' +
    '<section class="ops-view" id="ops-outreach" role="tabpanel"' + (window._opsTab!=='outreach'?' hidden':'') + '>' + outH + '</section>' +
    '<section class="ops-view" id="ops-content" role="tabpanel"' + (window._opsTab!=='content'?' hidden':'') + '>' + contH + '</section>' +
    '<section class="ops-view" id="ops-money" role="tabpanel"' + (window._opsTab!=='money'?' hidden':'') + '>' + monH + '</section>' +
    '<section class="ops-view" id="ops-system" role="tabpanel"' + (window._opsTab!=='system'?' hidden':'') + '>' + sysH + '</section>' +
    '<footer class="ops-note">Rankwise operator cockpit · ' + asof + '</footer>' +
    '</div>';

  app.innerHTML = h;
}

// ── Client dashboard (role=client; operators pass an explicit key to preview) ─
async function renderClient(key) {
  document.body.classList.remove('ops', 'dial');
  const app = $("#app");
  app.innerHTML = '<h1>Rankwise — Dashboard</h1><p class="mut">Loading…</p>';
  let q = "client_portal_snapshot?select=client_key,payload,updated_at";
  if (key) q += "&client_key=eq." + encodeURIComponent(key);
  const rows = await rest(q);
  if (!rows) return;
  const snap = rows[0] || null;
  const back = roleOf() === "operator" ? '<button onclick="render()">← Console</button> ' : '';
  let h = '<div class="row" style="justify-content:space-between"><h1>' +
    esc((snap && snap.payload && snap.payload.client_name) || "Rankwise — Dashboard") + '</h1>' +
    '<span class="row">' + back + '<button onclick="localStorage.removeItem(\'rw_tok\');render()">Log out</button></span></div>';
  if (!snap) {
    h += '<div class="card">Your dashboard is being set up — the first data lands after the next weekly fetch (Mondays). ' +
      'Questions? <a href="mailto:zshef@rankwise.ca" style="color:var(--accent)">zshef@rankwise.ca</a></div>';
    app.innerHTML = h;
    return;
  }
  const p = snap.payload || {};
  h += '<p class="mut">' + esc(p.period || "") + (p.period ? ' · ' : '') + 'updated ' + ptTime(snap.updated_at) + '</p>';
  if ((p.kpis || []).length) {
    h += '<div class="tally">' + p.kpis.slice(0, 4).map((k) =>
      '<div><b>' + esc(k.value) + '</b><span class="mut">' + esc(k.label) + '</span>' +
      (k.delta ? '<br><span class="pill ' + (String(k.delta).startsWith("-") ? "warn" : "ok") + '">' + esc(k.delta) + '</span>' : '') + '</div>').join("") + '</div>';
  }
  if ((p.rankings || []).length) {
    h += '<div class="card"><b>Where you rank on Google</b><table class="pay"><tr><th>Search</th><th>Maps</th><th>Organic</th></tr>' +
      p.rankings.map((r) => '<tr><td>' + esc(r.keyword) + '</td><td>' + (r.local == null ? "—" : "#" + r.local) + '</td><td>' + (r.organic == null ? "—" : "#" + r.organic) + '</td></tr>').join("") +
      '</table><p class="mut">— means not in the top results yet for that search. That\'s the gap we\'re closing.</p></div>';
  }
  if ((p.traffic || []).length) {
    const mx = Math.max.apply(null, p.traffic.map((w) => w.clicks || 0).concat([1]));
    h += '<div class="card"><b>Search clicks — rolling 28-day window, weekly capture</b>' +
      p.traffic.map((w) => '<p class="mut" style="margin:8px 0 2px">' + esc(w.week) + ' · <b style="color:var(--text)">' + (w.clicks || 0) + '</b> clicks · ' + (w.impressions || 0) + ' impressions</p>' +
        '<div class="bar"><i style="width:' + Math.round(100 * (w.clicks || 0) / mx) + '%"></i></div>').join("") + '</div>';
  }
  if (p.reviews && p.reviews.count != null) {
    h += '<div class="card"><b>Google reviews</b><p class="mut">' + esc(String(p.reviews.count)) + ' reviews · ' + (p.reviews.rating != null ? esc(String(p.reviews.rating)) + "★" : "—") +
      (p.reviews.note ? ' · ' + esc(p.reviews.note) : '') + '</p></div>';
  }
  if ((p.wins || []).length) h += '<div class="card"><b>Done recently</b>' + p.wins.map((w) => '<div class="hist">✓ ' + esc(w) + '</div>').join("") + '</div>';
  if ((p.next || []).length) h += '<div class="card"><b>Up next</b>' + p.next.map((w) => '<div class="hist">→ ' + esc(w) + '</div>').join("") + '</div>';
  h += '<p class="mut">Questions any time: <a href="mailto:zshef@rankwise.ca" style="color:var(--accent)">zshef@rankwise.ca</a> · +1 778 887 0311</p>';
  app.innerHTML = h;
}
render();
</script>
</body>
</html>
