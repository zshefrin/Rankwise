<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rankwise — Dashboard</title>
<style>
  :root { --bg:#101418; --card:#1a2026; --line:#2a323a; --text:#e8edf2; --mut:#8a97a3;
          --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --accent:#60a5fa; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, system-ui, sans-serif; padding:12px; max-width:560px; margin:0 auto; }
  /* Dial Console gets a wide desktop canvas (list + dossier); text sections stay narrow for readability. */
  body.dial { max-width:1180px; }
  body.dial .dial-top { max-width:720px; }
  h1 { font-size:18px; margin:8px 0 2px; } .mut { color:var(--mut); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin:10px 0; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { border:0; border-radius:9px; padding:10px 12px; font-size:14px; font-weight:600; cursor:pointer; background:#2b3640; color:var(--text); }
  button.primary { background:var(--accent); color:#0b1220; }
  button.disp { flex:1 1 30%; padding:12px 6px; }
  button.disp.sel { outline:2px solid var(--accent); }
  button:disabled { opacity:.45; }
  input, textarea { width:100%; background:#0d1115; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:10px; font-size:15px; }
  a.tel { display:block; text-align:center; background:var(--ok); color:#06281c; font-weight:800; font-size:18px; padding:13px; border-radius:10px; text-decoration:none; margin:8px 0; }
  .banner { padding:10px 12px; border-radius:10px; font-size:14px; margin:8px 0; }
  .banner.bad { background:#3a1d1d; color:var(--bad); } .banner.ok { background:#15302a; color:var(--ok); }
  .banner.warn { background:#332a12; color:var(--warn); }
  .tally { display:flex; gap:6px; text-align:center; margin:8px 0; }
  .tally div { flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 2px; }
  .tally b { display:block; font-size:20px; }
  .tally.wk b { font-size:16px; }
  .bar { height:8px; background:#0d1115; border-radius:99px; overflow:hidden; margin:4px 0; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .done { opacity:.55; } .pill { font-size:12px; padding:2px 8px; border-radius:99px; background:#2b3640; }
  .pill.ok { background:#15302a; color:var(--ok); } .pill.warn { background:#332a12; color:var(--warn); }
  .pill.bad { background:#3a1d1d; color:var(--bad); }
  details summary { cursor:pointer; color:var(--accent); font-size:14px; margin:6px 0; }
  .opener { background:#0d1115; border-left:3px solid var(--accent); padding:10px; border-radius:8px; font-size:14px; margin:6px 0; font-style:italic; }
  /* ── dial card: site condition ─────────────────────────────────────── */
  .dc__hd { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .dc__nm { font-size:16px; font-weight:700; letter-spacing:-.012em; line-height:1.2; }
  .dc__ct { color:var(--mut); font-size:12.5px; margin-top:2px; }
  .dc__rk { flex:none; font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--mut); padding-top:2px; }
  .hook { display:flex; gap:8px; align-items:flex-start; margin:11px 0 0; padding:10px 12px; border-radius:10px; font-size:14.5px; font-weight:650; line-height:1.34; }
  .hook i { font-style:normal; flex:none; }
  .hook--bad  { background:rgba(248,113,113,.12); color:#fca5a5; }
  .hook--warn { background:rgba(251,191,36,.13);  color:#fcd34d; }
  .hook--info { background:rgba(96,165,250,.13);  color:#93c5fd; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; align-items:center; }
  .chip { font-size:11.5px; font-weight:600; padding:3px 8px; border-radius:7px; background:#222c34; color:#cdd6df; display:inline-flex; gap:5px; align-items:center; line-height:1.5; }
  .chip--bad { background:rgba(248,113,113,.15); color:#fca5a5; }
  .chip--ok  { background:rgba(52,211,153,.15);  color:#6ee7b7; }
  .chip--warn{ background:rgba(251,191,36,.15);  color:#fcd34d; }
  .dots { display:inline-flex; gap:3px; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .gapv { margin:12px 0 0; padding:10px 12px; background:#0e141a; border:1px solid var(--line); border-radius:10px; }
  .gapv__t { font-size:11px; color:var(--mut); margin-bottom:8px; }
  .gr { display:flex; align-items:center; gap:9px; margin:5px 0; }
  .gr__l { width:88px; flex:none; font-size:11.5px; color:#aab4bd; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gr__t { flex:1; height:8px; background:#141b22; border-radius:99px; overflow:hidden; }
  .gr__f { display:block; height:100%; border-radius:99px; min-width:6px; }
  .gr__f.them { background:#fb7185; } .gr__f.riv { background:#64748b; }
  .gr__n { width:52px; flex:none; text-align:right; font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums; color:#cdd6df; }
  .gr__n.them { color:#fca5a5; }
  .dccall { display:flex; align-items:center; justify-content:center; gap:9px; margin:12px 0 0; background:var(--ok); color:#04130d; font-weight:800; font-size:18px; padding:14px; border-radius:11px; text-decoration:none; font-variant-numeric:tabular-nums; transition:transform .12s ease, filter .12s ease; }
  .dccall:active { transform:scale(.985); filter:brightness(.94); }
  .dccall.dnc { background:rgba(248,113,113,.12); color:#fca5a5; font-weight:700; font-size:14px; }
  .sec { margin:11px 0 0; padding:10px 12px; border-radius:10px; }
  .sec__l { font-size:11px; font-weight:700; margin-bottom:7px; }
  .sec--open { background:rgba(96,165,250,.10); } .sec--open .sec__l { color:#93c5fd; }
  .sec--open p { font-size:13.5px; line-height:1.4; color:#dbe7f5; margin:0; }
  .sec--say { background:rgba(52,211,153,.08); } .sec--say .sec__l { color:#6ee7b7; }
  .pt { display:flex; gap:8px; align-items:flex-start; font-size:13.5px; line-height:1.34; margin:5px 0; color:#dceee6; }
  .pt b { color:#34d399; flex:none; font-weight:800; }
  .sec--avoid { background:rgba(248,113,113,.09); } .sec--avoid .sec__l { color:#fca5a5; }
  .sec--avoid .sec__l span { font-weight:500; color:var(--mut); }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:12px; padding:3px 9px; border-radius:7px; background:rgba(248,113,113,.15); color:#f4a8a8; }
  /* ── console: list rail + dossier ─────────────────────────────────────── */
  .console { display:flex; gap:14px; align-items:flex-start; margin-top:10px; }
  .rail { flex:0 0 270px; display:flex; flex-direction:column; gap:6px; max-height:calc(100vh - 40px); overflow-y:auto; position:sticky; top:8px; }
  .dossier { flex:1; min-width:0; }
  .railrow { width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 11px; cursor:pointer; color:var(--text); transition:border-color .12s, background .12s; }
  .railrow:hover { border-color:#3a4652; }
  .railrow.active { border-color:var(--accent); background:#18222c; }
  .railrow.done { opacity:.5; }
  .railrow__top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .railrow__nm { font-weight:650; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .railrow__sub { color:var(--mut); font-size:11.5px; margin-top:3px; display:flex; align-items:center; gap:6px; min-width:0; }
  .railrow__sub span.t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dossier-card { margin:0 !important; }
  .dgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; margin-top:2px; }
  .dcol { min-width:0; }
  .dback { display:none; margin-bottom:10px; background:#222c34; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 13px; font-size:13px; font-weight:600; cursor:pointer; }
  .verif { margin:11px 0 0; font-size:11.5px; color:var(--mut); display:flex; align-items:center; gap:7px; }
  .verif b { color:#6ee7b7; font-weight:600; }
  @media (max-width:900px) { .dgrid { grid-template-columns:1fr; gap:0; } }
  @media (max-width:760px) {
    .console { display:block; }
    .console .dossier { display:none; }
    .console.show .rail { display:none; }
    .console.show .dossier { display:block; }
    .console.show .dback { display:inline-flex; }
    .rail { position:static; max-height:none; }
  }
  .cond { font-size:12.5px; margin-top:6px; }
  .cond dl { display:grid; grid-template-columns:80px 1fr; gap:5px 10px; margin:0 0 4px; }
  .cond dt { color:var(--mut); } .cond dd { margin:0; }
  .cond__sec { font-size:11px; color:var(--mut); margin:11px 0 4px; }
  .maprow { display:flex; justify-content:space-between; gap:8px; font-size:12px; padding:3px 0; }
  .maprow + .maprow, .cgrid div + div { border-top:1px solid var(--line); }
  .maprow .miss { color:var(--bad); font-weight:700; } .maprow .hit { color:var(--ok); font-weight:700; }
  .cgrid div { display:flex; justify-content:space-between; gap:8px; padding:3px 0; }
  @media (prefers-reduced-motion: reduce) { .dccall { transition:none; } }
  .kit { background:#0d1115; border-radius:8px; padding:10px; font-size:13px; white-space:pre-wrap; max-height:300px; overflow-y:auto; }
  label.cb { display:flex; gap:8px; align-items:center; font-size:14px; margin:8px 0; }
  label.cb input { width:auto; transform:scale(1.3); }
  .hist { font-size:13px; border-top:1px solid var(--line); padding:6px 0; }
  table.pay { width:100%; border-collapse:collapse; font-size:13px; }
  table.pay td, table.pay th { padding:4px 6px; text-align:left; border-bottom:1px solid var(--line); }
  #toast { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); background:var(--accent); color:#0b1220; font-weight:700; padding:10px 18px; border-radius:99px; display:none; }

  /* ── Shared role dashboards ─────────────────────────────────────────────── */
  .role-shell { padding-bottom:56px; }
  .role-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin:10px 0 12px; flex-wrap:wrap; }
  .role-title { min-width:0; }
  .role-kicker { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); font-weight:750; }
  .role-title h1 { font-size:22px; line-height:1.1; margin:3px 0 2px; letter-spacing:0; }
  .role-actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .role-btn { border:1px solid var(--line); background:#151c22; color:#dce6ef; border-radius:8px; height:36px; padding:0 12px; font-size:13px; font-weight:700; }
  .role-btn.primary { background:var(--accent); color:#07111f; border-color:transparent; }
  .role-hero { border:1px solid #2d3842; background:#171f26; border-radius:12px; padding:14px; margin:10px 0; }
  .role-hero h2 { font-size:17px; line-height:1.22; margin:0 0 3px; letter-spacing:0; }
  .role-hero p { color:#a8b4bf; font-size:13px; margin:0; }
  .metric-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:10px 0; }
  @media(min-width:720px) { .metric-grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .metric { min-width:0; background:#141a20; border:1px solid #252f38; border-radius:8px; padding:10px; min-height:76px; }
  .metric .m-label { color:#93a0ac; font-size:11px; font-weight:750; text-transform:uppercase; letter-spacing:.04em; }
  .metric .m-value { font-size:22px; line-height:1.1; font-weight:800; margin-top:5px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .metric .m-note { color:#93a0ac; font-size:12px; margin-top:3px; }
  .metric.ok .m-value { color:var(--ok); } .metric.warn .m-value { color:var(--warn); }
  .metric.bad .m-value { color:var(--bad); } .metric.info .m-value { color:var(--accent); }
  .role-grid { display:grid; gap:10px; grid-template-columns:1fr; margin:10px 0; }
  @media(min-width:860px) { .role-grid.two { grid-template-columns:1fr 1fr; } }
  .role-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:13px; margin:10px 0; }
  .role-card h3 { font-size:14px; margin:0 0 8px; letter-spacing:0; }
  .role-row { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid #222a31; font-size:13px; }
  .role-row:first-child { border-top:0; }
  .role-row b { font-weight:750; }
  .role-row span:last-child { text-align:right; color:#dce6ef; }
  .role-empty { color:var(--mut); font-size:13px; padding:8px 0; }
  .mini-list { list-style:none; display:grid; gap:7px; }
  .mini-list li { display:flex; gap:9px; align-items:flex-start; padding:9px; border:1px solid #24303a; border-radius:8px; background:#131920; font-size:13px; }
  .mini-list .mark { width:7px; height:7px; flex:none; border-radius:50%; background:var(--accent); margin-top:6px; }
  .mini-list .mark.ok { background:var(--ok); } .mini-list .mark.warn { background:var(--warn); } .mini-list .mark.bad { background:var(--bad); }
  .mini-list .txt { min-width:0; flex:1; }
  .mini-list .sub { color:var(--mut); font-size:12px; margin-top:1px; }
  .role-table { width:100%; border-collapse:collapse; font-size:13px; }
  .role-table th { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.04em; text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); }
  .role-table td { padding:9px 6px; border-bottom:1px solid #222a31; vertical-align:top; }
  .role-table td.num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .meter { height:7px; background:#0d1115; border-radius:99px; overflow:hidden; margin-top:7px; }
  .meter i { display:block; height:100%; background:var(--accent); border-radius:99px; }
  .meter.ok i { background:var(--ok); } .meter.warn i { background:var(--warn); } .meter.bad i { background:var(--bad); }
  .work-split { display:grid; gap:10px; grid-template-columns:1fr; }
  @media(min-width:760px) { .work-split { grid-template-columns:1fr 1fr; } }
  .status-row { display:flex; flex-wrap:wrap; gap:7px; margin:10px 0; }
  .status-pill { display:inline-flex; align-items:center; gap:6px; min-height:28px; padding:5px 9px; border:1px solid #2b3640; border-radius:8px; background:#141a20; color:#aab5bf; font-size:12px; font-weight:700; }
  .status-pill b { color:#e7edf2; font-weight:800; }
  .status-pill.ok { border-color:#1f5a47; background:#10241f; color:#8ee9c6; }
  .status-pill.warn { border-color:#574414; background:#2b230f; color:#f8d76a; }
  .status-pill.bad { border-color:#5a2525; background:#301717; color:#fca5a5; }
  .status-pill.info { border-color:#27507a; background:#111e2c; color:#93c5fd; }
  .mission { display:grid; gap:8px; counter-reset:mission; }
  .mission-step { display:flex; gap:10px; align-items:flex-start; padding:10px; border:1px solid #24303a; border-radius:8px; background:#131920; font-size:13px; }
  .mission-step:before { counter-increment:mission; content:counter(mission); width:22px; height:22px; flex:none; display:grid; place-items:center; border-radius:7px; background:#213043; color:#93c5fd; font-weight:800; font-size:12px; }
  .mission-step b { display:block; font-size:13px; }
  .mission-step span { display:block; color:var(--mut); font-size:12px; margin-top:1px; }
  .signal-board { display:grid; gap:8px; grid-template-columns:1fr; margin:10px 0; }
  @media(min-width:720px) { .signal-board { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .signal-card { min-width:0; border:1px solid #24303a; border-radius:9px; background:#131920; padding:10px; }
  .signal-card .s-k { color:#93a0ac; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
  .signal-card .s-v { font-size:15px; font-weight:800; margin-top:4px; overflow-wrap:anywhere; }
  .signal-card .s-n { color:var(--mut); font-size:12px; margin-top:2px; }
  .timeline { display:grid; gap:8px; margin-top:8px; }
  .timeline-item { display:grid; grid-template-columns:auto 1fr auto; gap:9px; align-items:start; padding:10px; border:1px solid #24303a; border-radius:8px; background:#131920; font-size:13px; }
  .timeline-dot { width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:6px; }
  .timeline-title { font-weight:800; }
  .timeline-sub { color:var(--mut); font-size:12px; margin-top:1px; }
  .timeline-date { color:#93a0ac; font-size:12px; white-space:nowrap; text-align:right; }
  .attention-list { display:grid; gap:8px; margin-top:8px; }
  .attention-item { display:flex; gap:9px; align-items:flex-start; padding:10px; border:1px solid #40351b; border-radius:8px; background:#1d1a12; font-size:13px; }
  .attention-item.ok { border-color:#1e493c; background:#111f1b; }
  .attention-item b { display:block; }
  .attention-item span { color:var(--mut); display:block; font-size:12px; margin-top:1px; }
  body.client { max-width:980px; background:var(--bg); }
  body.client .role-shell { max-width:980px; margin:0 auto; }
  body.client .client-hero { background:linear-gradient(180deg,#18232c,#151b22); }
  body.client .client-hero .metric-grid { margin-bottom:0; }
  body.dial .seller-hero { background:linear-gradient(180deg,#172921,#151e24); border-color:#254539; }
  body.dial .seller-hero .role-kicker { color:#78d5ad; }
  body.dial .seller-hero h2 { color:#eefbf5; }
  body.dial .seller-shift { max-width:1180px; }
  body.dial .seller-shift .role-card { margin:0; }

  /* ── Operator cockpit — scoped to body.ops only. Nothing below touches seller/client views. ── */
  body.ops { max-width:1120px; background:radial-gradient(1200px 500px at 80% -10%,#14202c 0%,transparent 60%) var(--bg); padding:0; -webkit-font-smoothing:antialiased; }
  body.ops .ops-wrap { max-width:1120px; margin:0 auto; padding:0 16px 64px; }
  body.ops header.ops-top { display:flex; align-items:center; gap:12px; padding:18px 0 14px; flex-wrap:wrap; }
  body.ops .ops-brand { display:flex; align-items:baseline; gap:10px; }
  body.ops .ops-brand h1 { font-size:19px; font-weight:650; letter-spacing:-.01em; margin:0; }
  body.ops .ops-brand .ops-tag { font-size:12px; color:#6b7884; }
  body.ops .ops-spacer { flex:1; }
  body.ops .ops-asof { font-size:12px; color:#6b7884; }
  body.ops .ops-iconbtn { background:#141a20; border:1px solid #2a323a; color:#9aa7b3; border-radius:9px; height:34px; padding:0 12px; font-size:13px; font-weight:550; cursor:pointer; transition:.15s cubic-bezier(.22,.61,.36,1); }
  body.ops .ops-iconbtn:hover { color:#eef2f6; border-color:#36424c; }
  body.ops nav.ops-tabs { position:sticky; top:0; z-index:20; display:flex; gap:2px; background:rgba(14,18,22,.82); backdrop-filter:blur(8px); border-bottom:1px solid #222a31; margin:0 -16px; padding:0 12px; overflow-x:auto; scrollbar-width:none; }
  body.ops nav.ops-tabs::-webkit-scrollbar { display:none; }
  body.ops .ops-tab { appearance:none; background:none; border:0; color:#9aa7b3; font:550 14px/1 -apple-system,system-ui,sans-serif; cursor:pointer; padding:13px 14px; position:relative; white-space:nowrap; transition:color .15s cubic-bezier(.22,.61,.36,1); display:flex; gap:7px; align-items:center; }
  body.ops .ops-tab:hover { color:#eef2f6; }
  body.ops .ops-tab[aria-selected="true"] { color:#eef2f6; }
  body.ops .ops-tab[aria-selected="true"]::after { content:""; position:absolute; left:14px; right:14px; bottom:-1px; height:2px; background:#60a5fa; border-radius:2px; }
  body.ops .ops-tab .ops-badge { background:#1f272e; color:#9aa7b3; font-size:11px; font-weight:650; padding:1px 7px; border-radius:99px; border:1px solid #2a323a; }
  body.ops .ops-tab .ops-badge.hot { background:#3a1c1c; color:#fca5a5; border-color:#4a2222; }
  body.ops section.ops-view { padding-top:18px; animation:ops-rise .22s cubic-bezier(.22,.61,.36,1); }
  body.ops section.ops-view[hidden] { display:none; }
  @keyframes ops-rise { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  @media (prefers-reduced-motion:reduce) { body.ops section.ops-view { animation:none; } }

// Catch auth redirects (OAuth sign-in AND password-recovery links both return

(function () {
  if (!location.hash) return;
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("access_token")) {
    localStorage.setItem("rw_tok", h.get("access_token"));
    if (h.get("type") === "recovery" || h.get("type") === "invite") window._recovery = true;

function freshnessPill(label, value, warnHours, badHours) {
  const f = freshnessInfo(value, warnHours, badHours);
  return statusPill(label, f.label, f.tone);
}
function deltaTone(delta) {
  const s = String(delta == null ? '' : delta).trim();
  return s.startsWith('-') ? 'warn' : (s.startsWith('+') ? 'ok' : 'info');
}
function safeNum(n, fallback) {
  return (n == null || n === '' || isNaN(Number(n))) ? (fallback || '—') : Number(n).toLocaleString();
}
function toNum(v) {
  const n = Number(String(v == null ? '' : v).replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}
function pickList(obj, keys) {
  for (const k of keys) if (Array.isArray(obj && obj[k]) && obj[k].length) return obj[k];
  return [];
}
function planParts(item) {
  if (typeof item === 'string') return { title:item, sub:'planned work', date:'' };
  item = item || {};
  return {
    title: compact(item.title || item.topic || item.name || item.page || item.keyword, 'Planned item'),
    sub: [item.channel || item.type || item.stage || item.status, item.goal || item.note || item.reason].filter(Boolean).join(' · '),
    date: item.date || item.due || item.publish_date || item.scheduled_for || '',
  };
}

// The dial card is one function so the call button, DNC suppression, and the
// trust-tiered ✅/❌ stay co-located. Every field is optional → degrades to a
// name + flat signal line + call button when intel={}.
function callBtn(p) {
  if (p.intel && p.intel.dnc) return '<div class="dccall dnc">📵 DO NOT CALL — number withheld</div>';
  if (!p.phone) return '';
  return '<a class="dccall" href="tel:' + esc(p.phone).replace(/[^0-9+]/g, "") + '">📞 ' + esc(p.phone) + '</a>';
}

function hookBlock(it) {
  if (it.dnc) return '<div class="hook hook--bad"><i>⛔</i><span>DO NOT CALL — ' + esc(it.dnc_reason || 'flagged') + '</span></div>';
  if (!it.hook) return '';
  const bad = /invisible|no website|no google|parked|reviews vs/i.test(it.hook);
  const cls = it.is_icp === false ? 'warn' : (bad ? 'bad' : 'warn');
  return '<div class="hook hook--' + cls + '"><i>' + (it.is_icp === false ? '⚠' : '🎯') + '</i><span>' + esc(it.hook) + '</span></div>';
}

function chipsRow(it) {
  const c = [];
  if (it.map_pack && it.map_pack.length) {
    const hit = it.map_pack.filter((m) => m.rank != null).length;
    const dots = it.map_pack.map((m) => '<span class="dot' + (m.rank != null ? ' on' : '') + '"></span>').join('');
    c.push('<span class="chip' + (hit ? '' : ' chip--bad') + '"><span class="dots">' + dots + '</span> map ' + hit + '/' + it.map_pack.length + '</span>');
  }
  if (it.aeo && it.aeo.cited === false) c.push('<span class="chip">AI ✕</span>');
  if (it.icp_label) c.push(it.is_icp === false
    ? '<span class="chip chip--warn">' + esc(it.icp_label) + '</span>'
    : '<span class="chip chip--ok">ICP ✓</span>');
  if (it.trust) c.push('<span class="chip">trust ' + esc(it.trust) + '</span>');
  return c.length ? '<div class="chips">' + c.join('') + '</div>' : '';
}

// review-gap as proportional bars — 9 vs 12,146 lands harder as a bar than text
function gapViz(it) {
  const bar = (lab, n, max, kind) => {
    const w = max > 0 ? Math.max(n > 0 ? 5 : 2, Math.round((n / max) * 100)) : 2;
    return '<div class="gr"><span class="gr__l">' + esc(clip(lab, 16)) + '</span>' +
      '<span class="gr__t"><span class="gr__f ' + kind + '" style="width:' + w + '%"></span></span>' +
      '<span class="gr__n ' + (kind === 'them' ? 'them' : '') + '">' + (n != null ? esc(num(n)) : '—') + '</span></div>';
  };
  if (it.review_gap) {
    const t = Number(it.review_gap.theirs) || 0, r = Number(it.review_gap.rival_reviews) || 0, mx = Math.max(t, r, 1);
    return '<div class="gapv"><div class="gapv__t">Google reviews — them vs the local leader</div>' +
      bar('Them', t, mx, 'them') + bar(it.review_gap.rival, r, mx, 'riv') + '</div>';
  }
  if (it.competitors && it.competitors.length) {
    const c0 = it.competitors[0];
    return '<div class="gapv"><div class="gapv__t">Beating them on Google Maps</div>' +
      bar(c0.name, c0.reviews, c0.reviews || 1, 'riv') + '</div>';
  }
  return '';
}

function proofList(it) {

function avoidTags(it) {

// ── Console: a clickable rail of prospects + a full dossier for the selected
// one. Desktop shows both; phone shows the rail, tap → dossier, back to queue.
function buildRail(cards, done, sel) {
  if (!cards.length) return '<div class="rail"><div class="card mut">No dial cards pushed yet — Zack runs push_seller_queue.py.</div></div>';
  return '<div class="rail">' + cards.map((p) => {
    const it = p.intel || {};
    const isDone = done[p.slug];
    const dots = (it.map_pack && it.map_pack.length)
      ? '<span class="dots">' + it.map_pack.map((m) => '<span class="dot' + (m.rank != null ? ' on' : '') + '"></span>').join('') + '</span>' : '';
    return '<button class="railrow' + (p.slug === sel ? ' active' : '') + (isDone ? ' done' : '') +
      '" data-slug="' + esc(p.slug) + '" onclick="selectProspect(\'' + esc(p.slug) + '\')">' +
      '<div class="railrow__top"><span class="railrow__nm">' + esc(p.business_name) + '</span>' +
      (isDone ? '<span class="chip chip--ok">✓</span>' : '<span class="dc__rk">#' + (p.rank || 0) + '</span>') + '</div>' +
      '<div class="railrow__sub"><span class="t">' + esc(p.city) + (it.hook ? ' · ' + esc(clip(it.hook, 26)) : '') + '</span>' + dots + '</div>' +
      '</button>';
  }).join('') + '</div>';
}

function attemptPillFor(slug) {
  if ((window._done || {})[slug]) return '';
  const past = (window._attempts || {})[slug] || [];
  if (!past.length) return '';
  return '<span class="pill warn">attempt ' + (past.length + 1) + ' · last: ' + esc(past[0].disposition) + ' ' + ptTime(past[0].called_at) + '</span>';
}

function renderDossier(slug) {
  window._sel = slug;
  document.querySelectorAll('.railrow').forEach((r) => r.classList.toggle('active', r.dataset.slug === slug));
  const p = (window._cards || []).find((c) => c.slug === slug);
  const dz = document.getElementById('dossier');
  if (dz && p) dz.innerHTML = buildDossier(p, (window._done || {})[slug], attemptPillFor(slug));

function selectProspect(slug) {
  renderDossier(slug);
  const con = document.querySelector('.console'); if (con) con.classList.add('show');
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function backToQueue() { const con = document.querySelector('.console'); if (con) con.classList.remove('show'); }

function buildDossier(p, done, attemptPill) {
  const it = p.intel || {};
  const has = Object.keys(it).length > 0;
  let h = '<div class="card dossier-card" data-card="' + esc(p.slug) + '">' +
    '<button class="dback" onclick="backToQueue()">← Queue</button>' +
    '<div class="dc__hd"><div><div class="dc__nm">' + esc(p.business_name) + '</div>' +
    '<div class="dc__ct">' + esc(p.city) + (!has && p.signal ? ' · ' + esc(p.signal) : '') + '</div></div>' +
    (done ? '<span class="chip chip--ok">✓ ' + esc(done) + '</span>' : '<span class="dc__rk">#' + (p.rank || 0) + '</span>') + '</div>';
  if (p.pushed_at) h += '<div style="margin-top:5px">' + freshnessPill('pushed', p.pushed_at, 48, 168) + '</div>';
  if (attemptPill) h += '<div style="margin-top:7px">' + attemptPill + '</div>';
  if (!has) return h + callBtn(p) + logForm(p.slug, false) + '</div>';   // degrade
  h += hookBlock(it) + chipsRow(it) + callBtn(p);
  h += '<div class="dgrid">' +
    '<div class="dcol">' + openWith(it) + proofList(it) + avoidTags(it) + '</div>' +
    '<div class="dcol">' + gapViz(it) + evidenceBlock(it) + '</div></div>';
  h += '<details><summary>Exact verified wording (the receipts)</summary>' + wordingBlock(it) + '</details>';
  if (p.opener) h += '<details><summary>Opener script</summary><div class="opener">' + esc(fillSellerName(p.opener)) + '</div></details>';
  if (p.audit_url && /^https?:\/\//.test(p.audit_url)) h += '<p class="mut" style="margin-top:10px">Live audit: <a href="' + esc(p.audit_url) + '" style="color:var(--accent)">' + esc(p.audit_url) + '</a></p>';
  return h + logForm(p.slug, false) + '</div>';
}

// The evidence half of the dossier — visible proof for due diligence.
function evidenceBlock(it) {
  let dl = '';
  const w = it.website || {};
  if (w.status) {
    const live = w.status === 'confirmed' && w.url && /^https?:\/\//.test(w.url);
    const dom = w.url ? esc(w.url.replace(/^https?:\/\//, '').replace(/\/$/, '')) : '';
    const v = live ? ('<a href="' + esc(w.url) + '" target="_blank" rel="noopener" style="color:var(--accent)">' + dom + '</a> <span style="color:#6ee7b7">✓ live</span>')
      : (w.status === 'candidate' ? ((dom ? dom + ' ' : '') + '<span style="color:var(--warn)">— parked / dead, goes nowhere</span>')
        : (w.status === 'none-found' ? '<span style="color:var(--bad)">none — invisible online</span>' : esc(w.status)));
    dl += '<dt>Website</dt><dd>' + v + '</dd>';
  }
  if (it.gbp) {
    const g = it.gbp, parts = [];
    if (g.rating != null) parts.push('⭐ ' + esc(g.rating));
    if (g.reviews != null) parts.push(esc(num(g.reviews)) + ' reviews');
    if (g.category) parts.push('<span' + (/hvac|heat/i.test(g.category) ? '' : ' style="color:var(--warn)"') + '>' + esc(g.category) + (/hvac|heat/i.test(g.category) ? '' : ' (not HVAC)') + '</span>');
    dl += '<dt>Google</dt><dd>' + (parts.join(' · ') || '—') + '</dd>';
  } else {
    dl += '<dt>Google</dt><dd><span style="color:var(--bad)">no Business Profile found</span></dd>';
  }
  if (it.owner) dl += '<dt>Owner</dt><dd>' + esc(it.owner.name) + (it.owner.title ? ' · ' + esc(it.owner.title) : '') +
    (it.owner.unverified ? ' <span class="mut">⚠ unverified</span>' : '') + '</dd>';
  if (it.email) dl += '<dt>Email</dt><dd>' + esc(it.email) + '</dd>';
  // A6 — site perf talking point (score + LCP from Places enrichment)
  if (it.site_perf) {
    const sp = it.site_perf;
    const score = sp.score != null ? esc(String(sp.score)) + '/100' : null;
    const lcp = sp.lcp ? 'LCP ' + esc(sp.lcp) : null;
    const spTxt = [score, lcp].filter(Boolean).join(' · ');
    if (spTxt) dl += '<dt>Site</dt><dd>' + spTxt + '</dd>';
  }
  // A5 — prior call history (most-recent seller disposition for this prospect)
  if (it.prior_call && it.prior_call.disposition) {
    const pc = it.prior_call;
    let pcTxt = esc(pc.disposition);
    if (pc.date) pcTxt += ' <span class="mut">(' + esc(pc.date) + ')</span>';
    if (pc.note) pcTxt += ' — ' + esc(pc.note);
    dl += '<dt>Last contact</dt><dd>' + pcTxt + '</dd>';
  }
  let h = '<div class="cond"><dl>' + dl + '</dl>';
  if (it.map_pack && it.map_pack.length) {
    h += '<div class="cond__sec">Map pack — core queries</div>';
    h += it.map_pack.map((m) => '<div class="maprow"><span>' + esc(m.q) + '</span>' +
      (m.rank != null ? '<span class="hit">#' + esc(m.rank) + '</span>' : '<span class="miss">not in pack</span>') + '</div>').join('');
  }
  if (it.competitors && it.competitors.length) {
    h += '<div class="cond__sec">Who\'s winning the map</div><div class="cgrid">';
    h += it.competitors.map((c) => '<div><span>' + esc(c.name) + '</span><span class="mut">' +
      (c.reviews != null ? esc(num(c.reviews)) + ' rev' : '') + (c.rating != null ? ' · ⭐' + esc(c.rating) : '') + '</span></div>').join('');
    h += '</div>';
  }
  // verification status — surfaces the system's confidence so diligence is honest
  if (it.trust === 'low') {
    h += '<div class="verif" style="color:var(--warn)">⚠ Lower confidence — triple-check on the call before quoting anything</div>';
  } else {
    h += '<div class="verif">🛡 <b>Verified</b> · Google Places + adversarial crawl-check' + (it.trust ? ' · ' + esc(it.trust) + ' confidence' : '') + '</div>';
  }
  return h + '</div>';
}

// The verbatim verified hooks + the full don't-say list — the exact wording.
function wordingBlock(it) {
  let h = '';
  if (it.safe_to_say && it.safe_to_say.length) {
    h += '<div class="cond__sec">✅ Safe to say — exact wording</div><ul style="margin:0;padding-left:16px">' +
      it.safe_to_say.map((s) => '<li style="margin:3px 0;line-height:1.42">' + esc(s) + '</li>').join('') + '</ul>';
  }
  if (it.dont_say && it.dont_say.length) {
    h += '<div class="cond__sec">❌ Don\'t say — full list <span style="color:var(--bad)">(unverified)</span></div><ul style="margin:0;padding-left:16px">' +
      it.dont_say.map((s) => '<li style="margin:3px 0;line-height:1.42;color:#f0a8a8">' + esc(s) + '</li>').join('') + '</ul>';
  }
  return '<div class="cond">' + (h || '<p class="mut">No further wording.</p>') + '</div>';
}

window._opsTab = window._opsTab || 'today';
function opsTab(id) {

  const tabs = document.querySelectorAll('.ops-tab');
  views.forEach(function(v) { v.hidden = (v.id !== 'ops-' + id); });
  tabs.forEach(function(t) { t.setAttribute('aria-selected', String(t.dataset.v === id)); });
  window.scrollTo({ top: 0, behavior: 'instant' });
}
function opsApplyRowVisibility(row) {
  row.hidden = row.dataset.filterHidden === '1' || row.dataset.searchHidden === '1';
}
function opsSetFilter(group, value) {
  document.querySelectorAll('[data-filter-group="' + group + '"]').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.filterValue === value);
  });
  document.querySelectorAll('[data-filter-target="' + group + '"]').forEach(function(row) {
    const raw = row.dataset.filterValues || '';
    row.dataset.filterHidden = !(value === 'all' || raw.split(' ').indexOf(value) >= 0) ? '1' : '0';
    opsApplyRowVisibility(row);
  });
}
function opsSearch(group, value) {
  const q = String(value || '').trim().toLowerCase();
  document.querySelectorAll('[data-search-target="' + group + '"]').forEach(function(row) {
    const text = String(row.dataset.searchText || row.textContent || '').toLowerCase();
    row.dataset.searchHidden = q && text.indexOf(q) < 0 ? '1' : '0';
    opsApplyRowVisibility(row);
  });
}
function opsClientDetail(key) {
  document.querySelectorAll('.ops-client-pick').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.clientKey === key);

      '</table><p class="mut" style="margin-top:9px">A dash means the term is not in the tracked top results yet.</p></section>';
  } else {
    h += '<section class="role-card"><h3>Where you rank on Google</h3><p class="role-empty">Rank tracking appears after the next SERP capture.</p></section>';
  }

  if ((p.traffic || []).length) {
    const mx = Math.max.apply(null, p.traffic.map((w) => w.clicks || 0).concat([1]));
    h += '<section class="role-card"><h3>Search clicks trend</h3>' +
      p.traffic.map((w) => '<div class="role-row"><b>' + esc(w.week) + '</b><span>' + esc(w.clicks || 0) + ' clicks · ' + esc(w.impressions || 0) + ' impressions</span></div>' +
        meter(w.clicks || 0, mx, (w.clicks || 0) ? 'ok' : '')).join("") + '</section>';
  } else {
    h += '<section class="role-card"><h3>Search clicks trend</h3><p class="role-empty">Traffic trend lands after Google Search Console access is connected.</p></section>';
  }
  h += '</div>';

  h += '<div class="role-grid two">';
  h += '<section class="role-card"><h3>Reputation</h3>';
  if (reviews.count != null) {
    h += '<div class="metric-grid">' +
      metric('Reviews', reviews.count, 'Google Business Profile', 'info') +
      metric('Rating', reviews.rating != null ? reviews.rating : '—', reviews.note || '', reviews.rating >= 4 ? 'ok' : 'warn') +
      '</div>';
  } else {
    h += '<p class="role-empty">Review data has not been connected yet.</p>';
  }
  h += '</section>';

  h += '<section class="role-card"><h3>AI visibility</h3>';
  if (aeo.citation_rate_pct != null) {
    h += '<div class="role-row"><b>Current rate</b><span>' + esc(aeo.citation_rate_pct) + '% cited</span></div>' +
      '<div class="role-row"><b>Queries checked</b><span>' + esc(aeo.cited || 0) + ' of ' + esc(aeo.total || 0) + '</span></div>';
    if ((aeo.engines || []).length) {
      h += '<ul class="mini-list" style="margin-top:9px">' + aeo.engines.map((e) =>
        miniItem(e.engine, e.cited + '/' + e.total + ' cited · ' + e.rate_pct + '%', e.rate_pct > 0 ? 'ok' : 'warn')).join("") + '</ul>';
    }
  } else {
    h += '<p class="role-empty">AI citation tracking appears once the citation snapshot is available.</p>';
  }
  h += '</section></div>';

  h += '<div class="role-grid two">';
  h += '<section class="role-card"><h3>What needs attention</h3>';
  if (attention.length) {
    h += '<div class="attention-list">' + attention.slice(0, 5).map((a) =>
      '<div class="attention-item ' + esc(a.tone || '') + '"><div class="timeline-dot"></div><div><b>' +
      esc(a.title) + '</b><span>' + esc(a.sub) + '</span></div></div>').join("") + '</div>';
  } else {
    h += '<div class="attention-list"><div class="attention-item ok"><div class="timeline-dot"></div><div><b>No urgent issues in this snapshot</b><span>We will keep watching rankings, traffic, reviews, and AI citations.</span></div></div></div>';
  }
  h += '</section>';

  h += '<section class="role-card"><h3>' + esc(plannedTitle) + '</h3>';
  if (planned.length) {
    h += '<div class="timeline">' + planned.slice(0, 6).map((item) => {
      const it = planParts(item);
      return '<div class="timeline-item"><span class="timeline-dot"></span><div><div class="timeline-title">' + esc(it.title) + '</div>' +
        (it.sub ? '<div class="timeline-sub">' + esc(it.sub) + '</div>' : '') + '</div><div class="timeline-date">' + esc(it.date || 'planned') + '</div></div>';
    }).join("") + '</div>';
  } else {
    h += '<p class="role-empty">' + esc(planItems.length ? 'Planned content will show here once Zack publishes the next content queue.' : 'Upcoming work will show here once the next delivery plan is ready.') + '</p>';
  }
  h += '</section></div>';

  if (tracking.length) {
    h += '<section class="role-card"><h3>What we are tracking</h3><div class="signal-board">' +
      tracking.slice(0, 6).map((item) => {
        const it = planParts(item);
        return '<div class="signal-card"><div class="s-k">' + esc(it.date || it.sub || 'signal') + '</div><div class="s-v">' + esc(it.title) + '</div>' +
          (it.sub && it.sub !== it.date ? '<div class="s-n">' + esc(it.sub) + '</div>' : '') + '</div>';
      }).join("") + '</div></section>';
  }

  h += '<section class="role-card"><h3>Proof timeline</h3>';
  if (proofTimeline.length) {
    h += '<div class="timeline">' + proofTimeline.slice(0, 8).map((item) => {
      const it = planParts(item);
      const status = item.status || item.stage || item.type || it.sub || 'update';
      return '<div class="timeline-item"><span class="timeline-dot"></span><div><div class="timeline-title">' + esc(it.title) + '</div>' +
        '<div class="timeline-sub">' + esc([status, item.note || item.detail || it.sub].filter(Boolean).join(' · ')) + '</div></div><div class="timeline-date">' + esc(item.date || item.updated_at || it.date || 'live') + '</div></div>';
    }).join("") + '</div>';
  } else {
    h += '<p class="role-empty">Proof timeline appears as shipped work and metric movement accumulate.</p>';
  }
  h += '</section>';

  h += '<section class="role-card"><h3>Files and reports</h3>';
  if (clientReports.length) {
    h += '<div class="timeline">' + clientReports.slice(0, 8).map((item) => {
      const it = planParts(item);
      const url = safeHref(item.url || item.href || item.file_url || '');
      return '<div class="timeline-item"><span class="timeline-dot"></span><div><div class="timeline-title">' + esc(it.title || item.name || 'Report') + '</div>' +
        '<div class="timeline-sub">' + esc([item.type || item.kind || 'file', item.status || it.sub].filter(Boolean).join(' · ')) + '</div></div>' +
        '<div class="timeline-date">' + (url ? '<a href="' + esc(url) + '" style="color:var(--accent)" target="_blank" rel="noopener">Open</a>' : esc(item.date || 'ready')) + '</div></div>';
    }).join("") + '</div>';
  } else {
    h += '<p class="role-empty">Reports, shared assets, and approved deliverables will appear here once the storage path is connected.</p>';
  }
  h += '</section>';

  h += '<section class="role-card"><h3>Work plan</h3><div class="work-split">' +
    '<div><div class="role-kicker">Done recently</div>' +
    ((p.wins || []).length ? '<ul class="mini-list" style="margin-top:8px">' + p.wins.map((w) => miniItem(w, '', 'ok')).join("") + '</ul>' : '<p class="role-empty">Recent work will show here after the first delivery cycle.</p>') +
    '</div><div><div class="role-kicker">Up next</div>' +
    ((p.next || []).length ? '<ul class="mini-list" style="margin-top:8px">' + p.next.map((w) => miniItem(w, '', 'info')).join("") + '</ul>' : '<p class="role-empty">Next actions are being planned.</p>') +
    '</div></div></section>';

  h += '<p class="mut" style="margin:14px 2px">Questions any time: <a href="mailto:zshef@rankwise.ca" style="color:var(--accent)">zshef@rankwise.ca</a> · +1 778 887 0311</p></div>';
  app.innerHTML = h;
}
render();
</script>
</body>
</html>
