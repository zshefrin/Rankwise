<title>Rankwise — Command</title>
<style>
/* ── tokens ──────────────────────────────────────────────────────────────
   Dark is the default register (operator checks this at odd hours; a calm,
   low-glare surface is the right scene) with a verified light override via
   prefers-color-scheme — every fg/bg pair below is WCAG-checked (contrast.mjs,
   portal-v2-premium-pass-2026-08-27.md), not eyeballed. --mut/#5d6b78 and
   .pcard .src/#4d5a66 in the PRIOR token set both measured under 4.5:1 on
   their own backgrounds (3.51:1 / 2.53:1) — --ink-3 below replaces both. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:dark;
  --bg:#0b0f14;--surface:#12181f;--surface-2:#161d26;--surface-3:#080c10;
  --edge:#232c37;--edge-soft:#1a222c;
  --ink:#e9eef3;--ink-2:#a9b6c2;--ink-3:#7f8b98;
  --acc:#e8a33d;--acc-ink:#141414;--acc-soft:#2b2213;--acc-soft-edge:#6b5423;
  --ok:#46a96c;--ok-soft:#132018;--ok-soft-edge:#1e3d2b;
  --warn:#d9822b;--warn-soft:#211a10;--warn-soft-edge:#4a3419;
  --bad:#d95c5c;--bad-soft:#241414;--bad-soft-edge:#5c2727;
  --info:#6fa3e0;--info-soft:#0f1c2b;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.2);
  --overlay:#0d141bd9;
  --radius-sm:6px;--radius:9px;--radius-lg:12px;
  --ease:cubic-bezier(.16,1,.3,1);--dur-fast:120ms;--dur:180ms;
  --z-sticky:20;--z-toast:50;
  --focus-ring:0 0 0 2px var(--bg),0 0 0 4px var(--acc);
}
@media (prefers-color-scheme:light){
  :root{
    color-scheme:light;
    --bg:#f6f7f9;--surface:#ffffff;--surface-2:#eef0f3;--surface-3:#eef0f3;
    --edge:#dde1e6;--edge-soft:#e6e9ed;
    --ink:#161a1f;--ink-2:#454e57;--ink-3:#616b74;
    --acc:#a3610a;--acc-ink:#ffffff;--acc-soft:#fdf1e2;--acc-soft-edge:#e9c795;
    --ok:#1f7a45;--ok-soft:#e8f5ec;--ok-soft-edge:#bfe4cc;
    --warn:#a15a06;--warn-soft:#fbeee0;--warn-soft-edge:#edcfa2;
    --bad:#b83232;--bad-soft:#fbe9e9;--bad-soft-edge:#efbcbc;
    --info:#2f5fae;--info-soft:#e9f0fb;
    --shadow:0 1px 2px rgba(30,35,45,.07),0 1px 1px rgba(30,35,45,.05);
    --overlay:#ffffffe6;
  }
}
html{scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:var(--radius-sm)}
.section-h{margin:22px 0 9px;font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;
  font-weight:650;display:flex;align-items:baseline;gap:8px}
.section-h:first-child{margin-top:0}
.section-note{color:var(--ink-3);font-size:11.5px;padding:6px 0 2px}
#app{display:grid;grid-template-columns:196px 1fr;min-height:100vh}
nav{background:var(--surface-3);border-right:1px solid var(--edge);padding:18px 0;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column}
.brand{padding:0 18px 16px;font-weight:800;letter-spacing:.04em;font-size:15px}
.brand span{color:var(--acc)}
.navlink{display:flex;justify-content:space-between;align-items:center;width:100%;padding:9px 15px;margin:0 8px 2px;
  color:var(--ink-3);font:600 13.5px inherit;text-decoration:none;cursor:pointer;background:none;border:0;
  border-radius:var(--radius-sm);text-align:left;transition:background-color var(--dur) var(--ease),color var(--dur) var(--ease);
  width:calc(100% - 16px)}
.navlink:hover{background:var(--edge-soft);color:var(--ink-2)}
.navlink.on{color:var(--ink);background:var(--acc-soft)}
.navlink .n{background:var(--surface-2);border-radius:10px;padding:1px 8px;font-size:11px;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.navlink.on .n{background:var(--acc-soft-edge);color:var(--acc-ink)}
nav .foot{margin-top:auto;padding:16px 18px 0;color:var(--ink-3);font-size:11px;line-height:1.6}
main{padding:0 0 60px;min-width:0}
.mast{position:relative;height:64px;min-height:64px;border-bottom:1px solid var(--edge);background:var(--surface-3);overflow:hidden}
.mast .hud{position:absolute;top:12px;right:14px;display:flex;gap:8px;pointer-events:none}
.hud .pill{background:var(--overlay);border:1px solid var(--edge);border-radius:7px;padding:5px 11px;font:11.5px inherit;
  color:var(--ink-2);backdrop-filter:blur(4px);pointer-events:auto;cursor:default;
  transition:border-color var(--dur) var(--ease)}
.hud button.pill{cursor:pointer}
.hud .pill:hover{border-color:var(--ink-3)}
.hud .pill b{color:var(--ink);font-variant-numeric:tabular-nums}
.mast .open-map{color:var(--acc);font:12px inherit;background:var(--overlay);border:1px solid var(--edge);
  border-radius:7px;padding:4px 10px;text-decoration:none;cursor:pointer;pointer-events:auto}
.mast .open-map:hover{border-color:var(--ink-3)}
.ctos-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:16px 0 22px}
.ctos-stat{background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius-lg);padding:14px 16px}
.ctos-stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:3px}
.ctos-atlas{width:100%;height:70vh;min-height:540px;border:1px solid var(--edge);border-radius:var(--radius-lg);background:var(--surface-3)}
.brief{max-width:880px;margin:0 auto;padding:26px 28px}
.status{font-size:23px;font-weight:750;letter-spacing:-.015em;display:flex;align-items:center;gap:11px;
  text-wrap:balance;margin-bottom:4px}
.status.sub{font-size:19px;margin-bottom:2px}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.status small{color:var(--ink-3);font-weight:400;font-size:12.5px;margin-left:auto;text-align:right;line-height:1.5}
.cards{display:flex;flex-direction:column;gap:9px;margin:16px 0 22px}
.dcard{background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius-lg);padding:14px 16px;
  box-shadow:var(--shadow)}
.dcard.tone-acc{background:var(--acc-soft);border-color:var(--acc-soft-edge)}
.dcard.tone-bad{background:var(--bad-soft);border-color:var(--bad-soft-edge)}
.dcard.tone-warn{background:var(--warn-soft);border-color:var(--warn-soft-edge)}
.dcard .q{font-size:14.5px;font-weight:650;display:flex;align-items:baseline;gap:8px;min-width:0}
.dcard.row .q{font-size:13.5px}
.dcard .why{color:var(--ink-2);font-size:12.5px;margin:5px 0 10px;white-space:pre-wrap;text-wrap:pretty}
.acts{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.acts small{color:var(--ink-3);margin-left:auto;font-size:11px}
.btn{border:1px solid var(--edge);background:var(--surface);border-radius:var(--radius-sm);padding:6px 13px;
  font:600 12.5px inherit;color:var(--ink);cursor:pointer;transition:background-color var(--dur) var(--ease),
  border-color var(--dur) var(--ease),color var(--dur) var(--ease);touch-action:manipulation}
.btn:hover:not(:disabled){background:var(--edge-soft);border-color:var(--ink-3)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.rec{background:var(--acc-soft);border-color:var(--acc-soft-edge);color:var(--acc)}
.btn.rec:hover:not(:disabled){background:var(--acc-soft-edge)}
.btn:disabled{opacity:.42;cursor:default}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 9px;
  border-radius:99px;letter-spacing:.01em;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge-bad{background:var(--bad-soft);color:var(--bad)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-neutral{background:var(--surface-2);color:var(--ink-3)}
.sev-dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none;margin-right:1px}
.sev-dot.bad{background:var(--bad)}
.sev-dot.warn{background:var(--warn)}
.sev-dot.info{background:var(--info)}
.rollup{background:var(--surface-2);border:1px solid var(--edge);border-radius:var(--radius);padding:11px 14px;
  margin-bottom:22px;font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;
  gap:10px;cursor:pointer;text-align:left;width:100%;font-family:inherit;transition:background-color var(--dur) var(--ease)}
.rollup:hover{background:var(--edge-soft)}
.rollup b{color:var(--ink)}
.rollup .go{color:var(--acc);font-size:12.5px;font-weight:600}
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.pcard{background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius-lg);padding:13px 14px;
  box-shadow:var(--shadow);min-width:0}
.pcard h4{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px;
  display:flex;justify-content:space-between;gap:6px;font-weight:650}
.pcard .src{font-size:10px;color:var(--ink-3);text-transform:none;letter-spacing:0;white-space:nowrap}
.pcard .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.pcard small{color:var(--ink-2);font-size:11.5px;display:block;margin-top:2px}
.log{border-top:1px solid var(--edge);padding-top:15px;color:var(--ink-2);font-size:13px;line-height:1.8}
.log b{color:var(--ink)}
.log .t{color:var(--ink-3);font-variant-numeric:tabular-nums;margin-right:8px;font-size:11.5px}
.state{font-size:13px;padding:11px 14px;border-radius:var(--radius);border:1px dashed var(--edge);color:var(--ink-3);
  margin-bottom:14px}
.state-error{border-style:solid;border-color:var(--bad-soft-edge);background:var(--bad-soft);color:var(--bad)}
.state-error b{color:var(--ink);display:block;margin-bottom:3px;font-size:13.5px}
.empty{color:var(--ink-3);font-size:13px;padding:8px 0}
/* skeleton (first paint, before any snapshot has loaded) */
.skel{background:linear-gradient(100deg,var(--surface) 40%,var(--surface-2) 50%,var(--surface) 60%);
  background-size:200% 100%;animation:skel-sheen 1.5s ease-in-out infinite;border-radius:var(--radius-sm)}
@keyframes skel-sheen{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none;background:var(--surface-2)}}
/* login */
.login{max-width:340px;margin:16vh auto;background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius-lg);
  padding:26px;box-shadow:var(--shadow)}
.login h2{font-size:17px;margin-bottom:18px}
.login label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:5px}
.login-desc{color:var(--ink-2);font-size:13px;margin-bottom:18px;line-height:1.55}
.login input{width:100%;background:var(--bg);border:1px solid var(--edge);border-radius:var(--radius-sm);color:var(--ink);
  padding:10px 12px;font:14px inherit;margin-bottom:12px;transition:border-color var(--dur) var(--ease)}
.login input:focus-visible{border-color:var(--acc);box-shadow:none}
.login input::placeholder{color:var(--ink-3)}
.btn-full{display:block;width:100%;background:var(--acc);border:1px solid var(--acc);border-radius:var(--radius-sm);
  padding:10px;font:600 14px inherit;color:var(--acc-ink);cursor:pointer;transition:filter var(--dur) var(--ease);
  margin-top:2px}
.btn-full:hover:not(:disabled){filter:brightness(1.08)}
.btn-full:disabled{opacity:.6;cursor:default}
.btn-full.btn-outline{background:none;border-color:var(--edge);color:var(--ink-2);margin-top:8px}
.btn-full.btn-outline:hover{filter:none;border-color:var(--ink-3);background:var(--edge-soft)}
.login-link{display:block;margin-top:14px;color:var(--ink-3);font-size:12px;text-align:center;text-decoration:none}
.login-link:hover{color:var(--ink-2)}
.login .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:1em}
/* generic form fields (record-revenue and any future dedicated-form action) */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.field label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:5px}
.field input{width:100%;background:var(--bg);border:1px solid var(--edge);border-radius:var(--radius-sm);color:var(--ink);
  padding:8px 11px;font:13.5px inherit;transition:border-color var(--dur) var(--ease)}
.field input:focus-visible{border-color:var(--acc);box-shadow:none}
.field input::placeholder{color:var(--ink-3)}
.field input.field-invalid{border-color:var(--bad)}
.form-err{color:var(--bad);font-size:12.5px;min-height:1em}
@media (max-width:520px){.field-grid{grid-template-columns:1fr}}
/* Conversations two-pane inbox (CONVERSATIONS-FOR-REAL, build.GOAL.md @ dca7fba0,
   2026-08-27). GoHighLevel-style thread list | detail. */
.convo-shell{display:grid;grid-template-columns:260px 1fr;border:1px solid var(--edge);border-radius:var(--radius-lg);
  overflow:hidden;background:var(--surface);box-shadow:var(--shadow);height:min(560px,70vh);margin:14px 0 22px}
.convo-list{background:var(--surface-2);border-right:1px solid var(--edge);overflow-y:auto;display:flex;flex-direction:column}
.convo-tabs{display:flex;position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--edge);z-index:1}
.convo-tab{flex:1;padding:10px 8px;background:none;border:0;color:var(--ink-3);font:650 12px inherit;cursor:pointer;
  transition:color var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.convo-tab .n{margin-left:4px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.convo-tab:hover{color:var(--ink-2)}
.convo-tab.on{color:var(--ink);background:var(--surface);box-shadow:inset 0 -2px 0 var(--acc)}
.convo-item{display:block;width:100%;text-align:left;padding:11px 14px;background:none;border:0;
  border-bottom:1px solid var(--edge-soft);cursor:pointer;color:var(--ink)}
.convo-item:hover{background:var(--edge-soft)}
.convo-item.on{background:var(--acc-soft)}
.convo-item-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.convo-item-time{color:var(--ink-3);font-size:11px;flex:none}
.convo-item-prev{color:var(--ink-3);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.convo-detail{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;min-width:0}
.convo-detail-head{font-weight:700;font-size:14.5px;margin-bottom:2px}
.convo-detail-sub{color:var(--ink-3);font-size:12px;margin-bottom:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.convo-msg{background:var(--surface-2);border-radius:var(--radius);padding:9px 12px;margin-bottom:8px;max-width:82%;
  white-space:pre-wrap;text-wrap:pretty;font-size:13px}
.convo-msg-asst{background:var(--acc-soft);margin-left:auto}
.convo-msg-role{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.convo-msg-meta{color:var(--ink-3);font-size:10.5px;margin-top:4px}
.review-watch{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;align-items:start}
.review-watch>div{min-width:0}
.watch-feedback textarea{display:block;margin-top:6px}
.review-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.review-summary .pcard{padding:10px 12px}
.review-summary .v{font-size:18px}
.review-toolbar{display:flex;gap:9px;align-items:end;flex-wrap:wrap;margin:12px 0 6px}
.review-toolbar label{display:grid;gap:4px;color:var(--ink-3);font-size:11px;font-weight:650}
.review-toolbar select{min-width:150px;text-align:left}
.review-shell{display:grid;grid-template-columns:minmax(280px,320px) minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
.review-list{position:sticky;top:14px;max-height:calc(100vh - 112px);overflow-y:auto;padding-right:3px;scrollbar-width:thin}
.review-list-item{display:block;width:100%;text-align:left;padding:11px 12px;margin-bottom:7px}
.review-list-item.on{background:var(--acc-soft);border-color:var(--acc-soft-edge)}
.review-list-title{font-weight:650;font-size:13px;overflow-wrap:anywhere}
.review-list-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--ink-3);font-size:10.5px}
.review-list-score{margin-left:auto;color:var(--acc);font-variant-numeric:tabular-nums;font-weight:700}
.review-source-warning{margin:8px 0 0}
@media (max-width:760px){
  .review-watch{grid-template-columns:1fr;gap:10px}
  .review-watch .artmedia{width:min(100%,180px,18svh);max-height:32svh}
  .review-summary{grid-template-columns:1fr 1fr}
  .review-shell{display:block}
  .review-list{position:static;max-height:none;padding-right:0}
  .review-toolbar label{flex:1 1 145px}
  .review-toolbar select{width:100%;min-width:0}
  .convo-shell{grid-template-columns:1fr;height:auto}
  .convo-list{border-right:0;border-bottom:1px solid var(--edge);max-height:240px}
  .convo-detail{max-height:420px}
}
/* Pipeline board (portal-journey-spec-2026-08-27, Slice 1) — 7-column
   read-only Kanban. Horizontal scroll lives INSIDE this container, never on
   the page body — the container is narrower than 7 columns by design (matches
   .brief's existing 880px rhythm every other screen uses; not a special case). */
.pipe-board{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 12px;margin:14px 0 22px}
.pipe-col{flex:0 0 250px;min-width:250px;display:flex;flex-direction:column;gap:8px}
.pipe-col-h{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;
  font-weight:650;display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.pipe-card{background:var(--surface);border:1px solid var(--edge);border-radius:var(--radius);
  padding:9px 11px;box-shadow:var(--shadow);font-size:12.5px}
.pipe-card-title{font-weight:650;font-size:13px}
.pipe-card-sub{color:var(--ink-2);font-size:11.5px;margin-top:3px}
.pipe-card-meta{color:var(--ink-3);font-size:10.5px;margin-top:4px}
.pipe-more{color:var(--ink-3);font-size:11px;padding:2px 4px}
.work-detail-grid{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:8px 14px;font-size:12.5px}
.work-detail-grid dt{color:var(--ink-3);font-weight:650}
.work-detail-grid dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.work-detail-grid .missing{color:var(--ink-3);font-style:italic}
@media (max-width:520px){.work-detail-grid{grid-template-columns:1fr;gap:3px 0}.work-detail-grid dd{margin-bottom:7px}}
#toast{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ok-soft);
  color:var(--ok);border:1px solid var(--ok-soft-edge);border-radius:var(--radius);padding:9px 18px;font-size:13px;
  z-index:var(--z-toast);box-shadow:var(--shadow)}
#toast.err{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft-edge)}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  nav{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;gap:2px;
    overflow-x:auto;padding:8px 16px 8px 10px;border-right:0;border-bottom:1px solid var(--edge);z-index:var(--z-sticky)}

// Optimistic fading is not proof work happened (old page, watchQueuedAction).
async function enqueueAction(action, params, onstate){
  const epoch=PORTAL_EPOCH;

  const r=await RWSession.authedFetch(SB+"/rest/v1/operator_action_queue",{method:"POST",

  // "an attempt already exists", which is not the same claim as "it was recorded", and only

  if(!r.ok){const err=new Error("enqueue "+r.status);err.status=r.status;throw err;}

  // state seconds before its authoritative receipt arrives.

// Keyboard: A approve / R request changes / X reject / J,K next-prev / Space play
// (plan §6) — every shortcut is a visible button too; a disabled button ignores
// .click() the same as a real click, so this never bypasses actionAllowed().
document.addEventListener("keydown", e=>{
  if(VIEW!=="review"&&VIEW!=="content_review")return;
  // S2 (security review #2, same class as the tickets room): a modifier combo
  // is a BROWSER/system chord, never a shortcut — Cmd+A (select-all) fired
  // Approve; Cmd+R (reload) would fire an action as the page tears down.
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  // r3 hygiene (same class as the tickets room): IME composition keystrokes
  // (isComposing / legacy "Process") are text entry, never shortcuts.
  if(e.isComposing||e.key==="Process")return;
  const tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(e.target&&e.target.isContentEditable))return;
  const byLabel=(re)=>[...document.querySelectorAll(".acts button.btn")].find(b=>re.test(b.textContent.trim()));
  // F2 (publish review): preventDefault whenever a shortcut key is consumed. R/X on an
  // empty note toast + ta.focus() INSIDE this keydown handler; without preventDefault the
  // same keystroke's character ("r"/"x") then lands in the now-focused textarea, and a
  // Reject/Request-changes click files that character as the note. A single-letter shortcut
  // from body focus has no legitimate text target here (we already returned on INPUT/TEXTAREA).
  if(e.key==="j"||e.key==="J"){e.preventDefault();const b=document.querySelector('button[data-cri-nav="next"]');if(b)b.click();}
  else if(e.key==="k"||e.key==="K"){e.preventDefault();const b=document.querySelector('button[data-cri-nav="prev"]');if(b)b.click();}
  else if(e.key==="a"||e.key==="A"){e.preventDefault();const b=byLabel(/^Approve$/);if(b&&!b.disabled)b.click();}
  else if(e.key==="r"||e.key==="R"){e.preventDefault();const b=byLabel(/^Request changes$/);if(b&&!b.disabled)b.click();}
  else if(e.key==="x"||e.key==="X"){e.preventDefault();const b=byLabel(/^Reject$/);if(b&&!b.disabled)b.click();}
  else if(e.key===" "){const v=document.querySelector(".artmedia video");if(v){e.preventDefault();v.paused?v.play():v.pause();}}
});

  if(!p.automations)return head()+`<div class="state state-error"><b>Automations directory FAILED to build this push</b>Unknown this push, not empty — every producer below is unverified until the next successful push.</div>`;
  const a=p.automations, src=a.sources||{};

  // real builder ever emits are null (registry read failed) or an array
  // (possibly empty), but treating any OTHER non-array as "keep going" would
  // let a future builder regression fall through to code that assumes an
  // array and throws inside the un-guarded 30s re-render timer.
  if(!Array.isArray(a.nodes))return head()+`<div class="state state-error"><b>Registry read FAILED</b>${esc(src.registry&&src.registry.error||"Unknown this push, not empty.")}</div>`;
  const nodes=a.nodes||[];
  if(!nodes.length)return head(0)+`<div class="empty">Registry has no rows this push.</div>`;
  const joinWarn=[
    src.findings_join&&src.findings_join.ok===false?"findings cross-reference unavailable this push":"",
    src.dormant_register_join&&src.dormant_register_join.ok===false?"DORMANT-REGISTER cross-reference unavailable this push":"",
  ].filter(Boolean);

  // district:"__proto__" would otherwise resolve byDistrict["__proto__"] to
  // Object.prototype itself, and .push on it throws -- reachable only via a
  // hostile/corrupted registry file, but a one-line fix either way.
  const byDistrict=Object.create(null);
  nodes.forEach(n=>{const d=n.district||"unmapped";(byDistrict[d]=byDistrict[d]||[]).push(n)});
  const districts=Object.keys(byDistrict).sort((x,y)=>byDistrict[y].length-byDistrict[x].length);
  const CAP=8;

    <div class="q" style="font-size:13px">${esc(n.name||n.id||"?")}

      ${n.trigger_kind?`<span class="badge badge-neutral">${esc(n.trigger_kind)}${n.schedule_label?" "+esc(n.schedule_label):""}</span>`:""}
      ${n.orphaned?`<span class="badge badge-warn">ORPHANED</span>`:""}
    </div>
    ${n.what?`<div class="why">${esc(n.what)}</div>`:""}
    <div class="why" style="opacity:.7;font-size:11.5px">${
      n.downstream&&n.downstream.length?"→ "+n.downstream.map(esc).join(", "):"consumer unknown"
    }${n.path?" · "+esc(n.path):""}</div>
    ${n.findings&&n.findings.length?`<div class="why" style="color:var(--warn)">${n.findings.map(f=>esc((f.severity||"?")+": "+(f.description||f.source||""))).join(" · ")}</div>`:""}
    ${n.dormant_note?`<div class="why" style="opacity:.7">${esc(n.dormant_note)}</div>`:""}
  </div>`;
  return head(esc(nodes.length+" producers"+(a.orphaned_count?", "+a.orphaned_count+" orphaned":"")))
    +(joinWarn.length?`<div class="empty" style="font-size:11px">${esc(joinWarn.join(" · "))}</div>`:"")
    +districts.map(d=>{
      const rows=byDistrict[d].slice().sort((x,y)=>
        (_AUTOMATIONS_STATUS_ORDER[x.status]??9)-(_AUTOMATIONS_STATUS_ORDER[y.status]??9));
      const shown=rows.slice(0,CAP);
      return `<div style="margin-top:14px">
        <div style="font-size:12px;font-weight:650;color:var(--ink-2);margin-bottom:6px">${esc(d)} <span style="color:var(--ink-3);font-weight:400">· ${rows.length}</span></div>
        ${shown.map(row).join("")}
        ${rows.length>CAP?`<div class="pipe-more">+${rows.length-CAP} more in ${esc(d)}</div>`:""}
      </div>`;
    }).join("");

function viewMachine(p, updatedAt){

// Interruption recovery. WR_LOGGED is a session cache; the RECORD is the audited action
// queue. On entering the room we ask it which prospects of this block already have a
// worker-confirmed outreach.log_call, so a reload, a crash or a different tab resumes at
// the right prospect instead of offering someone we already called. A read failure leaves
// WR_RESUME null and the room says the resume state is unknown rather than pretending the
// block is fresh.
let WR_RESUME = undefined;          // undefined = not asked · null = read failed · Set = known
async function loadWarRoomReceipts(blockId){
  const epoch=WR_EPOCH;
  const read=++WR_READ_REV;
  if(DEV){WR_RESUME=new Set();return}
  try{
    const done=new Set();
    const pending=new Map();
    for(let offset=0;offset<4000;offset+=200){
      const rows=await rest("operator_action_queue?select=id,action,status,params,created_at"
        +"&action=eq.outreach.log_call&params->>block_id=eq."+encodeURIComponent(String(blockId))
        +"&order=id.desc&limit=200&offset="+offset);
      if(epoch!==WR_EPOCH||read!==WR_READ_REV)return;
      if(!Array.isArray(rows))throw new Error("receipt read unavailable");
      for(const r of rows){
        const q=r&&r.params||{};
        if(String(q.block_id||"")!==String(blockId)||!q.prospect_id)continue;
        const id=String(q.prospect_id);
        if(r.status==="done")done.add(id);
        else pending.set(id,r.status==="failed"?"failed — review before retry":"queued or processing — awaiting receipt");
      }
      if(rows.length<200){
        WR_RESUME=done;
        pending.forEach((state,id)=>WR_PENDING.set(id,state));
        // Only a CONFIRMED done clears a pending hold. An empty read is evidence of
        // nothing, so an uncertain pending (a 409, a submission with no receipt) survives
        // it - clearing on absence is exactly how a second submission gets offered.
        done.forEach(id=>WR_PENDING.delete(id));
        return;
      }
    }
    throw new Error("receipt history exceeds safe read bound");
  }catch(_){ if(epoch===WR_EPOCH&&read===WR_READ_REV)WR_RESUME=null; }
}

// ── War room (founder_call_room.v1) ───────────────────────────────────────────
// The five-call validation block, rendered from the SERVER-COMPUTED read model.

//      phone-source, evidence-freshness, script and calendar gates. This page never
//      recomputes it and never ORs its way past it — an operator checkbox can satisfy
//      "human source review", it cannot satisfy "DNC clearance".
//   2. NO SECOND LEDGER. Nothing here is the record. A rehearsal writes NOTHING; a live
//      log goes through the existing audited outreach.log_call action and the card only
//      advances after the worker returns done.
let WR_IDX = 0;                    // cursor within the block — client-side only

let WR_REHEARSAL = true;           // starts in rehearsal: no production write until turned off

const WR_CONV = new Map();         // id -> bool  (was there a real conversation)

let WR_ENERGY = "";                // energy after the block, 1-5

const WR_PENDING = new Map();

function resetWarRoom(blockId=null){

  WR_ACT="";WR_ENERGY="";WR_RECEIPT=null;WR_RESUME=undefined;

function wrRows(room){

const WR_DISPOSITIONS = [

function wrLocalNow(){
  // Prospect-local time. Every prospect in this block is Lower Mainland, so the block's
  // own tz is the prospect's; when that stops being true this must read per prospect.
  try{ return new Date(new Date().toLocaleString("en-US",{timeZone:"America/Vancouver"})); }
  catch(_){ return null; }   // unknown local time is NOT a compliant window

function wrWindowOpen(room){
  const w=(room&&room.window_local)||{}; const now=wrLocalNow();
  if(!now||!w.start||!w.end)return {open:false,why:"local time or window unknown"};
  // No inferred schedule: missing/malformed days cannot authorize a call.
  const days=w.days;
  if(!Array.isArray(days)||!days.length||days.some(d=>!Number.isInteger(d)||d<0||d>6))
    return {open:false,why:"block calling days unknown or invalid"};
  const dow=now.getDay()===0?6:now.getDay()-1;          // 0=Mon
  if(!days.includes(dow))return {open:false,why:"outside the block's weekday window"};
  const [sh,sm]=String(w.start).split(":").map(Number), [eh,em]=String(w.end).split(":").map(Number);
  const mins=now.getHours()*60+now.getMinutes();
  const ok=mins>=(sh*60+sm)&&mins<=(eh*60+em);
  return {open:ok, why:ok?"":`outside ${w.start}–${w.end} ${w.tz||""} (now ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")})`};

function viewWarRoom(p){

  if(!room)return head+`<div class="empty">No call block in this snapshot — none is configured, or the snapshot predates this panel.</div>`;

  const idFault=wrIdentityFault(room,q);
  const pending=WR_PENDING.get(String(q.id));
  const liveHeld=!!pending||!(WR_RESUME instanceof Set);
  const canCall=gatesOk&&!idFault&&acked&&win.open&&!WR_REHEARSAL&&!liveHeld;

  const dots=`<div class="decide-dots">${rows.map((x,i)=>`<span class="dot ${i===WR_IDX?"current":""}" title="${escAttr(x.name)}"></span>`).join("")}</div>`;
  const idNote=idFault?`<div class="state state-error" data-wr-identity-fault style="margin:10px 0"><b>Identity not verifiable</b>${esc(idFault)} - this row cannot be called or logged from here.</div>`:"";
  const holds=(q.holds||[]).length?`<div class="state state-error" style="margin:10px 0"><b>HOLD — not callable</b>
      <ul style="margin:6px 0 0 16px;padding:0">${q.holds.map(h=>`<li>${esc(wrHoldLabel(h))}</li>`).join("")}</ul>
      ${q.blocked?`<div style="margin-top:6px"><b>This one is blocked outright and cannot be acknowledged.</b></div>`:""}</div>`:"";

  const opener=(q.openers||{})[WR_MODE]||"";
  return head+banner+resumeNote+receipt+`<div class="wr-shell" data-war-room><div class="wr-cols">
    <div class="wr-col">
    <div class="decide-top"><div style="font-size:13px;font-weight:750">${esc(q.name)} · ${esc(q.city)}</div>
      <div class="decide-progress"><b>${WR_IDX+1}</b>/${rows.length}</div>${dots}</div>

    <div style="padding:12px 0;border-top:1px solid var(--edge-soft)">
      <div style="font-size:12px;color:var(--ink-3)">Why this one, specifically</div>
      <div style="font-weight:650;margin-top:3px">${esc(q.reason_to_call)}</div>
      <div style="font-size:11.5px;color:var(--ink-3);margin-top:6px">Source: ${esc(q.source)} · captured ${esc(q.captured)}${q.evidence_age_days!=null?` (${esc(q.evidence_age_days)}d old)`:""} · ${esc(q.phone)}</div>
    </div>

    ${idNote}${holds}

    <div style="padding:10px 0;border-top:1px solid var(--edge-soft)">
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:12.5px">
        <input type="checkbox" data-wr-ack ${acked?"checked":""}>
        <span>I have read the source above and the do-not-contact state, and I am the human accountable for this call.</span>
      </label>
    </div>

    </div>

    <div class="wr-col wr-live">
    <div class="voice-tabs" style="display:flex;gap:8px;align-items:center;padding:10px 0">
      <span style="font-size:12px;color:var(--ink-3)">Pick the version that sounds like you</span>
      <button class="nav-btn ${WR_MODE==="curious"?"badge-ok":""}" data-wr-voice="curious">Curious</button>
      <button class="nav-btn ${WR_MODE==="direct"?"badge-ok":""}" data-wr-voice="direct">Direct</button>
    </div>

    <div style="padding:10px 0;border-top:1px solid var(--edge-soft)">
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-bottom:6px">
        <span><b>1 · Notice</b> one real thing</span><span><b>2 · Ask</b> ${esc(q.follow||"")}</span>
        <span><b>3 · Listen</b> stop talking</span><span><b>4 · Offer</b> ${esc(q.safe||"")}</span>
      </div>
      <div style="white-space:pre-wrap;font-size:13.5px;line-height:1.5">${esc(opener)}</div>
      <div style="font-size:11px;color:var(--ink-3);margin-top:6px">Loose read — do not perform it. Let the last question sound like a question.</div>
      <div data-wr-branches style="margin-top:10px;display:grid;gap:4px">
        <details><summary style="cursor:pointer;font-size:12.5px;font-weight:650">If they answer the opening question</summary><p style="margin:6px 0 4px;font-size:12.5px;line-height:1.5">${esc(q.safe||"")} Then ask: “${esc(q.follow||"")}” Do not explain Rankwise until they answer.</p></details>
        <details><summary style="cursor:pointer;font-size:12.5px;font-weight:650">If they ask “So what do you want?”</summary><p style="margin:6px 0 4px;font-size:12.5px;line-height:1.5">“Fair question. I help local trades manage what homeowners see on Google. I noticed this one thing and wanted to see whether it mattered to you before pitching anything.”</p></details>
        <details><summary style="cursor:pointer;font-size:12.5px;font-weight:650">If there is a real problem</summary><p style="margin:6px 0 4px;font-size:12.5px;line-height:1.5">Reflect one phrase they used. Then: “That is the kind of visibility layer I manage. If I pulled up the exact Google view and the two highest-impact fixes, would a fifteen-minute look be useful?”</p></details>
        <details><summary style="cursor:pointer;font-size:12.5px;font-weight:650">If they say “Not interested”</summary><p style="margin:6px 0 4px;font-size:12.5px;line-height:1.5">“All good — thanks for being straight with me.” Stop. Do not rescue the pitch. Log <b>Not interested</b> and their words if they gave a reason.</p></details>
      </div>
      ${q.dont?`<div style="font-size:11.5px;color:var(--ink-3);margin-top:8px"><b>Don't:</b> ${esc(q.dont)}</div>`:""}
    </div>

    <div style="padding:10px 0;border-top:1px solid var(--edge-soft);display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      ${canCall?`<a class="nav-btn" href="tel:${escAttr(q.phone_digits)}" data-wr-tel>Call ${esc(q.phone)}</a>`
               :`<button class="nav-btn" disabled title="${escAttr(idFault?"identity not verifiable: "+idFault:!gatesOk?"gates not cleared":!acked?"acknowledge the source and DNC state first":!win.open?win.why:"rehearsal — no calls")}">Call disabled</button>`}
      <label style="font-size:12.5px"><input type="checkbox" data-wr-held ${WR_HELD.get(String(q.id))?"checked":""}> They stayed past the opener</label>
      <label style="font-size:12.5px"><input type="checkbox" data-wr-conv ${WR_CONV.get(String(q.id))?"checked":""}> Real conversation happened</label>
    </div>

    <div style="padding:10px 0;border-top:1px solid var(--edge-soft)">
      <div style="font-size:12px;color:var(--ink-3);margin-bottom:6px">Outcome</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${WR_DISPOSITIONS.map(([v,l])=>`<button class="nav-btn" data-wr-disp="${escAttr(v)}" ${!WR_REHEARSAL&&(liveHeld||idFault||!gatesOk)?"disabled":""}>${esc(l)}</button>`).join("")}
      </div>
      ${!WR_REHEARSAL&&!gatesOk?`<p data-wr-outcome-held>Call outcomes are held with this prospect. A callback, late opt-out, or external call needs supervised reconciliation; do not invent a phone touch here.</p>`:""}
      ${!WR_REHEARSAL&&liveHeld?`<p data-wr-pending>Call log held: ${esc(pending||"resume state unknown — refresh receipts before recording")}. No second submission.</p>`:""}
      <textarea id="wr-note" maxlength="280" placeholder="What actually happened, in your words (one line, 280 characters)" style="width:100%;margin-top:8px;min-height:56px">${esc(WR_NOTES.get(String(q.id))||"")}</textarea>
    </div>

    <div class="decide-nav" style="display:flex;gap:8px;padding-top:10px">
      <button class="nav-btn" data-wr-nav="prev">← Previous</button>
      <button class="nav-btn" data-wr-nav="next">Skip →</button>
    </div>
    </div>
  </div></div><div class="wr-shell">${wrDebrief()}</div>`;
}

function wrDebrief(){
  return `<div class="state" style="margin-top:14px"><b>Block measurements</b>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12.5px">
      <label>Activation before <input id="wr-act" type="number" min="1" max="5" value="${escAttr(WR_ACT)}" style="width:56px"></label>
      <label>Energy after <input id="wr-energy" type="number" min="1" max="5" value="${escAttr(WR_ENERGY)}" style="width:56px"></label>
    </div></div>`;
}

function wireWarRoom(p,updatedAt,srcNote){
  const room=p.founder_call_room; if(!room)return;
  const epoch=WR_EPOCH;
  const re=()=>{if(epoch===WR_EPOCH&&LAST.p&&VIEW==="war_room")render(LAST.p,LAST.updatedAt,LAST.srcNote);};
  if(WR_RESUME===undefined){                       // once per session, then render again
    WR_RESUME=null;                                // provisional: unknown until the read lands
    loadWarRoomReceipts(room.block_id).then(re);
  }
  const rows=wrRows(room);
  const q=rows[WR_IDX];
  const noteInput=$("#wr-note");
  if(noteInput&&q)noteInput.oninput=()=>WR_NOTES.set(String(q.id),noteInput.value);
  const refresh=document.querySelector("[data-wr-reconcile]");
  if(refresh)refresh.onclick=()=>{WR_RESUME=null;loadWarRoomReceipts(room.block_id).then(re);re();};
  const act=$("#wr-act"),en=$("#wr-energy");
  if(act)act.onchange=()=>{WR_ACT=act.value;};
  if(en)en.onchange=()=>{WR_ENERGY=en.value;};
  document.querySelectorAll("[data-wr-voice]").forEach(b=>b.onclick=()=>{WR_MODE=b.dataset.wrVoice;re();});
  const ack=document.querySelector("[data-wr-ack]");
  if(ack&&q)ack.onchange=()=>{ack.checked?WR_ACK.add(String(q.id)):WR_ACK.delete(String(q.id));re();};
  // The tel anchor only RENDERS when canCall is true, but the handler refuses independently:
  // a tampered DOM, a stale render or a forged callable=true must not produce a live dial.
  const tel=document.querySelector("[data-wr-tel]");
  if(tel)tel.onclick=e=>{
    if(epoch===WR_EPOCH&&q&&!WR_REHEARSAL&&q.callable===true&&!wrIdentityFault(room,q)
      &&WR_ACK.has(String(q.id))&&wrWindowOpen(room).open
      &&WR_RESUME instanceof Set&&!WR_RESUME.has(String(q.id))
      &&!WR_PENDING.has(String(q.id))&&!WR_LOGGED.has(String(q.id)))return;
    e.preventDefault();
    toast("Not callable from here - identity or gates are not cleared.","err");
  };
  const held=document.querySelector("[data-wr-held]");
  if(held&&q)held.onchange=()=>WR_HELD.set(String(q.id),held.checked);
  const conv=document.querySelector("[data-wr-conv]");
  if(conv&&q)conv.onchange=()=>WR_CONV.set(String(q.id),conv.checked);
  const tog=document.querySelector("[data-wr-mode-toggle]");
  if(tog)tog.onclick=()=>{
    if(WR_REHEARSAL&&!confirm("Leave rehearsal? A live block writes real dispositions through the audited call log."))return;
    WR_REHEARSAL=!WR_REHEARSAL;WR_IDX=0;WR_CURRENT=null;WR_RECEIPT=null;
    [WR_PRACTICED,WR_ACK,WR_HELD,WR_CONV,WR_NOTES].forEach(x=>x.clear());re();
  };
  document.querySelectorAll("[data-wr-nav]").forEach(b=>b.onclick=()=>{
    WR_IDX=b.dataset.wrNav==="prev"?Math.max(0,WR_IDX-1):Math.min(rows.length-1,WR_IDX+1);
    WR_CURRENT=rows[WR_IDX]?String(rows[WR_IDX].id):null;re();
  });
  document.querySelectorAll("[data-wr-disp]").forEach(b=>b.onclick=async()=>{
    if(!q||epoch!==WR_EPOCH)return;
    const disposition=b.dataset.wrDisp;
    const note=($("#wr-note")&&$("#wr-note").value)||"";
    if(WR_REHEARSAL){
      // Rehearsal writes NOTHING. It advances so the operator can walk the whole block,
      // and says so, because a rehearsal that silently behaved like a live block would be
      // the worst possible version of this screen.
      WR_RECEIPT={id:q.id,label:`${q.name} — ${disposition} (rehearsal, not recorded)`,rehearsal:true};
      WR_PRACTICED.add(String(q.id));WR_IDX=0;re();return;
    }
    // Identity is the FIRST live check, independent of the button's disabled state: a
    // forged callable=true, a duplicated prospect id or a missing block id must not reach
    // the queue, and the operator is told which one it was rather than seeing a no-op.
    const fault=wrIdentityFault(room,q);
    if(fault){toast("Identity not verifiable ("+fault+") - nothing was recorded.","err");return;}
    // Every canonical disposition writes a PHONE touch, including opt-out/wrong-number.
    // Do not use those as a bypass for a held prospect. Window expiry is different:
    // a cleared prospect's completed call may still need its legitimate late outcome.
    if(q.callable!==true){toast("Prospect held or blocked - no call outcome recorded from this room.","err");return;}
    if(WR_PENDING.has(String(q.id))||WR_LOGGED.has(String(q.id))||!(WR_RESUME instanceof Set)||WR_RESUME.has(String(q.id)))return;
    if(note.length>280||/[\x00-\x1f\x7f]/.test(note)){toast("Use a single-line note of at most 280 characters; your draft is retained.","err");return;}
    const canon=WR_CANON[disposition];
    if(!canon){toast("Outcome '"+disposition+"' has no canonical call-log disposition — not recorded","err");return;}
    if(["do_not_contact","booked","declined","wrong_number"].includes(canon)&&!confirm("Confirm "+canon+" for "+q.name+"? This changes the prospect sequence."))return;
    WR_PENDING.set(String(q.id),"submitting — receipt not yet confirmed");
    document.querySelectorAll("[data-wr-disp]").forEach(x=>x.disabled=true);
    try{
      await enqueueAction("outreach.log_call",{
        prospect:q.name,                      // the registry resolves by business name
        disposition:canon, outcome_detail:disposition, notes:note,
        prospect_id:q.id, block_id:room.block_id, phone:q.phone, voice_mode:WR_MODE,
        opener_held:!!WR_HELD.get(String(q.id)), conversation:!!WR_CONV.get(String(q.id)),
        activation_before:WR_ACT||null, energy_after:WR_ENERGY||null,
        idempotency_key:`${room.block_id}:${q.id}:${disposition}`,
      },(st,detail)=>{
        if(epoch!==WR_EPOCH)return;
        if(st==="done"){
          // The card advances ONLY here — after the worker confirmed the canonical write.
          WR_LOGGED.add(String(q.id));
          WR_PENDING.delete(String(q.id));
          WR_RECEIPT={id:q.id,label:`${q.name} — ${disposition}`};
          WR_IDX=0;re();
        }else if(st==="failed"){
          WR_PENDING.set(String(q.id),"failed — review the canonical log before retry");
          toast("Call-log worker failed. Partial effects are possible; review before retrying.","err");
          re();
        }else if(st==="still-queued"){
          WR_PENDING.set(String(q.id),"queued — awaiting worker confirmation");
          toast("Call log still queued — the card stays put until the worker confirms","err");re();
        }
      });
    }catch(e){
      if(epoch!==WR_EPOCH)return;
      // 409 = the queue's uniqueness index refused a SECOND row for this attempt. That is
      // proof an attempt EXISTS, not proof the call was recorded, so the row holds for
      // reconciliation instead of claiming a receipt this page never saw. Anything else
      // stays an unknown submission. Neither state is cleared by an empty receipt read.
      const conflict=!!(e&&e.status===409);
      WR_PENDING.set(String(q.id),conflict
        ?"existing attempt detected — refresh/reconcile receipts"
        :"submission unknown — reconcile before retry");
      toast(conflict
        ?"An attempt for this prospect already exists — refresh call receipts and reconcile before retrying."
        :"Call-log submission not confirmed; refresh receipts before another attempt.","err");re();
    }
  });
}

function viewTickets(p){
  // This is a DECISION stack, not an executor-status archive. An approved row
  // no longer needs the operator's word, and a decision confirmed during this
  // tab session must leave immediately even before the cached snapshot refreshes.
  const rows=Array.isArray(p.tickets)
    ?p.tickets.filter(t=>!t.approved&&!TIX_RESOLVED.has(String(t.id)))
    :null;
  const total=p.tickets_ranked_total;
  const receipt=TIX_RECEIPT?`<div class="state" data-ticket-receipt style="margin:12px 0;background:var(--ok-soft);border-color:var(--ok-soft-edge);color:var(--ok)"><b>${esc(TIX_RECEIPT.label)}</b> — ${esc(TIX_RECEIPT.id)} · verified by the action worker</div>`:"";
  const exec=ticketExecutionStatus(p);
  // Built BEFORE `head` and concatenated INTO it, never appended after. v3 wrote
  // `head+=` against a `const`, which throws "Assignment to constant variable" on every
  // degraded payload — so the panel rendered nothing at all in exactly the state the
  // banner exists to explain, which is strictly worse than the silence it was fixing.
  // Folded in so EVERY return path below carries it: with rows, without rows, and on the
  // no-decisions path. Gating it on rows===null suppressed it exactly when the panel was
  // showing partial results (PR #121 v2).
  const degraded=p.tickets_degraded?`<div class="state state-error"><b>Ticket panel DEGRADED</b>This list may be incomplete — it is not a clean empty queue. Cause: ${esc(String(p.tickets_degraded))}</div>`:"";
  const head=`<div class="status sub">Tickets<small style="margin-left:auto;font-size:12px;color:var(--ink-3)">${rows&&total?`showing ${rows.length} awaiting decision · ${esc(String(total))} ranked total`:"night-shift backlog, value-ranked"}</small></div>${receipt}${exec}${degraded}`;
  if(rows===null)return head+`<div class="empty">No tickets in this snapshot — the triage queue is empty, or the snapshot predates the tickets projection. Absent is not zero.</div>`;
  if(!rows.length)return head+`<div class="empty">No tickets are waiting for your decision.</div>`;
  if(TIX_IDX>rows.length)TIX_IDX=rows.length;
  if(TIX_IDX<0)TIX_IDX=0;
  const needWord=rows.filter(t=>t.status==="open").length;
  const top=`<div class="decide-top"><div style="font-size:13px;font-weight:750">Overnight tickets</div>
      <div class="decide-progress"><b>${Math.min(TIX_IDX+1,rows.length)}</b>/${rows.length}${needWord<rows.length?` · ${needWord} need your call`:""}</div></div>
    <div class="decide-dots">${rows.map((x,i)=>`<span class="dot ${i===TIX_IDX?"current":TIX_SKIPPED.has(x.id)?"skipped":""}"></span>`).join("")}</div>`;
  if(TIX_IDX>=rows.length){
    return head+`<div class="decide-shell" data-tickets-room>${top}
      <div class="empty" style="text-align:center;padding:32px 0">End of the stack — ${TIX_SKIPPED.size
        ?`${TIX_SKIPPED.size} skipped (still open — skipping writes nothing)`:"all seen"}.</div>
      <div class="decide-nav" style="justify-content:center"><button class="nav-btn" data-tix-nav="restart">↺ Start over</button></div>
    </div>`;
  }
  return head+`<div class="decide-shell" data-tickets-room>${top}${ticketCard(rows[TIX_IDX])}</div>`;
}
function ticketExecutionStatus(p){
  // Approval is a persisted boolean decision, not truthiness. Malformed
  // projection values must never look like operator authorization.
  const approved=Array.isArray(p.tickets)?p.tickets.filter(t=>t.approved===true):null;
  if(approved===null)return "";
  const cards=approved.map(t=>{
    const known=t.executorEligible===true||t.executorEligible===false;
    const cls=t.executorEligible===true?"badge-ok":t.executorEligible===false?"badge-bad":"badge-neutral";
    const label=t.executorEligible===true?"eligible":t.executorEligible===false?"blocked":"eligibility unknown";
    const why=t.executorReason||(
      known?"executor verdict unavailable":
      "eligibility evidence unavailable this push; approval does not mean scheduled");
    const next= t.executorEligible===false
      ? "No re-approval needed for the same scope — resolve the named execution gate; ask the operator again only if scope or safety changes."
      : t.executorEligible===true
        ? "Eligible does not mean running — the separate nightly runtime gates still apply."
        : "Do not treat this as ready — eligibility evidence unavailable this push.";
    return `<div data-ticket-execution-row style="padding:10px 0;border-top:1px solid var(--edge-soft)">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b>${esc(t.title||t.id)}</b><span class="badge badge-info">approval recorded</span></div>
      <div style="font-size:11.5px;color:var(--ink-2);margin-top:5px"><b>Execution readiness:</b> <span class="badge ${cls}">${esc(label)}</span></div>
      <div style="font-size:11.5px;color:var(--ink-3);margin-top:4px">#${esc(t.id)} · target tier ${esc(t.targetTier||"unknown")} · ${esc(why)}</div>
      <div style="font-size:11.5px;color:var(--ink-2);margin-top:5px">${esc(next)}</div></div>`;
  }).join("");
  return `<div class="log" data-ticket-execution-status style="margin:12px 0"><b>Approval recorded / execution readiness</b><br>
    <small>Approval is authorization, not proof of execution. Eligibility below is the deterministic Tier-A wall; actual execution still depends on the nightly runtime gates.</small>
    ${cards||`<div class="empty">No approved tickets in this ranked snapshot.</div>`}</div>`;
}

// ── WORK / AGENTS room — read-only projection of the canonical work spine ───
// Router submissions enter intake for supervised review, never direct execution.
// Draft stays in memory only. A failed/uncertain request retains its packet/key.
const ROUTER_DRAFT={text:"",packet:null,pending:false,rejected:false,message:"",epoch:0};
function _routerPacket(text,key){
  const objective=String(text).trim();
  if(!objective||Array.from(objective).length>4000||/[\u0000-\u0008\u000b-\u001f]/u.test(objective)||!objective.isWellFormed())
    throw new Error("Enter 1–4,000 characters without control characters. Do not paste credentials.");
  return {schema:"rankwise.router-task.v1",idempotency_key:key,producer:"operator_portal",
    source_ref:"portal2-work",task_type:"freeform",task_class:"interactive",execution_mode:"ai",
    title:"Operator prompt: "+Array.from(objective.replace(/\s+/g," ")).slice(0,160).join(""),
    objective,consumer:"operator",acceptance_test:"Return evidence, a result, next action, and blockers.",
    priority:70,estimated_minutes:30,privacy_class:"operator_private",safety_class:"internal",
    requires_operator:true,allowed_seats:["A","B"],allowed_providers:["claude"],minimum_quality:"standard",
    max_cost_usd:0,context_refs:[],dependencies:[],required_capabilities:[],required_tools:[],
    required_skills:[],required_connectors:[],worker_preference:"auto",
    review_independence:"standard",client_impact:0,revenue_impact:0,outage_impact:0,
    created_at:new Date().toISOString()};
}
function _routerForm(){
  const blocked=DEV||ROUTER_READY!==true;
  return `<div class="log" data-router-intake style="margin:12px 0"><b>Start supervised work</b>
    <p>Describe the result you need. This records a task for supervisor compilation; it does not start Claude, provide a chat reply, spend money, or authorize a send. New requests prefer a fresh isolated worker. Historical parent-session requests remain preserved and are never resumed by this form. No credentials. Drafts last only while this page is open.</p>
    <textarea id="router-prompt" aria-label="Task for the team" rows="3" style="width:100%;box-sizing:border-box" ${ROUTER_DRAFT.pending?"disabled":""} ${ROUTER_DRAFT.packet&&!ROUTER_DRAFT.rejected?"readonly":""}>${esc(ROUTER_DRAFT.text)}</textarea>
    <button class="btn rec" id="router-submit" ${blocked||ROUTER_DRAFT.pending?"disabled":""}>${ROUTER_DRAFT.pending?"Recording…":"Queue for review"}</button>
    <p data-router-status role="status">${esc(ROUTER_DRAFT.message||(DEV?"Preview only — no task will be sent.":blocked?"Router intake unavailable — migration or authenticated schema read needs verification. Your draft is not queued.":"Intake columns available; the RPC is verified on submission. Execution remains supervised; only a valid receipt confirms queueing."))}</p></div>`;
}
function wireRouterForm(){
  const input=$("#router-prompt"),button=$("#router-submit");
  if(!input||!button)return;
  input.oninput=()=>{
    // An uncertain request might already exist remotely. Editing must not mint a
    // fresh identity behind the promised retry. Copy the draft if it needs review.
    if(ROUTER_DRAFT.packet&&!ROUTER_DRAFT.rejected){input.value=ROUTER_DRAFT.text;return;}
    ROUTER_DRAFT.text=input.value;ROUTER_DRAFT.packet=null;ROUTER_DRAFT.rejected=false;ROUTER_DRAFT.message="";

// Keyboard: A approve / R kill(reject) / V revise — every shortcut is a visible
// button; a disabled button ignores .click(), so this never bypasses
// actionAllowed() (same contract as the content-review A/R/X handler above).
document.addEventListener("keydown", e=>{
  if(VIEW!=="tickets")return;
  // S2 (security review #2, HIGH): Cmd+R (browser reload) fired Kill —
  // ticket.reject on the visible ticket, terminal, no confirm — and Cmd+A
  // (select-all) fired Approve. A modifier combo is never a shortcut.
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  // r3 hygiene: IME composition keystrokes (isComposing, or the legacy
  // "Process" key some layouts report) are text entry, never shortcuts.
  if(e.isComposing||e.key==="Process")return;
  const tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  const byLabel=(re)=>[...document.querySelectorAll(".decide-opts button.btn")].find(b=>re.test(b.textContent.trim()));

  // note toasts + ta.focus() inside this handler, and without this the "v" character then
  // types into the now-focused textarea and a Revise click files "v" as the revise note.
  if(e.key==="a"||e.key==="A"){e.preventDefault();const b=byLabel(/^Approve$/);if(b&&!b.disabled)b.click();}

  else if(e.key==="v"||e.key==="V"){e.preventDefault();const b=byLabel(/^Revise$/);if(b&&!b.disabled)b.click();}
});

// provider→district assignment below is still a MAINTAINED GUESS, not a
// derivation (no structural link connects "Anthropic Max seat" to one ctOS
// node the way a cron job links to its district). Rendered with an explicit
// "approximate" label for exactly that reason — same honesty convention as

const LANE_LABELS={intake:"Data Intake",content:"Content Factory",outreach:"Outreach / Revenue",
  portal:"Portal / Cloud",infra:"Infra / Guards","cross-cutting":"Cross-cutting (build/interactive)",
  unmapped:"Unmapped"};
const LANE_MAP=[  // [needle (case-insensitive substring), lane] — first match wins
  ["serpapi","intake"],["dataforseo","intake"],["perplexity","intake"],
  ["elevenlabs","content"],
  ["cal.com","outreach"],["twilio","outreach"],
  ["supabase","portal"],
  ["cloudflare r2","infra"],["google cloud platform","infra"],["google workspace","infra"],
  ["squarespace","infra"],["healthchecks","infra"],["codex-bridge","infra"],
  ["anthropic max","cross-cutting"],["anthropic api","cross-cutting"],
  ["chatgpt plus","cross-cutting"],["anthropic","cross-cutting"],

// ctOS pulse is its own truth contract. Findings are one input elsewhere in the
// portal, but zero findings must never be translated into "all systems green".
// Missing/malformed summary data fails closed to UNKNOWN.
const _CTOS_STATES=new Set(["healthy","attention","degraded","critical","stopped","unknown"]);
const _CTOS_SCHEMA="ctos.summary.v1";
const _CTOS_STALE_HOURS=8;
// Per-state fallback text (F9e): a state with an empty reason used to render
// "healthy · ctOS status unavailable", which reads as a contradiction.
const _CTOS_FALLBACK_REASON={
  healthy:"all required ctOS checks passed",
  attention:"ctOS reported no reason for this state",
  degraded:"ctOS reported no reason for this state",
  critical:"ctOS reported no reason for this state",
  stopped:"full-stop kill switch is engaged",
  unknown:"ctOS status unavailable",
};
// F2 (MED, security review 2026-09-03). The snapshot is the ONLY clock the mast
// had, and under the global kill switch both of its producers halt: the scanner
// wrapper skips on the .brain_disarmed sentinel, and the pusher's _preflight.sh
// full-stop gate halts it too. So the last pre-stop "healthy" froze in the mast
// indefinitely and the operator saw green on a stopped system. The page now
// re-checks the scan's own timestamp against the browser clock every render.
// DOWNGRADE ONLY: this can send any state to unknown and can never produce
// healthy, so a wrong browser clock costs honesty in the safe direction. The 8h
// threshold and the "stale beats everything, including the kill switch" order
// mirror the builder's precedence exactly.
function _ctosScanAgeHours(value){
  if(typeof value!=="string")return null;
  // Require an explicit UTC offset. Date.parse() reads an offset-less date-time
  // as LOCAL time, which would silently disagree with the builder's UTC reading
  // by the viewer's timezone; unreadable is the honest answer.
  if(!/(?:[zZ]|[+-]\d{2}:?\d{2})$/.test(value.trim()))return null;
  const t=Date.parse(value);
  if(!Number.isFinite(t))return null;
  return (Date.now()-t)/3600000;
}
function ctosPulse(p){
  const raw=p&&p.ctos_summary;
  if(!raw||typeof raw!=="object"||!_CTOS_STATES.has(raw.state)
     ||raw.schema_version!==_CTOS_SCHEMA){
    return {state:"unknown",reason:_CTOS_FALLBACK_REASON.unknown,top_exceptions:[]};
  }
  let state=raw.state;
  let reason=String(raw.reason||_CTOS_FALLBACK_REASON[state]||_CTOS_FALLBACK_REASON.unknown);
  if(state!=="unknown"){
    const ageH=_ctosScanAgeHours(raw.scan_observed_at);
    if(ageH===null){
      state="unknown";
      reason="scan timestamp is missing or unreadable in this snapshot";
    }else if(ageH>_CTOS_STALE_HOURS){
      state="unknown";
      reason=`scan is ${ageH.toFixed(1)}h old (snapshot frozen?)`;
    }
  }
  return {
    state:state,
    reason:reason,
    top_exceptions:Array.isArray(raw.top_exceptions)?raw.top_exceptions:[],
  };
}

  if(state==="healthy")return "var(--ok)";
  if(state==="critical")return "var(--bad)";
  if(state==="stopped")return "var(--info)";
  if(state==="attention"||state==="degraded")return "var(--warn)";
  return "var(--ink-3)";
}
function ctosPulseText(p){

// one-click buttons; a form-only action's safety story is the dedicated form

function _revValidate(v){

  if(!v.collected||!isFinite(collected)||collected<=0)return "Collected must be a positive number.";

    if(!isFinite(mrr)||mrr<0)return "Monthly recurring must be zero or a positive number.";

  }

    if(!tok())return renderLogin("Session expired — sign in again.");

// day-review 2026-08-28 C2: loadExceptions() was ONLY ever called once at boot
// (line ~1613), so the Exceptions view's age/overdue classification froze for
// the life of the tab -- a due_at/expires_at that passed after boot never
// surfaced, and a resolved exception never left. Wired into the existing 120s
// refetch (same cadence as the main snapshot) and re-bucketed for free on the
// existing 30s render tick (no extra fetch -- reuses EXC.items/EXC.decisions,
// same "reuses LAST" pattern the 30s age-pill tick already follows above).
function _reclassifyExceptions(){
  if(EXC&&EXC.items&&EXC.decisions)EXC=_classifyExceptions(EXC.items,EXC.decisions);

// R2 (security review #3, HIGH): the tick is COSMETIC (age pill) — it must
// never cost the operator their typing focus. While an input/textarea inside
// #app is focused, skip it entirely; the 120s data refetch still re-renders
// (fresh data beats the age pill, and render()'s focus snapshot covers it).
function _typingActive(){
  const el=document.activeElement;
  return !!(el&&(["INPUT","TEXTAREA","SELECT"].includes(el.tagName)||el.isContentEditable)&&el.closest("#app"));
}
function _cosmeticTick(){

  // repaint the stale snapshot over the login screen every 30s. Belt-and-suspenders
  // with renderLogin nulling LAST.p — this stops the tick before it even reads LAST.p.
  if(!_portalReadCurrent(PORTAL_EPOCH))return;
