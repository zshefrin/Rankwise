<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<!-- add-to-homescreen (finding 92): no chrome flash on a #101418 app, no white
     status bar. apple-touch-icon deliberately omitted — data: URIs don't work on
     iOS and this file stays self-contained (no network asset). -->
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rankwise — Dashboard</title>
<style>
  /* ── Design tokens ─────────────────────────────────────────────────────────
     One source of truth. Before this, 4 variables coexisted with 121 hardcoded
     hexes, 18 font sizes, 10 weights and 12 radii, so adjacent tabs read as
     different hand-built pages. Add a token here — never a 122nd hex.
     NOTE: saturated status tints (ok/warn/bad/accent washes) are deliberately
     NOT folded into the neutral ramp; they carry meaning. */
  :root {
    /* surfaces: darkest ground → raised card */
    --bg:#101418; --surface-0:#0d1115; --surface-1:#131920; --surface-2:#1a2026; --surface-3:#1f272e;
    --card:var(--surface-2);
    /* borders: subtle → hairline → hover */
    --border-1:#222a31; --border-2:#24303a; --border-3:#2a323a; --border-hover:#3a4650;
    --line:var(--border-3);
    /* text: 3 tiers. --text-3 is the smallest wayfinding tier and MUST stay
       ≥4.5:1 on --surface-2 (it was #6b7884 = 3.6:1 — a real AA failure). */
    --text-0:#eef2f6; --text-1:#e8edf2; --text-2:#9aa7b3; --text-3:#7f8c99;
    --text:var(--text-1); --mut:#8a97a3;
    /* selection + info washes: faint accent-tinted surfaces. These sit at hue ~210
       and must NOT be folded into the neutral ramp — a selected row that shares its
       siblings' fill is a lost affordance. */
    --surface-sel:#18222c; --surface-sel-strong:#182638; --accent-wash:#111e2c; --accent-line:#27507a;
    /* status + soft tints */
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --accent:#60a5fa;
    --ok-soft:#6ee7b7; --warn-soft:#fcd34d; --bad-soft:#fca5a5; --accent-soft:#93c5fd;
    --on-accent:#0b1220;
    /* type scale — 6 steps, weights 400/500/600/700 only */
    --fs-1:11px; --fs-2:12px; --fs-3:13px; --fs-4:14px; --fs-5:16px; --fs-6:20px;
    /* radius scale */
    --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
    /* role accent (finding 71): each shell scopes this; stat kickers read it so a
       KPI tile is the same object in every role, only the accent differs. */
    --role-accent:var(--text-2);
  }
  body.dial { --role-accent:#78d5ad; }
  body.client { --role-accent:#8cccf7; }
  * { box-sizing:border-box; margin:0; }
  /* UA default for b/strong is `bolder`, which computes to 900 against a 700
     parent — a 5th weight nobody chose. Pin it to the scale. */
  b, strong { font-weight:700; }
  /* Icon primitive (finding 76): one stroke set, sized in em so it tracks its
     text, drawn in currentColor so it takes the theme like a glyph. */
  svg.i { width:1.05em; height:1.05em; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.15em; }
  /* Interaction states, globally. Previously only body.ops buttons/inputs had a
     focus ring, and only ops had hover — seller, client and login controls gave
     no feedback at all that they were interactive. */
  /* No border-radius:inherit — it beats the element's own radius and squares off
     plain buttons. Browsers already follow the real radius when drawing outline. */
  :where(button, a, input, textarea, select, summary, [tabindex]):focus-visible {
    outline:2px solid var(--accent); outline-offset:2px;
  }
  /* .dccall (the seller's dial CTA) owns its press animation — one type selector
     in the global rule would otherwise outrank its class rule. */
  button:not(:disabled):not(.dccall):hover { filter:brightness(1.12); }
  button:not(:disabled):not(.dccall):active { transform:translateY(.5px); }
  @media (prefers-reduced-motion: reduce) { button:not(:disabled):not(.dccall):active { transform:none; } }
  /* Digits that sit in columns must not jitter as data changes. */
  .num, .stat-v, .ops-metric-v, .cg-v, .metric-v, td.num, .ops-stat-v, .ops-tile .ops-b, .ops-pulse .ops-row .ops-v, .ops-li .ops-muted { font-variant-numeric:tabular-nums; }
  body { background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, system-ui, sans-serif; padding:12px; max-width:560px; margin:0 auto; }
  /* Dial Console gets a wide desktop canvas (list + dossier); text sections stay narrow for readability. */
  body.dial { max-width:1180px; }
  body.dial .dial-top { max-width:720px; }
  h1 { font-size:var(--fs-6); margin:8px 0 2px; } .mut { color:var(--mut); font-size:var(--fs-3); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:14px; margin:10px 0; }
  /* ── Auth shell (login / set-password) — the product's first screen ──────── */
  /* body has 12px top+bottom padding; subtract it or the first screen scrolls. */
  .auth-shell { min-height:calc(100dvh - 24px); display:grid; place-items:center; padding:24px 16px; box-sizing:border-box; }
  .auth-box { width:100%; max-width:380px; }
  .auth-brand { display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .auth-brand h1 { font-size:22px; margin:0; letter-spacing:-.01em; }
  /* NOT .tag — that's the red "don't claim" chip below; this would inherit its pill. */
  .auth-brand .auth-tag { font-size:var(--fs-1); letter-spacing:.06em; text-transform:uppercase; color:var(--mut); font-weight:700; }
  .auth-sub { color:var(--mut); font-size:var(--fs-3); margin:0 0 16px; }
  /* Card + input borders pinned to --text-3, not --line (finding: 2026-07-18 audit —
     --line against --surface-0/--surface-2 measured 1.46:1 / 1.26:1, both under the
     3:1 WCAG 1.4.11 floor for control boundaries). --text-3 is already the token this
     file vets to ≥4.5:1 on --surface-2 for TEXT (see the --text-3 comment above), so it
     clears 3:1 here with margin — reusing the existing ramp instead of a new hex.
     Scoped to .auth-* only; --line/--border-3 stay untouched everywhere else. */
  .auth-card { background:var(--card); border:1px solid var(--text-3); border-radius:var(--r-lg); padding:20px; }
  .auth-form { display:grid; gap:14px; }
  .auth-field { display:grid; gap:6px; }
  .auth-field label { font-size:var(--fs-2); font-weight:600; color:var(--mut); }
  .auth-form input { width:100%; box-sizing:border-box; font-size:var(--fs-5); border-color:var(--text-3); } /* 16px: no iOS zoom-on-focus */
  .auth-form button { width:100%; }
  /* Show/hide toggle lives inside the password field's own box (right-aligned) so it
     reads as part of the input, not a floating extra control. Fixed 44px = a full
     touch target without visibly widening the field. */
  .pw-wrap { position:relative; }
  .pw-wrap input { padding-right:44px; }
  .pw-wrap .pw-toggle { position:absolute; top:0; right:0; width:44px; height:100%; min-height:44px; display:flex; align-items:center; justify-content:center; background:transparent; border:0; padding:0; color:var(--mut); cursor:pointer; }
  .auth-or { display:flex; align-items:center; gap:10px; color:var(--mut); font-size:var(--fs-2); }
  .auth-or::before, .auth-or::after { content:""; flex:1; height:1px; background:var(--line); }
  .auth-oauth { display:flex; align-items:center; justify-content:center; gap:9px; }
  /* Reserve one line so an error never shifts the form; negative margins keep the
     empty state from opening a hole between the button and the divider. */
  .auth-err { min-height:16px; margin:-6px 0; font-size:var(--fs-3); color:var(--bad); }
  .auth-foot { margin:14px 0 0; text-align:center; font-size:var(--fs-3); }
  .auth-foot a { color:var(--accent); }
  button[aria-busy="true"] { opacity:.6; cursor:progress; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button { border:0; border-radius:var(--r-md); padding:10px 12px; font-size:var(--fs-4); font-weight:600; cursor:pointer; background:var(--border-3); color:var(--text); }
  button.link-btn { background:transparent; color:var(--ok); padding:0 2px; font:600 var(--fs-3)/1.3 inherit; text-decoration:underline; }
  button.primary { background:var(--accent); color:var(--on-accent); }
  button.disp { flex:1 1 30%; padding:12px 6px; }
  button.disp.sel { outline:2px solid var(--accent); }
  button:disabled { opacity:.45; }
  /* Button primitive (finding 77): the canonical variant system built from tokens.
     The eight legacy button selectors (.role-btn/.ops-btn/.ops-iconbtn/.ops-seg/
     .client-action/…) were already token-aligned by Pass L and share this focus/
     radius; height stays per-context because .ops-btn also hosts the two-line
     .ops-actionbtn, which a fixed height would clip. This is the target for new
     buttons: .btn (md) / .btn.btn-sm (sm) × .btn-primary / .btn-ghost. */
  .btn { appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:7px; height:34px; padding:0 12px; border:1px solid var(--border-3); background:var(--surface-1); color:var(--text-1); border-radius:var(--r-md); font:600 var(--fs-3)/1 -apple-system,system-ui,sans-serif; cursor:pointer; white-space:nowrap; }
  .btn.btn-sm { height:28px; padding:0 10px; font-size:var(--fs-2); }
  .btn-primary { background:var(--accent); color:var(--on-accent); border-color:transparent; }
  .btn-ghost { background:transparent; color:var(--text-2); }
  .btn-ghost:hover { color:var(--text-0); }
  input, textarea { width:100%; background:var(--surface-0); border:1px solid var(--line); border-radius:var(--r-md); color:var(--text); padding:10px; font-size:var(--fs-5); }
  a.tel { display:block; text-align:center; background:var(--ok); color:#06281c; font-weight:700; font-size:var(--fs-6); padding:13px; border-radius:var(--r-lg); text-decoration:none; margin:8px 0; }
  .banner { padding:10px 12px; border-radius:var(--r-lg); font-size:var(--fs-4); margin:8px 0; }
  .banner.bad { background:#3a1d1d; color:var(--bad); } .banner.ok { background:#15302a; color:var(--ok); }
  .banner.warn { background:#332a12; color:var(--warn); }
  .tally { display:flex; gap:6px; text-align:center; margin:8px 0; }
  .tally div { flex:1; background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:8px 2px; }
  .tally b { display:block; font-size:var(--fs-6); }
  .tally.wk b { font-size:var(--fs-5); }
  .bar { height:8px; background:var(--surface-0); border-radius:var(--r-pill); overflow:hidden; margin:4px 0; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .done { opacity:.55; }  /* .pill base removed: fully superseded by the .badge/.pill primitive below */
  details summary { cursor:pointer; color:var(--accent); font-size:var(--fs-4); margin:6px 0; }
  .opener { background:var(--surface-0); border-left:3px solid var(--accent); padding:10px; border-radius:var(--r-md); font-size:var(--fs-4); margin:6px 0; font-style:italic; }
  /* ── dial card: site condition ─────────────────────────────────────── */
  .dc__hd { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .dc__nm { font-size:var(--fs-5); font-weight:700; letter-spacing:-.012em; line-height:1.2; }
  .dc__ct { color:var(--mut); font-size:var(--fs-2); margin-top:2px; }
  .dc__rk { flex:none; font:700 var(--fs-2) ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--mut); padding-top:2px; }
  .hook { display:flex; gap:8px; align-items:flex-start; margin:11px 0 0; padding:10px 12px; border-radius:var(--r-lg); font-size:var(--fs-4); font-weight:600; line-height:1.34; }
  .hook i { font-style:normal; flex:none; }
  .hook--bad  { background:rgba(248,113,113,.12); color:var(--bad-soft); }
  .hook--warn { background:rgba(251,191,36,.13);  color:var(--warn-soft); }
  .hook--info { background:rgba(96,165,250,.13);  color:var(--accent-soft); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 0; align-items:center; }
  .chip { font-size:var(--fs-2); font-weight:600; padding:3px 8px; border-radius:var(--r-sm); background:var(--border-1); color:#cdd6df; display:inline-flex; gap:5px; align-items:center; line-height:1.5; }
  .chip--bad { background:rgba(248,113,113,.15); color:var(--bad-soft); }
  .chip--ok  { background:rgba(52,211,153,.15);  color:var(--ok-soft); }
  .chip--warn{ background:rgba(251,191,36,.15);  color:var(--warn-soft); }
  .chip-legend { font-size:var(--fs-1); color:var(--mut); margin:5px 0 0; line-height:1.4; }
  .chip-caveat { display:inline-block; margin-top:3px; color:var(--warn-soft); }
  .dots { display:inline-flex; gap:3px; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .gapv { margin:12px 0 0; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:var(--r-lg); }
  .gapv__t { font-size:var(--fs-1); color:var(--mut); margin-bottom:8px; }
  .gr { display:flex; align-items:center; gap:9px; margin:5px 0; }
  .gr__l { width:88px; flex:none; font-size:var(--fs-2); color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gr__t { flex:1; height:8px; background:var(--surface-1); border-radius:var(--r-pill); overflow:hidden; }
  .gr__f { display:block; height:100%; border-radius:var(--r-pill); min-width:6px; }
  .gr__f.them { background:#fb7185; } .gr__f.riv { background:var(--text-3); }
  .gr__n { width:52px; flex:none; text-align:right; font:700 var(--fs-2) ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums; color:#cdd6df; }
  .gr__n.them { color:var(--bad-soft); }
  .dccall { display:flex; align-items:center; justify-content:center; gap:9px; margin:12px 0 0; background:var(--ok); color:#04130d; font-weight:700; font-size:var(--fs-6); padding:14px; border-radius:var(--r-lg); text-decoration:none; font-variant-numeric:tabular-nums; transition:transform .12s ease, filter .12s ease; }
  .dccall:active { transform:scale(.985); filter:brightness(.94); }
  button.dccall { width:100%; border:0; font-family:inherit; cursor:pointer; }
  button.dccall:disabled { opacity:.6; cursor:default; }
  /* Outside-CRTC-hours lock reads as inert (grey), distinct from the green live CTA. */
  button.dccall.hours-lock { background:var(--border-2); color:var(--mut); }
  .dccall.dnc { background:rgba(248,113,113,.12); color:var(--bad-soft); font-weight:700; font-size:var(--fs-4); }
  .dial-disclose { display:flex; align-items:center; gap:6px; margin:6px 0 0; font-size:var(--fs-1); color:var(--warn-soft); }
  /* Call-lifecycle status pill (twilio-tel-fallback-recording-mislabel criterion 3): real
     states from seller_call_attempts.status, never invented — hidden until dialBridge() has
     something real to show, and silently hidden again if tracking can't confirm a state
     (fail-soft: the toast-based flow this augments is already the source of truth). */
  .call-status { display:none; align-items:center; gap:6px; margin:6px 0 0; font-size:var(--fs-2); font-weight:600; padding:4px 0; }
  .call-status.show { display:flex; }
  .call-status.wait { color:var(--warn-soft); } .call-status.ok { color:var(--ok-soft); }
  .call-status.bad { color:var(--bad-soft); } .call-status.info { color:var(--accent-soft); }
  .sec { margin:11px 0 0; padding:10px 12px; border-radius:var(--r-lg); }
  .sec__l { font-size:var(--fs-1); font-weight:700; margin-bottom:7px; }
  .sec--open { background:rgba(96,165,250,.10); } .sec--open .sec__l { color:var(--accent-soft); }
  .sec--open p { font-size:var(--fs-3); line-height:1.4; color:var(--text-1); margin:0; }
  .sec--say { background:rgba(52,211,153,.08); } .sec--say .sec__l { color:var(--ok-soft); }
  .pt { display:flex; gap:8px; align-items:flex-start; font-size:var(--fs-3); line-height:1.34; margin:5px 0; color:#dceee6; }
  .pt b { color:var(--ok); flex:none; font-weight:700; }
  .sec--avoid { background:rgba(248,113,113,.09); } .sec--avoid .sec__l { color:var(--bad-soft); }
  .sec--avoid .sec__l span { font-weight:500; color:var(--mut); }
  /* ── Badge primitive (finding 29) ────────────────────────────────────────
     Eight visually distinct chip components rendered the same 'status' idea, so
     "blocked" wore four different skins in one session. One base + four tones;
     the legacy selectors alias onto it so no markup had to change. */
  .badge, .pill {
    display:inline-block; font-size:var(--fs-1); font-weight:600; line-height:1.4;
    padding:3px 8px; border-radius:var(--r-sm);
    background:var(--surface-3); color:var(--text-2); border:1px solid transparent;
  }
  /* .chip is NOT aliased: it is structurally different (inline-flex + gap, for
     key/value pairs). It already consumes the same tint tokens. */
  .badge.ok,   .pill.ok   { background:rgba(52,211,153,.13);  color:var(--ok-soft); }
  .badge.warn, .pill.warn { background:rgba(251,191,36,.13);  color:var(--warn-soft); }
  .badge.bad,  .pill.bad  { background:rgba(248,113,113,.13); color:var(--bad-soft); }
  .badge.info, .pill.info { background:rgba(96,165,250,.13);  color:var(--accent-soft); }
  /* the rail used to be a block element; the badge that replaced it is inline. */
  .ops-object .badge { margin:9px 8px 0 0; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { font-size:var(--fs-2); padding:3px 9px; border-radius:var(--r-sm); background:rgba(248,113,113,.15); color:#f4a8a8; }
  /* ── console: list rail + dossier ─────────────────────────────────────── */
  .console { display:flex; gap:14px; align-items:flex-start; margin-top:10px; }
  .rail { flex:0 0 270px; display:flex; flex-direction:column; gap:6px; max-height:calc(100vh - 40px); overflow-y:auto; position:sticky; top:8px; }
  .dossier { flex:1; min-width:0; }
  .railrow { width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg); padding:9px 11px; cursor:pointer; color:var(--text); transition:border-color .12s, background .12s; }
  .rail-filter { position:sticky; top:0; z-index:2; background:var(--bg); padding:2px 0 7px; margin-bottom:1px; }
  .rail-search { width:100%; box-sizing:border-box; padding:7px 9px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface-0); color:var(--text); font-size:var(--fs-3); }
  .rail-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .rf-chip { font-size:var(--fs-1); font-weight:700; padding:3px 9px; border-radius:var(--r-pill); border:1px solid var(--line); background:var(--card); color:var(--mut); cursor:pointer; }
  .rf-chip.active { border-color:var(--accent); color:#bcd9ff; background:var(--accent-wash); }
  .rail-empty { color:var(--mut); font-size:var(--fs-2); padding:8px 2px; }
  .railrow:hover { border-color:var(--border-hover); }
  .railrow.active { border-color:var(--accent); background:var(--surface-sel); }
  .railrow.done { opacity:.5; }
  .railrow__top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .railrow__nm { font-weight:600; font-size:var(--fs-4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .railrow__sub { color:var(--mut); font-size:var(--fs-2); margin-top:3px; display:flex; align-items:center; gap:6px; min-width:0; }
  .railrow__sub span.t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dossier-card { margin:0 !important; }
  .dgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; margin-top:2px; }
  .dcol { min-width:0; }
  .dback { display:none; margin-bottom:10px; background:var(--border-1); color:var(--text); border:1px solid var(--line); border-radius:var(--r-md); padding:7px 13px; font-size:var(--fs-3); font-weight:600; cursor:pointer; }
  .verif { margin:11px 0 0; font-size:var(--fs-2); color:var(--mut); display:flex; align-items:center; gap:7px; }
  .verif b { color:var(--ok-soft); font-weight:600; }
  @media (max-width:1023.98px) { .dgrid { grid-template-columns:1fr; gap:0; } }
  @media (max-width:767.98px) {
    .console { display:block; }
    .console .dossier { display:none; }
    .console.show .rail { display:none; }
    .console.show .dossier { display:block; }
    .console.show .dback { display:inline-flex; }
    .rail { position:static; max-height:none; }
  }
  .cond { font-size:var(--fs-2); margin-top:6px; }
  .cond dl { display:grid; grid-template-columns:80px 1fr; gap:5px 10px; margin:0 0 4px; }
  .cond dt { color:var(--mut); } .cond dd { margin:0; }
  .cond__sec { font-size:var(--fs-1); color:var(--mut); margin:11px 0 4px; }
  .maprow { display:flex; justify-content:space-between; gap:8px; font-size:var(--fs-2); padding:3px 0; }
  .maprow + .maprow, .cgrid div + div { border-top:1px solid var(--line); }
  .maprow .miss { color:var(--bad); font-weight:700; } .maprow .hit { color:var(--ok); font-weight:700; }
  .cgrid div { display:flex; justify-content:space-between; gap:8px; padding:3px 0; }
  @media (prefers-reduced-motion: reduce) { .dccall { transition:none; } }
  .kit { background:var(--surface-0); border-radius:var(--r-md); padding:10px; font-size:var(--fs-3); white-space:pre-wrap; max-height:300px; overflow-y:auto; }
  .kit.md { white-space:normal; line-height:1.45; }
  .kit.md .md-h { display:block; font-weight:600; margin:8px 0 3px; }
  .kit.md .md-h:first-child { margin-top:0; }
  .kit.md .md-ul { margin:4px 0 4px 18px; }

  /* Stat primitive (finding 71): the canonical KPI tile — uppercase kicker in the

  .stat { min-width:0; background:var(--surface-1); border:1px solid var(--border-2); border-radius:var(--r-md); padding:12px; }

  .metric .m-info { appearance:none; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; margin-left:4px; padding:0; border:1px solid var(--border-3); border-radius:var(--r-pill); background:transparent; color:var(--text-2); font-size:var(--fs-1); font-weight:700; font-style:normal; line-height:1; cursor:pointer; vertical-align:middle; }  /* Pass Y: reachable metric-explanation affordance */

  /* Per-card stale indicator (stale-data-card-indicators): opt-in via metric()'s optional

  .metric.bad .m-value { color:var(--bad); } .metric.info .m-value { color:var(--accent); }
  .role-grid { display:grid; gap:10px; grid-template-columns:1fr; margin:10px 0; align-items:start; }

  body.ops .ops-iconbtn:hover { color:var(--text-0); border-color:var(--border-hover); }

  body.ops nav.ops-tabs { position:sticky; top:0; z-index:20; display:flex; gap:2px; background:rgba(14,18,22,.82); backdrop-filter:blur(8px); border-bottom:1px solid var(--border-1); margin:0 -16px; padding:0 12px; overflow-x:auto; scrollbar-width:none; }
  body.ops nav.ops-tabs::-webkit-scrollbar { display:none; }

     overflows — opsSyncTabFade() toggles .is-scrollable off scrollWidth>clientWidth,

  body.ops nav.ops-tabs.is-scrollable::after { content:""; position:sticky; top:0; right:0; align-self:stretch; flex:0 0 28px; margin-left:-28px; background:linear-gradient(to right, rgba(14,18,22,0), rgba(14,18,22,.92) 65%); pointer-events:none; }
  body.ops .ops-tab { appearance:none; background:none; border:0; color:var(--text-2); font:500 var(--fs-4)/1 -apple-system,system-ui,sans-serif; cursor:pointer; padding:13px 14px; position:relative; white-space:nowrap; transition:color .15s cubic-bezier(.22,.61,.36,1); display:flex; gap:7px; align-items:center; }

const PT = "America/Vancouver";

// but is appended when the date falls in a different calendar year so an aged row is
// never ambiguous across the year rollover (finding: year-less time helpers).
const ptTime = (d) => {
  const dt = new Date(d);
  const opts = { timeZone: PT, month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
  if (isFinite(dt.getTime()) && dt.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return dt.toLocaleString("en-CA", opts);

// Human month label from a 'YYYY-MM' token: monthLabel('2026-07') → 'July 2026';
// monthLabel('2026-07', false) → 'July'. Kills the bare '2026-07' chips.
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function monthLabel(ym, withYear) {
  const m = String(ym == null ? "" : ym).match(/^(\d{4})-(\d{1,2})/);
  if (!m) return String(ym == null ? "" : ym);
  const name = MONTH_NAMES[Number(m[2]) - 1] || m[2];
  return (withYear === false) ? name : (name + " " + m[1]);
}
// Short absolute day ('May 23') for date-only trend rows — no timezone shift on a bare
// 'YYYY-MM-DD' (which new Date() would read as UTC midnight and roll back a day in PT).
function ptDayShort(d) {
  if (d == null || d === "") return "";
  const nowY = new Date().getFullYear();
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) {
    const y = Number(m[1]);
    return MONTH_NAMES[Number(m[2]) - 1].slice(0, 3) + " " + Number(m[3]) + (y !== nowY ? ", " + y : "");
  }
  // Preserve already-human labels such as "Jun 3". Parsing those through
  // Date turns them into dates in 2001, which is technically valid JS but
  // misleading in a client-facing trend.
  const human = String(d).match(/^([A-Za-z]{3,9})\s+(\d{1,2})(?:,\s*(\d{4}))?$/);
  if (human) {
    const month = human[1].slice(0, 3);
    const day = Number(human[2]);
    const year = human[3] ? Number(human[3]) : null;
    return month + " " + day + (year && year !== nowY ? ", " + year : "");
  }
  const t = new Date(d);
  if (!isFinite(t.getTime())) return String(d);
  const opts = { timeZone: PT, month: "short", day: "numeric" };
  if (t.getFullYear() !== nowY) opts.year = "numeric";
  return t.toLocaleDateString("en-CA", opts);
}

function weekStartPT() {

// Disable a button for the duration of an async action so a double-click can't
// fire it twice, and so the user sees that something is happening.
async function withBusy(btn, label, fn) {
  if (!btn) return fn();
  if (btn.disabled) return; // reentrancy: a second overlapping call would strand the button disabled
  const was = btn.textContent, wasDisabled = btn.disabled;
  btn.disabled = true; btn.setAttribute("aria-busy", "true");
  if (label) btn.textContent = label;
  try { return await fn(); }

  }

async function login(e) {
  e.preventDefault();
  const err = $("#err"), btn = $("#signin"), em = $("#em"), pw = $("#pw");
  err.textContent = "";
  em.removeAttribute("aria-invalid"); pw.removeAttribute("aria-invalid");
  // #err is tabindex=-1 (programmatically focusable, never Tab-reachable) so a failure
  // lands focus on the message without adding a stop to the form's tab order. Only a
  // real credential failure marks the fields aria-invalid — a network/service error
  // isn't a bad value in either field, so it shouldn't claim one is.
  const showErr = (msg, badFields) => {
    err.textContent = msg;
    if (badFields) { em.setAttribute("aria-invalid", "true"); pw.setAttribute("aria-invalid", "true"); }
    err.focus();
  };
  await withBusy(btn, "Signing in…", async () => {
    let r, d;
    try {
      r = await fetch(SB + "/auth/v1/token?grant_type=password", {
        method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ email: em.value.trim(), password: pw.value }),
      });
    } catch {
      // Offline / DNS / CORS: fetch rejects and there is no response to read.
      showErr("Network error — check your connection and retry.");
      return;
    }
    try {
      d = await r.json();
    } catch {
      // Reached the server but it did not return JSON (5xx HTML page, proxy error):
      // a backend/service fault, not the user's connection.
      showErr("Sign-in service error — please try again in a moment.");

      localStorage.setItem("rw_tok", d.access_token);
      if (d.refresh_token) localStorage.setItem("rw_rtok", d.refresh_token); // enables silent renewal
      render();
    }
    else showErr(d.error_description || d.msg || "Login failed", true);
  });
}

// Catch auth redirects (OAuth sign-in AND password-recovery links both return
// tokens in the URL hash — implicit flow).
// Pass V-b: only adopt a hash token that is shaped like a genuine auth callback
// for THIS project — a well-formed JWT issued by our own auth server and not yet
// expired. A link crafted with a foreign or malformed token pair is ignored (and
// the hash is still stripped) so a URL can never silently seed someone else's session.
function _isProjectAuthToken(t) {
  try {
    const parts = String(t || "").split(".");
    if (parts.length !== 3) return false;
    const p = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
    if (typeof p.iss !== "string" || p.iss.indexOf(SB) !== 0) return false;      // our project only
    if (typeof p.exp !== "number" || p.exp * 1000 <= Date.now()) return false;   // not already expired

  } catch { return false; }

(function () {
  if (!location.hash) return;
  const h = new URLSearchParams(location.hash.slice(1));
  let hadAuth = false;
  if (h.get("access_token")) {
    hadAuth = true;
    const at = h.get("access_token");
    if (_isProjectAuthToken(at)) {
      localStorage.setItem("rw_tok", at);
      if (h.get("refresh_token")) localStorage.setItem("rw_rtok", h.get("refresh_token"));
      if (h.get("type") === "recovery" || h.get("type") === "invite") window._recovery = true;

  }

  // plain deep link like #tab=system carries no tokens and must survive so the
  // tab router below can read it (finding 15).

// ── Session + fetch discipline ────────────────────────────────────────────────
// The access token expires (Supabase default 1h). Before this, the first 401
// after expiry dumped the user to the login screen mid-shift with full state
// loss. Now we keep the refresh token and renew silently, once, then retry.
function clearTokens() {
  localStorage.removeItem("rw_tok"); localStorage.removeItem("rw_rtok");
  // Pass V-d: purge role-gated cached payloads on every session teardown so a shared
  // device never retains the previous login's data. The 513KB market-map cache and the
  // client-only milestone flags both rebuild from the server on the next authed load.
  localStorage.removeItem("rw_mmap_payload"); localStorage.removeItem("rw_mmap_ver");
  localStorage.removeItem("rw_seller_milestones");
}
// Pass V-a: an explicit Log out must end the session server-side, not just drop the
// local copy — clearing localStorage alone leaves the refresh token usable, so whoever
// held it could keep renewing. Revoke first (best-effort: a dead or offline token must
// still log out locally), then clear + repaint.
async function logout() {
  try {
    if (tok()) await fetch(SB + "/auth/v1/logout?scope=global", { method: "POST", headers: hdr() });
  } catch (e) { /* offline / already-expired: fall through to local teardown */ }
  clearTokens();
  render();
}
// Single-flight the session-give-up (finding 11). refreshSession() is already collapsed
// onto one round-trip, but the give-up path was not: a burst of concurrent 401s each ran
// clearTokens()+render() → N logins painted. The FIRST give-up clears the token; the rest
// see no token and skip the redundant render. A later real re-login re-arms it.
function abandonSession() {
  if (!tok()) return null;   // already given up by an earlier 401 in this burst
  clearTokens();
  render();
  return null;
}

let _refreshing = null; // collapse concurrent 401s onto ONE refresh round-trip
function refreshSession() {
  if (_refreshing) return _refreshing;
  const rt = localStorage.getItem("rw_rtok");
  if (!rt) return Promise.resolve(false);
  _refreshing = (async () => {
    try {
      const r = await fetch(SB + "/auth/v1/token?grant_type=refresh_token", {
        method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ refresh_token: rt }),
      });
      const d = await r.json();
      if (r.ok && d.access_token) {
        localStorage.setItem("rw_tok", d.access_token);
        if (d.refresh_token) localStorage.setItem("rw_rtok", d.refresh_token);
        return true;
      }
    } catch { /* fall through — treat as failed refresh */ }
    return false;
  })().finally(() => { _refreshing = null; });
  return _refreshing;
}

// Every authenticated call goes through here. Returns a Response, or null when
// the session is truly dead (caller should bail — render() already ran).
async function authedFetch(url, opts) {
  const build = () => {
    const o = Object.assign({}, opts);
    const h = Object.assign({}, (opts && opts.headers) || {});
    h.apikey = KEY;
    h.Authorization = "Bearer " + tok(); // re-read each attempt: the retry needs the NEW token
    // JSON only for string bodies — never force a Content-Type onto a raw file
    // upload (Storage needs the browser to set it from the Blob).
    if (typeof o.body === "string" && !h["Content-Type"]) h["Content-Type"] = "application/json";
    o.headers = h;
    return o;
  };
  let r = await fetch(url, build());
  if (r.status === 401) {
    if (await refreshSession()) r = await fetch(url, build()); // retry once with the fresh token
    else return abandonSession();
    if (r.status === 401) return abandonSession();
  }
  return r;
}

// rest() now has an ERROR CONTRACT. Previously any non-401 failure returned a
// PostgREST error object (truthy!) or threw, so a Supabase outage rendered a
// fully-zeroed cockpit indistinguishable from this product's honest zero-states.
// Callers must check bad() before trusting the value.
const bad = (v) => !!(v && v.__error);
async function rest(path) {
  let r;
  try { r = await authedFetch(SB + "/rest/v1/" + path, {}); }
  catch { return { __error: "network" }; }
  if (r === null) return null;              // session dead; render() already fired
  if (!r.ok) return { __error: r.status };
  try { return await r.json(); } catch { return { __error: "parse" }; }
}

function actionWait(ms) { return new Promise(function(resolve) { setTimeout(resolve, ms); }); }

// Queue writes used to end at a green "Queued" toast. That made a failed worker run
// indistinguishable from a successful refresh/publish. Ask PostgREST to return the row,
// then watch the existing queue status column for a short, bounded window. The worker is
// still the authority; this is only the operator's visibility loop.
async function watchQueuedAction(id, action) {
  for (let i = 0; i < 8; i++) {
    await actionWait(1500);
    let row;
    try { row = await rest("operator_action_queue?id=eq." + encodeURIComponent(String(id)) + "&select=id,action,status,result,processed_at"); }
    catch { return; }
    if (bad(row) || !Array.isArray(row) || !row[0]) continue;
    const state = String(row[0].status || "").toLowerCase();
    if (state === "processing") toast("Running — " + action, "wait", 2600);
    if (state === "done") {
      toast("Completed — " + action, "ok", 4200);
      renderOps();
      // Content/ticket mutations write through to source, but the cockpit reads a CACHED
      // operator_portal_snapshot regenerated only 2×/day — without a real regen the repaint
      // above still shows pre-mutation counts and the operator can't tell the action landed.
      // Chain one real refresh_ops. Guarded to content./ticket.* only, so refresh_ops itself
      // (which matches neither prefix) can never re-trigger this and loop.
      if (/^(content|ticket)\./.test(String(action))) enqueueAction("refresh_ops", {});
      return;
    }
    if (state === "failed") { toast("Failed — " + (row[0].result || action) + ". Retry is available below.", "err", 6500); renderOps(); return; }
  }
  toast("Still queued — check Recent actions for the final result.", "wait", 5000);
  renderOps();
}

async function enqueueAction(action, params) {
  let r;
  try {

// client_asset view (059, client-upload-asset-record): storage_path is intentionally NEVER
// persisted as a signed URL (they expire) — this resolves the CURRENT file for a request live
// (operator JWT, RLS grants operator full read) and signs it at click time. Fails soft to a
// toast at every step: no client_asset row yet (pre-059, or nothing actually uploaded through
// the new flow), a sign-endpoint failure, or a malformed response all read as "not available",
// never a broken UI.
async function opsViewClientAsset(btn) {
  const ck = (btn.getAttribute("data-client-key") || "").trim();
  const rid = (btn.getAttribute("data-request-id") || "").trim();
  if (!ck) { toast("No client on this row", "err"); return; }
  // A row that carries a request marker that ISN'T a real numeric id must not
  // silently drop the filter and open the client's NEWEST file — wrong file
  // under the clicked request's label (edge-fn security review, note 1).
  if (rid && !/^\d+$/.test(rid)) { toast("No file on record for this request yet", "err"); return; }
  let rows;
  try {
    let q = "client_asset?client_key=eq." + encodeURIComponent(ck) + "&order=id.desc&limit=1&select=storage_path,filename";
    if (rid) q += "&request_id=eq." + encodeURIComponent(rid);
    rows = await rest(q);
  } catch { toast("Could not look up the file — check your connection and retry", "err"); return; }
  if (bad(rows) || !Array.isArray(rows) || !rows[0]) { toast("No file on record for this request yet", "err"); return; }
  const path = String(rows[0].storage_path || "");
  // Defense-in-depth on a CLIENT-writable value (edge-fn security review,
  // LOW-1): 059's RLS pins only the first path segment to client_key at
  // INSERT — a direct-REST insert could still carry `..`/`?`/`#` in the
  // remainder. Re-validate the tenant segment against the row we're acting
  // for, and URL-encode each segment so no character re-shapes the sign URL.
  const segs = path.split("/");
  if (segs[0] !== ck || segs.some((s) => !s || s === "." || s === "..")) {
    toast("File path on record is malformed — flag this to engineering", "err"); return;
  }
  let sr;
  try {
    sr = await authedFetch(SB + "/storage/v1/object/sign/client-uploads/" + segs.map(encodeURIComponent).join("/"), {
      method: "POST", body: JSON.stringify({ expiresIn: 600 }),
    });
  } catch { toast("Could not sign the file link — check your connection and retry", "err"); return; }
  if (sr === null) return;   // session dead; render() already fired
  if (!sr.ok) { toast("Could not sign the file link", "err"); return; }
  let sd;
  try { sd = await sr.json(); } catch { toast("Could not sign the file link", "err"); return; }
  const signedURL = sd && (sd.signedURL || sd.signedUrl);
  if (!signedURL) { toast("Could not sign the file link", "err"); return; }
  window.open(SB + "/storage/v1" + signedURL, "_blank", "noopener");
}

// Best-effort integrity marker for client_asset.checksum (059: client-supplied, never
// server-verified — Storage doesn't compute one for us at insert time). A huge file (arrayBuffer()
// reads the whole thing into memory) or a digest failure must never block the upload it accompanies
// — degrade to '' rather than throw.
async function sha256Hex(file) {
  try {
    const buf = await file.arrayBuffer();
    const hash = await crypto.subtle.digest("SHA-256", buf);
    return Array.from(new Uint8Array(hash)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch { return ""; }
}

// Client file upload (M4): upload to the PRIVATE client-uploads Storage bucket under the client's
// OWN client_key folder via their JWT (Storage RLS, migration 042, scopes the write to that folder),
// then record a client_approval row (kind='upload', upload_ref=path). client_key (slug) + the
// sanitized filename ([a-zA-Z0-9._-]) are URL-safe, so the object path needs no further encoding.
async function clientUpload(requestId, inputEl) {
  const ck = window._clientKey;
  if (!ck) { toast("Account not identified — please reload", "err"); return; }
  const file = inputEl && inputEl.files && inputEl.files[0];
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) { toast("File too large (max 25 MB)", "err"); inputEl.value = ""; inputEl.setAttribute("aria-invalid", "true"); if (inputEl.focus) inputEl.focus(); return; }
  inputEl.removeAttribute("aria-invalid");
  const safe = (file.name || "file").replace(/[^a-zA-Z0-9._-]/g, "_").slice(0, 120);
  const objName = ck + "/" + Date.now() + "_" + safe;
  toast("Uploading…", "wait", 0); // hold until the outcome is known (was a 1.8s lie mid-upload)
  let r;
  try {
    r = await authedFetch(SB + "/storage/v1/object/client-uploads/" + objName, { method: "POST", body: file });
  } catch {
    // Keep the file selected so the retry is one tap, not a re-pick (finding: failure paths).
    toast("Upload failed — check your connection and retry", "err");
    return;
  }
  if (r === null) { toastClear(); return; }  // session dead; render() already fired
  if (!r.ok) { toast("Upload failed — please try again", "err"); return; }
  inputEl.value = "";                        // clear only once the upload actually succeeded
  toastClear();                              // drop the held "Uploading…" pill
  // client_asset (059, client-upload-asset-record): the real file record — filename/MIME/size/
  // checksum are only knowable client-side, at upload time. uploaded_by is left OFF the body
  // (the column defaults to auth.uid(), same reasoning as clientAskPost's created_by, verified
  // against 059's insert policy). FAIL-SOFT: if this table isn't applied yet (pre-059) the insert
  // 400s — warn and continue; the Storage upload above + the client_approval row below are the
  // EXISTING flow and must land regardless of whether this record does.
  try {
    const checksum = await sha256Hex(file);
    const assetBody = {
      client_key: ck, request_id: Number(requestId), storage_path: objName, filename: safe,
      mime_type: file.type || "", size_bytes: file.size, checksum: checksum, status: "received",
    };
    const ar = await authedFetch(SB + "/rest/v1/client_asset", { method: "POST", body: JSON.stringify(assetBody) });
    if (ar !== null && !ar.ok) console.warn("[clientUpload] client_asset insert failed (non-fatal, pre-059?):", ar.status);
  } catch (e) { console.warn("[clientUpload] client_asset insert failed (non-fatal, pre-059?):", e); }
  await clientApprovalWrite(requestId, "upload", "uploaded: " + safe, objName);
}

// The next card to select after logging `justLoggedSlug`: the top still-open card,
// mirroring render()'s done-sinks-to-bottom sort so the seller lands on real next work.
function sellerNextSel(justLoggedSlug) {
  const d = window._sellerData;
  if (!d) return null;
  const today = ptDay(new Date());
  const done = {};
  const latestDisp = {};
  const latestRow = {};
  asArr(d.log).forEach(function(r) {
    if (!r.prospect_slug) return;
    if (!(r.prospect_slug in latestDisp)) latestDisp[r.prospect_slug] = r.disposition;   // log is newest-first
    if (!(r.prospect_slug in latestRow)) latestRow[r.prospect_slug] = r;
    if (ptDay(r.called_at) === today && !done[r.prospect_slug]) done[r.prospect_slug] = 1;
  });
  // A terminal disposition (DNC/declined/wrong number) sinks the card on ANY day, not just
  // today, so it can't resurface as fresh work (W-3).
  Object.keys(latestDisp).forEach(function(s) { if (TERMINAL_DISP[latestDisp[s]]) done[s] = 1; });
  done[justLoggedSlug] = 1;
  const cards = asArr(d.queue).slice().sort(function(a, b) { return ((a.slug in done) ? 1 : 0) - ((b.slug in done) ? 1 : 0) || a.rank - b.rank; });
  const remaining = cards.filter(function(p) { return !(p.slug in done); });
  // Post-log auto-advance follows the SAME callback state model as the rail
  // (edge review LOW-2): actionable = overdue/due_soon per window._cbState, which
  // already excludes dnc_blocked — never advance-select a DNC-held lead. Fallback
  // to the raw callback_at rule only when no state map exists yet (first render).
  const cbSt = window._cbState || null;
  const _actionable = function(p) {
    if (cbSt) {
      const s = cbSt[p.slug];
      return !!(s && (s.state === "overdue" || s.state === "due_soon"));
    }
    const row = latestRow[p.slug];
    return !!(row && row.callback_at && new Date(row.callback_at).getTime() <= Date.now());
  };
  const _atMs = function(p) {
    const at = cbSt && cbSt[p.slug] ? cbSt[p.slug].at
      : (latestRow[p.slug] || {}).callback_at;
    const t = new Date(at).getTime();
    return isNaN(t) ? Infinity : t;   // garbage note timestamps sort last, never crash
  };
  const due = remaining.filter(_actionable).sort(function(a, b) { return _atMs(a) - _atMs(b); });
  // Fallbacks skip DO-NOT-DIAL leads (codex DEFECT-4): never auto-advance onto a
  // lead the seller must not call — dnc_blocked state or an intel-level DNC hold.
  const _noDial = function(p) {
    const s = cbSt && cbSt[p.slug];
    return (s && s.state === "dnc_blocked") || (p.intel && p.intel.dnc);
  };
  const freshOk = remaining.filter(function(p) { return !_noDial(p); });
  const anyOk = cards.filter(function(p) { return !_noDial(p); });
  return (due[0] && due[0].slug) || (freshOk[0] && freshOk[0].slug) || (anyOk[0] && anyOk[0].slug) || null;
}

  btn.classList.add('sel');

      const seller = esc(fillSellerName('[SELLER NAME]'));

}

// ── dial-card site condition (Griffin's mid-call intel) ──────────────────────
// Every field is optional — a card with intel={} (un-repushed / un-enriched row)

// md-lite renderer for seller kit blocks (script/objections) so raw '#', '**', '---'

function mdLite(s) {

// Plain-text summary of a markdown block for a 160-char card clip: skips '#' headings

function objectionSummary(md, n) {

  const rawLines = raw.split('\n').map((l) => l.replace(/\s+$/, ''));
  // Prefer a REAL objection→answer pair: a numbered "### N. "objection"" heading followed by
  // its first quoted blockquote rebuttal. Internal decision-tree routing lines ("→ branch 5")
  // are NOT the move — they're routing, useless read aloud (W-2).
  for (let i = 0; i < rawLines.length; i++) {
    const hm = rawLines[i].match(/^#{2,6}\s+\d+\.\s*(.*)$/);
    if (!hm) continue;

      const bm = rawLines[j].match(/^>\s*(.+)$/);

// The operator snapshot ships a "Drag to approve or reject." tail on content-approval

// Per-card stale indicator (stale-data-card-indicators): sourceRow is a source_status row

// caller already has, never a second freshness computation. Undefined/ok → '' (every
// existing metric() call site is unaffected — this is additive-only).
function staleTag(sourceRow) {
  if (!sourceRow) return '';
  const s = String(sourceRow.status || sourceRow.health || '').toLowerCase();
  if (!s || s === 'ok' || s === 'connected' || s === 'fresh') return '';
  // 'needed' = not connected YET — calling that "stale" would be exactly the

  // Sources status pill already tells that story honestly — no badge here.

function metric(label, value, note, tone, title, sourceRow) {

// The dial card is one function so the call button, DNC suppression, and the
// trust-tiered ✅/❌ stay co-located. Every field is optional → degrades to a
// name + flat signal line + call button when intel={}.
function callBtn(p) {
  if (p.intel && p.intel.dnc) return '<div class="dccall dnc">📵 DO NOT CALL — number withheld</div>';
  // Dial-time-enforcement ticket criterion 2: the call control must vanish the
  // moment a DNC disposition is recorded — not wait for the next queue refresh.
  // Covers BOTH holds the intel flag misses: a dnc_blocked callback state and a
  // just-logged do_not_contact disposition (window._attempts is newest-first and
  // is refreshed by the same render pass that follows logCall). The edge fn
  // re-checks the central DNC table server-side regardless — this is the UI half.
  const _st = (window._cbState || {})[p.slug];
  // ANY-row match, not newest-row (edge review LOW): a later logged disposition on
  // a DNC'd lead must not resurrect the dial button — DNC is permanent, no undo.
  const _everDnc = ((window._attempts || {})[p.slug] || []).some(function(r) { return r.disposition === 'do_not_contact'; });
  if ((_st && _st.state === 'dnc_blocked') || _everDnc) {
    return '<div class="dccall dnc">📵 DO NOT CALL — marked do-not-contact</div>';
  }
  if (!p.phone) return '';
  const e164 = toE164(p.phone);
  const tel  = String(p.phone == null ? "" : p.phone).replace(/[^0-9+]/g, "");
  const locked = !insideCallingHours();
  // Click-to-call bridge: rings the seller's own cell, then bridges to the prospect (recorded).
  // There is deliberately no native tel: fallback: it would bypass recording, DNC checks,
  // calling-hour enforcement, and the call-attempt audit trail while the UI still promised
  // a recorded call.
  // Rendered disabled outside CRTC hours; sellerHoursTick keeps it in sync as time passes.
  const btn = '<button class="dccall' + (locked ? ' hours-lock' : '') + '"' +
         (locked ? ' disabled title="Outside calling hours — dialing paused"' : '') +
         ' data-dial="' + esc(e164) + '" data-slug="' + esc(p.slug || '') +
         '" data-tel="' + esc(tel) + '"><svg class="i"><use href="#i-phone"/></svg> ' + esc(p.phone) + '</button>';
  // Persistent recording disclosure — dual-channel recording starts on answer, so the
  // seller must disclose BEFORE the prospect speaks. A one-time confirm isn't enough.
  return btn + '<div class="dial-disclose">🔴 Recorded call — tell the prospect it&rsquo;s being recorded before you begin.</div>' +
    '<div class="call-status" data-call-status hidden></div>';
}

// Distinct call-lifecycle states (twilio-tel-fallback-recording-mislabel criterion 3):
// real vocabulary from seller_call_attempts.status (migrations 048 + 056, the latter NOT YET
// APPLIED). 'seller-answered'/'bridging' from the ticket's own wording have NO matching column
// anywhere in that schema (Twilio's StatusCallback reports the OUTBOUND leg only) — inventing a
// UI state with no backing data would be exactly the dishonest display this bundle removes, so
// those two are deliberately NOT rendered; every state that DOES exist in the schema is.
const CALL_STATUS_LABEL = {
  initiating: ['Connecting…', 'wait'], ringing: ['Ringing…', 'wait'],
  connected: ['Connected', 'ok'], completed: ['Call completed', 'ok'],
  failed: ['Call failed', 'bad'], cancelled: ['Call cancelled', 'bad'],
  'no-answer': ['No answer', 'bad'], busy: ['Line busy', 'bad'],
};
const CALL_STATUS_TERMINAL = new Set(['completed', 'failed', 'cancelled', 'no-answer', 'busy']);
function paintCallStatus(el, status) {
  const info = CALL_STATUS_LABEL[status];
  if (!info) { el.hidden = true; el.className = 'call-status'; return; }
  el.hidden = false;

// Bounded, fail-soft poll of the attempt row this dial created. twilio-dial already writes

// instead of assuming "ringing" from a bare 200. connected/completed/no-answer/busy only ever
// appear once the (NOT YET DEPLOYED) twilio-status-callback function starts writing them

async function trackCallStatus(card, attemptId) {
  const el = card && card.querySelector('[data-call-status]');
  if (!el || attemptId == null) return;
  for (let i = 0; i < 6; i++) {
    let rows;
    try { rows = await rest("seller_call_attempts?id=eq." + encodeURIComponent(String(attemptId)) + "&select=status"); }
    catch { return; }
    const row = (!bad(rows) && Array.isArray(rows)) ? rows[0] : null;
    const status = row ? String(row.status || '') : '';
    if (!status) { el.hidden = true; el.className = 'call-status'; return; }
    paintCallStatus(el, status);
    if (CALL_STATUS_TERMINAL.has(status)) return;
    await actionWait(3000);
  }
}

// Mirror twilio-dial's server-side toE164NA so the POSTed number passes its E.164 gate.
function toE164(s) {
  const d = String(s || "").replace(/\D/g, "");
  if (d.length === 10) return "+1" + d;
  if (d.length === 11 && d[0] === "1") return "+" + d;
  return d ? "+" + d : "";
}

// Initiates the bridge via the twilio-dial edge fn (rings the seller's cell). The seller's JWT
// rides in hdr(); the edge fn re-checks role, queue membership, DNC, and calling hours.
async function dialBridge(btn) {
  const num = btn.getAttribute("data-dial");
  const slug = btn.getAttribute("data-slug");
  const tel = btn.getAttribute("data-tel");
  if (!num) { toast("This lead has no callable number", "err"); return; }
  // Guard against a misclick placing a real call: confirm ONCE per session, showing the number
  // and restating the recording disclosure the seller owes the prospect. After the first
  // acknowledged dial the blocking prompt is suppressed so a shift isn't a wall of confirms (W-10).
  if (!window._dialConfirmedThisSession) {
    if (!confirm("📞 Call " + (tel || num) + "?\n\nThis call is recorded — tell the prospect it's being recorded before you begin.\n\nYour phone rings first — answer it to be connected to the prospect.")) return;
    window._dialConfirmedThisSession = true;
  }
  btn.disabled = true; btn.classList.add('dialing'); const orig = btn.innerHTML; btn.textContent = "Connecting…";
  try {
    const r = await fetch(SB + "/functions/v1/twilio-dial", {
      method: "POST", headers: hdr(),
      body: JSON.stringify({ prospect_number: num, slug: slug }),
    });
    if (r.ok) {
      let payload = {};
      try { payload = await r.json(); } catch (e) {}
      if (payload.attempt_id != null) {
        const card = btn.closest('[data-card]');
        if (card) { card.dataset.attemptId = String(payload.attempt_id); trackCallStatus(card, payload.attempt_id); }
      }
      toast("Your phone is ringing — answer it and we'll connect you.");
    } else if (r.status === 403) toast("This number is blocked, outside calling hours, or no longer callable.", "err");
    else if (r.status === 503) toast("Recorded click-to-call is unavailable right now. No call was placed.", "err");
    else toast("Call failed (" + r.status + "). No call was placed — retry when ready.", "err");
  } catch (e) {
    toast("Network error — no call was placed. Check your connection and retry.", "err");
  } finally {
    btn.classList.remove('dialing'); btn.innerHTML = orig;
    // Re-lock immediately if the CRTC window closed while the call was connecting,
    // instead of leaving a live dial button outside hours until the next 60s tick.
    const ok = insideCallingHours();
    btn.disabled = !ok; btn.classList.toggle('hours-lock', !ok);
  }
}

// review-gap as proportional bars — 9 vs 12,146 lands harder as a bar than text
function gapViz(it) {
  const bar = (lab, n, max, kind) => {
    const w = max > 0 ? Math.max(n > 0 ? 5 : 2, Math.round((n / max) * 100)) : 2;
    return '<div class="gr"><span class="gr__l" title="' + esc(lab) + '">' + esc(lab) + '</span>' +
      '<span class="gr__t"><span class="gr__f ' + kind + '" style="width:' + w + '%"></span></span>' +
      '<span class="gr__n ' + (kind === 'them' ? 'them' : '') + '">' + (n != null ? esc(num(n)) : '—') + '</span></div>';
  };
  if (it.review_gap) {
    const t = Number(it.review_gap.theirs) || 0, r = Number(it.review_gap.rival_reviews) || 0, mx = Math.max(t, r, 1);
    return '<div class="gapv"><div class="gapv__t">Google reviews — them vs ' + esc(it.review_gap.rival || 'the local leader') + '</div>' +
      bar('Them', t, mx, 'them') + bar(it.review_gap.rival, r, mx, 'riv') + '</div>';
  }
  if (it.competitors && it.competitors.length) {
    const c0 = it.competitors[0];
    // If we have the prospect's own review count, draw an honest two-bar comparison.
    // Otherwise DON'T fake a lone maxed-out bar (which implied a comparison that isn't
    // there) — state the local leader as a single fact instead (W-11).
    const theirs = (it.gbp && it.gbp.reviews != null) ? Number(it.gbp.reviews) : null;
    if (theirs != null && c0.reviews != null) {
      const mx = Math.max(theirs, Number(c0.reviews), 1);
      return '<div class="gapv"><div class="gapv__t">Google reviews — them vs ' + esc(c0.name || 'the local leader') + '</div>' +
        bar('Them', theirs, mx, 'them') + bar(c0.name, Number(c0.reviews), mx, 'riv') + '</div>';
    }
    return '<div class="gapv"><div class="gapv__t">Local leader on Google Maps</div>' +
      '<p class="mut" style="margin:2px 0 0">' + esc(c0.name || 'The top-ranked rival') +
      (c0.reviews != null ? ' has ' + esc(num(c0.reviews)) + ' Google reviews' : '') +
      ' — no review count captured for this prospect to compare against.</p></div>';
  }
  return '';
}

// Momentum strip — reconstructed review/rival/rank velocity from prospect_signals_history.
// Every dynamic value rides through esc() into TEXT context; the only style-attribute value
// (bc) is one of three whitelisted constants. mspark's points come from esc'd-int arithmetic.
function mspark(vals) {
  if (!vals || !vals.length) return '';
  const w = 64, h = 18, pad = 2, n = vals.length;
  const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals), rng = (mx - mn) || 1;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const x = pad + i * (w - 2 * pad) / ((n - 1) || 1);
    const y = (mx === mn) ? h / 2 : (h - pad - ((vals[i] - mn) / rng) * (h - 2 * pad));
    pts.push(x.toFixed(1) + ',' + y.toFixed(1));
  }
  return '<svg width="' + w + '" height="' + h + '" style="flex:none"><polyline points="' + pts.join(' ') +
    '" fill="none" stroke="var(--warn)" stroke-width="1.5"/></svg>';
}
function momentumRow(it) {
  const m = it.momentum;
  if (!m || !m.status) return '';
  if (m.status === 'banking') {
    return '<div style="margin:9px 0;padding:8px 11px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:8px;font-size:12.5px;color:var(--mut)">' +
      '<b style="color:var(--text)">Momentum</b> — tracking; banking readings, first trend after the next check.</div>';
  }
  const vals = Array.isArray(m.vals) ? m.vals : [];
  const last = vals.length ? vals[vals.length - 1] : '';
  // Full-span "from" = last − net (net is over the WHOLE series), so the head numbers can't
  // disagree with the status/first/last even if vals is a truncated newest-8 window.
  const fromV = (typeof last === 'number' && typeof m.net === 'number') ? (last - m.net) : (vals.length ? vals[0] : last);
  let head;
  if (m.status === 'flat') head = '<b style="color:var(--warn)">Reviews frozen</b> — stuck at ' + esc(last) + ' for ' + esc(m.wks) + ' weeks';
  else if (m.status === 'down') head = '<b style="color:var(--bad)">Reviews slipping</b> — ' + esc(fromV) + ' → ' + esc(last);
  else head = 'Reviews climbing ' + esc(fromV) + ' → ' + esc(last) + ' — already improving';
  let sub = esc(m.n) + ' checks · ' + esc(m.first) + '→' + esc(m.last);
  if (m.rival && m.rival.name) sub += ' · rival ' + esc(m.rival.name) + ' ' + esc(m.rival.from) + '→' + esc(m.rival.to);
  if (m.rank && m.rank.from != null) sub += ' · map ' + esc(m.rank.from) + '→' + esc(m.rank.to);
  const bc = m.status === 'down' ? 'var(--bad)' : (m.status === 'up' ? 'var(--line)' : 'var(--warn)');
  return '<div style="margin:9px 0;padding:8px 11px;border:1px solid var(--line);border-left:3px solid ' + bc +
    ';border-radius:8px;display:flex;align-items:center;gap:10px">' + mspark(vals) +
    '<div style="flex:1;min-width:0"><div style="font-size:13px;color:var(--text)">' + head + '</div>' +
    '<div style="font-size:11px;color:var(--mut);margin-top:2px">' + sub + '</div></div>' +
    '<div style="font-family:ui-monospace,monospace;font-size:9px;color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:2px 6px;white-space:nowrap">rank·rival banking</div></div>';
}

// The evidence half of the dossier — visible proof for due diligence.
function evidenceBlock(it) {
  let dl = '';
  const w = it.website || {};
  if (w.status) {
    const live = w.status === 'confirmed' && w.url && /^https?:\/\//.test(w.url);
    const dom = w.url ? esc(w.url.replace(/^https?:\/\//, '').replace(/\/$/, '')) : '';
    const v = live ? ('<a href="' + esc(w.url) + '" target="_blank" rel="noopener" style="color:var(--accent)">' + dom + '</a> <span style="color:#6ee7b7">✓ live</span>')
      : (w.status === 'candidate' ? ((dom ? dom + ' ' : '') + '<span style="color:var(--warn)">— parked / dead, goes nowhere</span>')
        : (w.status === 'none-found' ? '<span style="color:var(--bad)">none — invisible online</span>' : esc(w.status)));
    dl += '<dt>Website</dt><dd>' + v + '</dd>';
  }
  if (it.gbp) {
    const g = it.gbp, parts = [];
    if (g.rating != null) parts.push('⭐ ' + esc(g.rating));
    if (g.reviews != null) parts.push(esc(num(g.reviews)) + ' reviews');
    if (g.category) {
      // Trade-aware category read (W / 023579d): the backend now emits gbp.category_match
      // ('match' | 'generic' | 'wrong-trade') + gbp.trade. Render the POSITIVE match, an
      // ACCURATE wrong-trade flag naming the emitted trade (never a false "not HVAC"), or the
      // generic flag. Fall back to the old generic-only heuristic — which never asserts a
      // wrong trade — when category_match is absent (older / un-repushed rows).
      const _cm = g.category_match ? String(g.category_match).toLowerCase() : '';
      const _trade = g.trade ? String(g.trade) : '';
      if (_cm === 'match') {
        parts.push('<span style="color:var(--ok)">' + esc(g.category) + (_trade ? ' ✓ matches ' + esc(_trade) : ' ✓ category match') + '</span>');
      } else if (_cm === 'wrong-trade') {
        parts.push('<span style="color:var(--bad)">' + esc(g.category) + (_trade ? ' — not ' + esc(_trade) : ' — wrong trade') + '</span>');
      } else if (_cm === 'generic') {
        parts.push('<span style="color:var(--warn)">' + esc(g.category) + ' (too generic)</span>');
      } else {
        const _generic = /^\s*(general\s+)?(contractor|home\s+services?|business|establishment|repair\s+service|services?)\s*$/i.test(g.category);
        parts.push('<span' + (_generic ? ' style="color:var(--warn)"' : '') + '>' + esc(g.category) + (_generic ? ' (too generic)' : '') + '</span>');
      }
    }
    dl += '<dt>Google</dt><dd>' + (parts.join(' · ') || '—') + '</dd>';
  } else {
    dl += '<dt>Google</dt><dd><span style="color:var(--bad)">no Business Profile found</span></dd>';
  }
  if (it.owner) {
    // De-dup the split guardrail: when the owner name is unverified or listed under
    // "Don't claim", grey/strike the Owner fact so it can't be read as a usable fact.
    const _oname = String(it.owner.name || '');
    const _dontClaim = (it.dont_claim || []).concat(it.dont_say || []);
    // Match the owner name as a WHOLE WORD inside a don't-claim entry (not a bare
    // substring — else a short name like "Al" matches "local"). Direction is safe:
    // when in doubt we grey the fact, never present an unverified name as usable.
    let _nameInDontClaim = false;
    if (_oname) {
      const _re = new RegExp('\\b' + _oname.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i');
      _nameInDontClaim = _dontClaim.some((s) => _re.test(String(s)));
    }
    const _ownerFlagged = it.owner.unverified || _nameInDontClaim;
    const _ownerNote = it.owner.unverified ? '⚠ don\'t claim — unverified' : '⚠ don\'t claim on the call';
    dl += '<dt>Owner</dt><dd' + (_ownerFlagged ? ' style="color:var(--mut);text-decoration:line-through"' : '') + '>' + esc(_oname) + (it.owner.title ? ' · ' + esc(it.owner.title) : '') +
      (_ownerFlagged ? ' <span class="mut" style="text-decoration:none">' + _ownerNote + '</span>' : '') + '</dd>';
  }
  if (it.email) dl += '<dt>Email</dt><dd>' + esc(it.email) + '</dd>';
  // A6 — site perf talking point (score + LCP from Places enrichment)
  if (it.site_perf) {
    const sp = it.site_perf;
    const score = sp.score != null ? esc(String(sp.score)) + '/100' : null;
    const lcp = sp.lcp ? 'LCP ' + esc(sp.lcp) : null;
    const spTxt = [score, lcp].filter(Boolean).join(' · ');
    if (spTxt) dl += '<dt>Site</dt><dd>' + spTxt + '</dd>';
  }
  // A5 — prior call history intentionally NOT shown here: the LIVE attempt pill
  // (attemptPillFor, from seller_call_log) is the current source of truth and the baked
  // it.prior_call could disagree with it. Two conflicting "last contact" facts is worse
  // than one live one (W-13).
  let h = '<div class="cond"><dl>' + dl + '</dl>';
  if (it.map_pack && it.map_pack.length) {
    h += '<div class="cond__sec">Map pack — core queries</div>';
    h += it.map_pack.map((m) => '<div class="maprow"><span>' + esc(m.q) + '</span>' +
      (m.rank != null ? '<span class="hit">#' + esc(m.rank) + '</span>' : '<span class="miss">not in pack</span>') + '</div>').join('');
  }
  if (it.competitors && it.competitors.length) {
    h += '<div class="cond__sec">Who\'s winning the map</div><div class="cgrid">';
    h += it.competitors.map((c) => '<div><span>' + esc(c.name) + '</span><span class="mut">' +
      (c.reviews != null ? esc(num(c.reviews)) + ' rev' : '') + (c.rating != null ? ' · ⭐' + esc(c.rating) : '') + '</span></div>').join('');
    h += '</div>';
  }
  // verification status — surfaces the system's confidence so diligence is honest
  if (it.trust === 'low') {
    h += '<div class="verif" style="color:var(--warn)">⚠ Lower confidence — triple-check on the call before quoting anything</div>';
  } else {
    h += '<div class="verif">🛡 <b>Verified</b> · Google Places + adversarial crawl-check' + (it.trust ? ' · ' + esc(it.trust) + ' confidence' : '') + '</div>';
  }
  return h + '</div>';
}

// The verbatim verified hooks + the full don't-say list — the exact wording.
function wordingBlock(it) {
  let h = '';
  if (it.safe_to_say && it.safe_to_say.length) {
    h += '<div class="cond__sec">✅ Safe to say — exact wording</div><ul style="margin:0;padding-left:16px">' +
      it.safe_to_say.map((s) => '<li style="margin:3px 0;line-height:1.42">' + esc(s) + '</li>').join('') + '</ul>';
  }
  if (it.dont_say && it.dont_say.length) {
    h += '<div class="cond__sec">❌ Don\'t say — full list <span style="color:var(--bad)">(unverified)</span></div><ul style="margin:0;padding-left:16px">' +
      it.dont_say.map((s) => '<li style="margin:3px 0;line-height:1.42;color:#f0a8a8">' + esc(s) + '</li>').join('') + '</ul>';
  }
  return '<div class="cond">' + (h || '<p class="mut">No further wording.</p>') + '</div>';
}

// structured-call-outcome-fields (060, NOT YET APPLIED): the dial console's seller_call_log
// read is an EXPLICIT column list (trimmed on purpose, finding 55 — NOT select=*, despite
// what 060's own header comment assumes), so adding new columns to it 400s the whole read
// pre-060 exactly like every other enriched-select case in this file. Try the enriched list
// first (adds the fields most useful to glance at for "next caller" context — the rest of
// 060's columns stay write-only-for-now here, same reasoning finding 55 gave for trimming
// this select in the first place); fall back to the untouched pre-060 list on failure.
async function fetchSellerCallLog() {
  const enriched = await rest("seller_call_log?select=prospect_slug,prospect_name,disposition,note,conversation,callback_at,called_at,owner_or_gatekeeper,contact_name,objection_category,next_action,next_owner,next_due_at&order=called_at.desc&limit=300");
  if (!bad(enriched)) return enriched;
  return rest("seller_call_log?select=prospect_slug,prospect_name,disposition,note,conversation,callback_at,called_at&order=called_at.desc&limit=300");
}

      '<p class="auth-foot">Get help: <a href="mailto:zshef@rankwise.ca">zshef@rankwise.ca</a></p>' +

  if (role !== "seller" && role !== "operator") {
