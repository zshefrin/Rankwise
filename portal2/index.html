// ctOS pulse is its own truth contract. Findings are one input elsewhere in the
// portal, but zero findings must never be translated into "all systems green".
// Missing/malformed summary data fails closed to UNKNOWN.
const _CTOS_STATES=new Set(["healthy","attention","degraded","critical","stopped","unknown"]);
const _CTOS_SCHEMA="ctos.summary.v1";
const _CTOS_STALE_HOURS=8;
const _CTOS_SEMANTIC_STALE_DAYS=14;
// Per-state fallback text (F9e): a state with an empty reason used to render
// "healthy · ctOS status unavailable", which reads as a contradiction.
const _CTOS_FALLBACK_REASON={
  healthy:"all required ctOS checks passed",
  attention:"ctOS reported no reason for this state",
  degraded:"ctOS reported no reason for this state",
  critical:"ctOS reported no reason for this state",
  stopped:"full-stop kill switch is engaged",
  unknown:"ctOS status unavailable",
};
// F2 (MED, security review 2026-09-03). The snapshot is the ONLY clock the mast
// had, and under the global kill switch both of its producers halt: the scanner
// wrapper skips on the .brain_disarmed sentinel, and the pusher's _preflight.sh
// full-stop gate halts it too. So the last pre-stop "healthy" froze in the mast
// indefinitely and the operator saw green on a stopped system. The page now
// re-checks the scan's own timestamp against the browser clock every render.
// DOWNGRADE ONLY: this can send any state to unknown and can never produce
// healthy, so a wrong browser clock costs honesty in the safe direction. The 8h
// threshold and the "stale beats everything, including the kill switch" order
// mirror the builder's precedence exactly.
function _ctosScanAgeHours(value){
  if(typeof value!=="string")return null;
  // Require an explicit UTC offset. Date.parse() reads an offset-less date-time
  // as LOCAL time, which would silently disagree with the builder's UTC reading
  // by the viewer's timezone; unreadable is the honest answer.
  if(!/(?:[zZ]|[+-]\d{2}:?\d{2})$/.test(value.trim()))return null;
  const t=Date.parse(value);
  if(!Number.isFinite(t))return null;
  return (Date.now()-t)/3600000;
}
function ctosPulse(p){
  const raw=p&&p.ctos_summary;
  if(!raw||typeof raw!=="object"||!_CTOS_STATES.has(raw.state)
     ||raw.schema_version!==_CTOS_SCHEMA){
    return {state:"unknown",reason:_CTOS_FALLBACK_REASON.unknown,top_exceptions:[]};
  }
  let state=raw.state;
  let reason=String(raw.reason||_CTOS_FALLBACK_REASON[state]||_CTOS_FALLBACK_REASON.unknown);
  if(state!=="unknown"){
    const ageH=_ctosScanAgeHours(raw.scan_observed_at);
    if(ageH===null){
      state="unknown";
      reason="scan timestamp is missing or unreadable in this snapshot";
    }else if(ageH>_CTOS_STALE_HOURS){
      state="unknown";
      reason=`scan is ${ageH.toFixed(1)}h old (snapshot frozen?)`;
    }
    const semanticAge=Number(raw.semantic_age_days);
    if(state==="healthy"&&Number.isFinite(semanticAge)&&semanticAge>_CTOS_SEMANTIC_STALE_DAYS){
      state="attention";
      reason=`runtime scan is fresh, but map semantics are ${Math.round(semanticAge)}d old`;
    }
  }
  return {
    state:state,
    reason:reason,
    top_exceptions:Array.isArray(raw.top_exceptions)?raw.top_exceptions:[],
  };
}
function ctosPulseColor(state){
  if(state==="healthy")return "var(--ok)";
  if(state==="critical")return "var(--bad)";
  if(state==="stopped")return "var(--info)";

function ctosPulseText(p){

// record_revenue is _FORM_ONLY_ACTIONS server-side (operator_action_worker.py)
// — deliberately excluded from p.action_allowlist (that gate is for generic
// one-click buttons; a form-only action's safety story is the dedicated form
// + the worker's own _build_revenue_argv re-validation, same shape as
// content.approve/reject's handler-level checks). So this form is NOT gated
// on actionAllowed() — always rendered, always enqueueable, exactly as the
// backend expects it to be used. Client-side validation below mirrors
// _build_revenue_argv's bounds/order exactly (business/collected/mrr/city/
// client_id/note) so a rejection reads the same on both sides — the backend
// re-validates regardless; this is fail-fast UX, not the real gate.
const _HAS_CTRL_RE=/[\x00-\x1f]/;

function _revValidate(v){
  const business=(v.business||"").trim();
  if(!business)return "Business name is required.";
  if(business.length>200)return "Business name is too long (200 char max).";
  if(_HAS_CTRL_RE.test(business))return "Business name contains an invalid character.";
  const collected=Number(v.collected);
  if(!v.collected||!isFinite(collected)||collected<=0)return "Collected must be a positive number.";
  if(collected>1000000)return "Collected exceeds the sanity ceiling (1,000,000).";
  if(v.mrr){
    const mrr=Number(v.mrr);
    if(!isFinite(mrr)||mrr<0)return "Monthly recurring must be zero or a positive number.";
    if(mrr>1000000)return "Monthly recurring exceeds the sanity ceiling (1,000,000).";
  }
  const city=(v.city||"").trim();
  if(city&&(city.length>200||_HAS_CTRL_RE.test(city)))return "City is invalid.";
  const clientId=(v.clientId||"").trim();
  if(clientId&&!_CLIENT_ID_RE.test(clientId))return "Client slug must be lowercase letters/numbers/hyphens (60 char max).";
  const note=(v.note||"").trim();
  if(note&&(note.length>280||_HAS_CTRL_RE.test(note)))return "Note is too long or contains an invalid character.";
  return null;
}

// refresh policy (v1's, simplified): timed 2-min re-fetch, focus re-fetch with a
// 30s floor, manual refresh in the HUD, and the age pill re-renders every 30s so
// "Xm ago" never silently lies. Timers install ONCE; re-renders reuse LAST.
const LAST={p:null,updatedAt:null,srcNote:"",fetchedAt:0};
let _timersOn=false;
async function loadAndRender(reason){
  const epoch=PORTAL_EPOCH,seq=++PORTAL_READ_SEQ;
  const current=()=>_portalReadCurrent(epoch)&&seq===PORTAL_READ_SEQ;
  if(DEV){LAST.p=DEMO;LAST.updatedAt=new Date().toISOString();LAST.srcNote="DEV preview · illustrative data";
    render(LAST.p,LAST.updatedAt,LAST.srcNote);return}
  if(tok()&&!RWSession.requireRole(["operator"]))return;
  if(!tok()){
    // F-C (publish review #2): when we're ALREADY on the login screen (#em present), the 120s
    // timer and the window-focus refetch must NOT rebuild it — renderLogin() re-creates the
    // form and blanks a half-typed email. Only render login when we're arriving from a live
    // surface (no #em yet).
    if(document.getElementById("em"))return;
    return renderLogin();
  }
  try{
    const rows=await rest("operator_portal_snapshot?select=payload,updated_at&id=eq.1");
    if(!current())return;
    LAST.fetchedAt=Date.now();
    // F1 (publish review, silent-expiry half): a 401 → refresh-401 → _abandonSession clears
    // the token DURING this fetch, so a session that was live at the top guard is dead now.
    // Go to login instead of letting the F7 bad-branch below re-render the stale snapshot for
    // a dead session (the ~120s window the two-change fix left open). A LIVE outage keeps its
    // token (tok() stays truthy), so the F7 "show last-known during a blip" path is untouched.
    if(!tok())return renderLogin("Session expired — sign in again.");
    if(rows===null||(RWSession.bad&&RWSession.bad(rows))){  // unavailable is never "empty"
      if(LAST.p){toast("Snapshot read FAILED — showing data from "+ago(LAST.updatedAt),"err");render(LAST.p,LAST.updatedAt,LAST.srcNote);}
      else{render({action_allowlist:[]},null,"snapshot read FAILED — not an empty state");toast("Could not load snapshot","err");}
      return;
    }
    const row=Array.isArray(rows)&&rows[0];
    if(!row){render({},null,"snapshot table empty");return}
    LAST.p=row.payload||{};LAST.updatedAt=row.updated_at;LAST.srcNote="live · operator_portal_snapshot";
    if(VIEW==="work"){
      await loadWork();
      if(!current())return;
      if(WORK_SELECTED!=null)await loadWorkDetail(WORK_SELECTED);
    }
    if(VIEW==="review"||VIEW==="content_review")await loadReviewData(true);
    if(VIEW==="command"&&reason!=="boot")await Promise.all([loadReviewData(true),loadDecisions()]);
    if(!current())return;
    render(LAST.p,LAST.updatedAt,LAST.srcNote);
    if(reason==="manual")toast("Refreshed");
  }catch(e){
    if(!current())return;
    if(String(e.message)==="auth")return renderLogin("Session expired — sign in again.");
    if(LAST.p){toast("Refresh failed — showing data from "+ago(LAST.updatedAt),"err");}
    else{render({},null,"snapshot read failed — showing empty state");toast("Could not load snapshot","err");}
  }
}
// day-review 2026-08-28 C2: loadExceptions() was ONLY ever called once at boot
// (line ~1613), so the Exceptions view's age/overdue classification froze for
// the life of the tab -- a due_at/expires_at that passed after boot never
// surfaced, and a resolved exception never left. Wired into the existing 120s
// refetch (same cadence as the main snapshot) and re-bucketed for free on the
// existing 30s render tick (no extra fetch -- reuses EXC.items/EXC.decisions,
// same "reuses LAST" pattern the 30s age-pill tick already follows above).
function _reclassifyExceptions(){
  if(EXC&&EXC.items&&EXC.decisions)EXC=_classifyExceptions(EXC.items,EXC.decisions);
}
// R2 (security review #3, HIGH): the tick is COSMETIC (age pill) — it must
// never cost the operator their typing focus. While an input/textarea inside
// #app is focused, skip it entirely; the 120s data refetch still re-renders
// (fresh data beats the age pill, and render()'s focus snapshot covers it).
function _typingActive(){
  const el=document.activeElement;
  return !!(el&&(["INPUT","TEXTAREA","SELECT"].includes(el.tagName)||el.isContentEditable)&&el.closest("#app"));

function _cosmeticTick(){
  // F1 (publish review): a dead session (signed out / expired → no token) must not
  // repaint the stale snapshot over the login screen every 30s. Belt-and-suspenders
  // with renderLogin nulling LAST.p — this stops the tick before it even reads LAST.p.
  if(!_portalReadCurrent(PORTAL_EPOCH))return;

  // hydrateMedia tears down and re-signs every mounted <video> — a reel being
  // WATCHED restarted every 30s and cost a storage sign POST per media per
  // tick. Skip the cosmetic tick while playback is live; the 120s data
  // refetch still re-renders (fresh data beats uninterrupted playback).
  if(_mediaPlaying()||_typingActive())return;

}
function startTimers(){

  setInterval(()=>{loadAndRender("timer");if(DEV||(tok()&&RWSession.requireRole(["operator"])))_loadAuxAndRender(loadExceptions);},120000);
  setInterval(_cosmeticTick,30000);
  window.addEventListener("focus",()=>{if(Date.now()-LAST.fetchedAt>30000)loadAndRender("focus")});
}

function portalLogout(){

async function boot(){
  _resetPortalState();
  renderBootSkeleton();

    let ar;AUTH_REDIRECT_SETTLING=true;
    try{ar=RWSession.consumeAuthRedirect();}finally{AUTH_REDIRECT_SETTLING=false;}
    PORTAL_AUTH_ID=RWSession.sessionIdentity();
    if(ar.recovery)return renderSetNewPassword();
    if(ar.error)return renderLogin(ar.error);
    if(RWSession.tok()&&!RWSession.requireRole(["operator"]))return renderNoAccess();
    if(!tok())return renderLogin();

  _loadAuxAndRender(loadExceptions);

  // as loadArtifacts()/loadExceptions() above (unlike the nav-lazy CRI load).
  _loadAuxAndRender(loadDecisions);

// First-paint skeleton — boot() is async (auth settle + first fetch), and #app

  // on LAST.p — so a lingering LAST.p repaints the operator cockpit right over this login

  LAST.p=null;LAST.updatedAt=null;LAST.srcNote="";LAST.fetchedAt=0;

function renderLogin(msg){
  _resetPortalState();
  $("#app").innerHTML=`<div></div><main><div class="login"><h2>Rankwise Command</h2>
   <label for="em">Email</label>
   <input id="em" type="email" placeholder="you@rankwise.ca" autocomplete="username" spellcheck="false">
